<head>

<style>
:root {
  color-scheme: dark;
  --paper: #f8eed6;
  --muted: #d1cbb2;
  --gold: #f0cd8e;
  --glass: rgba(27, 34, 25, .86);
  --line: rgba(246, 225, 184, .25);
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #3b4733; }
body { color: var(--paper); }
#world { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#hud { position: absolute; inset: 0; pointer-events: none; }
.top, .bottom { position: absolute; left: max(24px, env(safe-area-inset-left)); right: max(24px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 14px; }
.top { top: max(23px, env(safe-area-inset-top)); align-items: flex-start; padding-right: 52px; }
.bottom { bottom: max(24px, env(safe-area-inset-bottom)); align-items: flex-end; }
.brand { min-width: 0; text-shadow: 0 2px 12px #24291f, 0 0 24px #202818; }
.brand p { margin: 0 0 5px; color: #fff0c9; font: 600 11px/1.3 Georgia, serif; letter-spacing: .19em; text-transform: uppercase; }
h1 { margin: 0; font-family: "Songti SC", "Noto Serif CJK SC", "SimSun", Georgia, serif; font-size: clamp(30px, 4.1vw, 58px); font-weight: 600; line-height: 1.05; letter-spacing: .09em; white-space: nowrap; }
.glass { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 24px #171e182d; backdrop-filter: blur(11px); }
.group { display: flex; gap: 3px; padding: 4px; min-width: 0; }
button {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-width: 0; min-height: 44px; border: 1px solid transparent; border-radius: 10px; padding: 0 13px;
  color: var(--muted); background: transparent;
  font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1.15;
  white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background .18s ease, color .18s ease, border-color .18s ease;
}
button:hover { background: #f7dfad18; color: var(--paper); }
button[aria-pressed="true"] { color: #2c301f; border-color: #fce0a7; background: var(--gold); }
button:focus-visible { outline: 2px solid #fff3c6; outline-offset: 2px; }
.daymark { font-size: 16px; font-weight: 500; line-height: 1; }
#hud-toggle { position: absolute; z-index: 2; top: max(27px, env(safe-area-inset-top)); right: max(24px, env(safe-area-inset-right)); width: 44px; padding: 0; color: var(--paper); }
.hud-mark { display: block; position: relative; width: 17px; height: 12px; border: 1px solid currentColor; border-radius: 2px; }
.hud-mark::after { position: absolute; bottom: 2px; left: 2px; right: 2px; height: 2px; border-radius: 1px; background: currentColor; content: ""; }
#hud-toggle[aria-expanded="false"] .hud-mark::after { opacity: .3; }
#hud[hidden] { display: none; }
.play-mark { width: 11px; height: 12px; display: inline-block; border-inline: 3px solid currentColor; }
#play[aria-pressed="false"] .play-mark { width: 0; height: 0; border: 6px solid transparent; border-right: 0; border-left: 10px solid currentColor; }
#speed { min-width: 47px; font-variant-numeric: tabular-nums; }
#sound { min-width: 81px; }
#boot { position: absolute; left: 50%; top: 49%; transform: translate(-50%, -50%); width: max-content; max-width: calc(100% - 30px); margin: 0; padding: 14px 20px; text-align: center; pointer-events: none; }
#boot[hidden] { display: none; }
@media (max-width: 760px) {
  .top, .bottom { left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: grid; }
  .top { top: max(14px, env(safe-area-inset-top)); padding: 0; gap: 11px; }
  .brand { padding: 2px 54px 0 3px; }
  .brand p { font-size: 9px; margin-bottom: 4px; }
  h1 { font-size: clamp(30px, 9vw, 44px); }
  #hud-toggle { top: max(14px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
  .bottom { bottom: max(12px, env(safe-area-inset-bottom)); gap: 7px; }
  .group { width: 100%; }
  .group button { flex: 1; padding: 0 4px; }
  .views { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .views button { font-size: 12px; }
  .daymark { font-size: 14px; }
}
@media (max-width: 355px) {
  .group { gap: 2px; }
  .group button { gap: 4px; font-size: 12px; }
  .views button { padding-inline: 1px; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<script id="meadow-app">
(async () => {
  'use strict';

  const state = { ready: false, frames: 0, mode: 'sunset', preset: 'overview', playing: true, sheepCount: 0, wheelAngle: 0 };
  Object.defineProperty(window, '__MEADOW_STATE__', { value: () => Object.freeze({ ...state }) });
  const boot = document.getElementById('boot');
  try {
    const encoded = document.getElementById('three-gz').textContent.trim();
    const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
    const decompressed = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const library = document.createElement('script');
    library.textContent = await new Response(decompressed).text();
    document.head.append(library);
    library.remove();
    if (window.THREE?.REVISION !== '187' || typeof window.OrbitControls !== 'function') {
      throw new Error('Three.js r187 or OrbitControls is unavailable');
    }
    start(window.THREE, window.OrbitControls);
  } catch (error) {
    console.error(error);
    boot.textContent = '牧野无法启动。请使用支持 WebGL 2 和 gzip 解压的浏览器。';
  }

  function start(T, OrbitControls) {
    const canvas = document.getElementById('world');
    const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFShadowMap;
    renderer.outputColorSpace = T.SRGBColorSpace;

    const scene = new T.Scene();
    scene.fog = new T.FogExp2(0xe3b785, .0094);
    const camera = new T.PerspectiveCamera(48, 1, .11, 1000);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = .075;
    controls.maxPolarAngle = Math.PI / 2 - .032;
    controls.minPolarAngle = .15;
    controls.minDistance = 4.8;
    controls.maxDistance = 100;
    controls.minTargetRadius = 0;
    controls.maxTargetRadius = 68;
    controls.cursor.set(0, 1, 0);
    controls.zoomToCursor = false;

    const TAU = 2 * Math.PI;
    const { sin, cos, sqrt, PI, exp } = Math;
    const { clamp, lerp, smoothstep } = T.MathUtils;
    const vec = (x, y, z) => new T.Vector3(x, y, z);
    const rgb = value => new T.Color(value);
    let seed = 151010;
    function random() {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    const range = (low, high) => lerp(low, high, random());
    const sample = list => list[Math.floor(random() * list.length)];
    const sim = { value: 0 };
    const isCompact = () => canvas.clientWidth < 760;
    const compactDetail = isCompact();

    const pond = { x: 8.35, z: -5.65, rx: 7.35, rz: 5.35, y: -.26, splashX: 2.59, splashZ: -2.67 };
    const house = { x: -4.15, z: -1.95, w: 9.2, d: 6.35 };
    const wheelAnchor = vec(1.40, 1.93, -3.58);
    const wheelRadius = 1.76;

    function shoreRadius(angle) {
      return 1 + .055 * sin(3 * angle + .4) + .038 * sin(5 * angle - 1.1)
        + .024 * cos(8 * angle) + .118 * exp(-((angle - 2.42) ** 2) / .115);
    }
    function shorePoint(angle, radius = 1) {
      const r = radius * shoreRadius(angle);
      return [pond.x + pond.rx * cos(angle) * r, pond.z + pond.rz * sin(angle) * r];
    }
    function lakeDistance(x, z) {
      const px = (x - pond.x) / pond.rx;
      const pz = (z - pond.z) / pond.rz;
      return Math.hypot(px, pz) / shoreRadius(Math.atan2(pz, px));
    }
    function groundHeight(x, z) {
      const yard = Math.hypot((x - 1.2) / 16.8, (z + 2) / 11.6);
      const rolling = 1.7 * sin(.108 * x + .054 * z) + 1.1 * cos(.142 * z - .067 * x)
        + .56 * sin(.227 * x - .164 * z) + .25 * cos(.43 * z + .273 * x);
      const distance = Math.hypot(x, z);
      const hills = (4.8 * sin(.039 * x + .025 * z) + 3.2 * cos(.036 * z - .018 * x)
        + 2.3 * sin(.063 * z - .024 * x)) * smoothstep(distance, 35, 135);
      const height = rolling * smoothstep(yard, .68, 1.65) + hills;
      if (x < -3 || x > 20 || z < -13 || z > 2) return height;
      const bank = lakeDistance(x, z);
      const basin = -.26 - 1.02 * (1 - smoothstep(bank, .31, 1));
      const rim = smoothstep(bank, .966, 1.115);
      return lerp(basin, height + .09 * (1 - smoothstep(bank, 1.12, 1.28)), rim);
    }

    const trailPaths = [
      new T.SplineCurve([[-4.45,2.73],[-4.05,5.25],[-1.8,7.25],[2.9,9.22],[7.55,12.9],[8.18,18.2],[5.05,24.3],[-.8,33.9],[-10,45],[-21.2,59]].map(p => new T.Vector2(...p))),
      new T.SplineCurve([[-.1,8.17],[3.25,6.6],[6.65,4.25],[9.3,2.8],[10.7,.48]].map(p => new T.Vector2(...p)))
    ];
    const trailPoints = trailPaths.map((curve, index) => curve.getSpacedPoints(index === 0 ? 101 : 29));
    function trailDistance(x, z) {
      if (x < -24 || x > 13 || z < 0 || z > 61) return 99;
      let closest = 99;
      trailPoints.forEach((points, index) => {
        for (let j = 1; j < points.length; j++) {
          const a = points[j - 1], b = points[j];
          const vx = b.x - a.x, vz = b.y - a.y;
          const u = clamp(((x - a.x) * vx + (z - a.y) * vz) / (vx * vx + vz * vz), 0, 1);
          const dx = x - a.x - u * vx, dz = z - a.y - u * vz;
          closest = Math.min(closest, (dx * dx + dz * dz) * (index ? 2.4 : 1));
        }
      });
      return sqrt(closest);
    }

    const boxGeometry = new T.BoxGeometry(1, 1, 1);
    const cylinder = new T.CylinderGeometry(.5, .5, 1, 10);
    const taper = new T.CylinderGeometry(.34, .5, 1, 9);
    const rockShape = new T.IcosahedronGeometry(1, 1);
    const leafShape = new T.IcosahedronGeometry(1, 2);
    const smallSphere = new T.SphereGeometry(1, 10, 7);
    const yAxis = vec(0, 1, 0);
    const temp = new T.Object3D();
    const staticBins = new Map();

    function texture(size, paint) {
      const surface = document.createElement('canvas');
      surface.width = size;
      surface.height = size;
      paint(surface.getContext('2d'), size);
      const map = new T.CanvasTexture(surface);
      map.colorSpace = T.SRGBColorSpace;
      map.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return map;
    }
    const woodMap = texture(192, (ctx, size) => {
      ctx.fillStyle = '#f6e6cb';
      ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 162; i++) {
        const y = random() * size, phase = range(0, TAU);
        ctx.strokeStyle = i % 4 === 0 ? 'rgba(255,255,240,.55)' : 'rgba(68,39,24,.14)';
        ctx.lineWidth = range(.4, 2);
        ctx.beginPath();
        for (let x = 0; x <= size; x += 4) {
          const wave = y + 2.4 * sin(x * .048 + phase) + 1.1 * sin(x * .154 + phase);
          if (!x) ctx.moveTo(x, wave);
          else ctx.lineTo(x, wave);
        }
        ctx.stroke();
      }
      for (const [x, y] of [[36, 56], [138, 141]]) {
        for (let i = 0; i < 5; i++) {
          ctx.strokeStyle = 'rgba(67,37,15,.24)';
          ctx.beginPath();
          ctx.ellipse(x, y, 2 + 5 * i, .8 + 1.4 * i, -.05, 0, TAU);
          ctx.stroke();
        }
      }
    });
    const barkMap = texture(128, (ctx, size) => {
      ctx.fillStyle = '#eae6d8';
      ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 93; i++) {
        ctx.fillStyle = i % 5 ? 'rgba(77,67,60,.29)' : 'rgba(57,46,40,.83)';
        ctx.fillRect(range(-10, size), random() * size, range(2, 34), range(.6, 3.1));
      }
    });
    const std = (options = {}) => new T.MeshStandardMaterial({ roughness: .9, ...options });
    const timber = std({ map: woodMap });
    const endGrain = std();
    const brick = std();
    const stone = std({ flatShading: true });
    const oldIron = std({ color: 0x3d3025, metalness: .42, roughness: .55 });
    const leaves = std({ flatShading: true });
    const birchBark = std({ map: barkMap });
    const wool = std({ roughness: 1 });
    const animal = std({ roughness: .87 });
    const dark = std({ color: 0x29231f, roughness: .56 });
    const windowGlass = std({ color: 0xc27f44, emissive: 0xffa34f, emissiveIntensity: .8, roughness: .38 });
    const lanternGlass = std({ color: 0xf5b66e, emissive: 0xff923b, emissiveIntensity: 1 });
    const reedSurface = std({ side: T.DoubleSide });

    function addStatic(geometry, material, pos, scale, tint = 0xffffff, rotation = null, cast = true) {
      const key = geometry.uuid + '/' + material.uuid + '/' + cast;
      if (!staticBins.has(key)) staticBins.set(key, { geometry, material, cast, matrices: [], colors: [] });
      const bin = staticBins.get(key);
      temp.position.set(...pos);
      temp.scale.set(...scale);
      if (rotation?.isQuaternion) temp.quaternion.copy(rotation);
      else temp.rotation.set(...(rotation || [0, 0, 0]));
      temp.updateMatrix();
      bin.matrices.push(temp.matrix.clone());
      bin.colors.push(tint);
    }
    const box = (pos, scale, tint, rotation, material = timber, cast = true) => addStatic(boxGeometry, material, pos, scale, tint, rotation, cast);
    function branch(a, b, diameter, material, tint, geometry = taper, cast = true) {
      const start = vec(...a), end = vec(...b);
      const offset = end.clone().sub(start);
      const orientation = new T.Quaternion().setFromUnitVectors(yAxis, offset.clone().normalize());
      addStatic(geometry, material, start.lerp(end, .5).toArray(), [diameter, offset.length(), diameter], tint, orientation, cast);
    }
    function rock(x, y, z, s, tint, cast = true) {
      addStatic(rockShape, stone, [x, y, z], [s * range(.92, 1.4), s * range(.5, .76), s * range(.69, 1.12)],
        tint, [range(-.2, .35), range(0, TAU), range(-.15, .22)], cast);
    }
    function materializeStatic() {
      for (const { geometry, material, cast, matrices, colors } of staticBins.values()) {
        const instances = new T.InstancedMesh(geometry, material, matrices.length);
        instances.castShadow = cast;
        instances.receiveShadow = true;
        matrices.forEach((matrix, i) => {
          instances.setMatrixAt(i, matrix);
          instances.setColorAt(i, rgb(colors[i]));
        });
        instances.computeBoundingSphere();
        scene.add(instances);
      }
      staticBins.clear();
    }

    const light = new T.DirectionalLight(0xffd39a, 2.45);
    light.castShadow = true;
    light.shadow.mapSize.set(compactDetail ? 1536 : 2048, compactDetail ? 1536 : 2048);
    light.shadow.camera.left = -28;
    light.shadow.camera.right = 28;
    light.shadow.camera.top = 27;
    light.shadow.camera.bottom = -27;
    light.shadow.camera.near = .5;
    light.shadow.camera.far = 130;
    light.shadow.normalBias = .036;
    light.shadow.bias = -.00013;
    light.shadow.radius = 2.2;
    light.target.position.set(0, 0, -.8);
    const hemi = new T.HemisphereLight(0xffdfb3, 0x6f6743, 1.46);
    const fill = new T.DirectionalLight(0xb8d4df, .60);
    fill.position.set(5, 7, 10);
    const porchLight = new T.PointLight(0xffab57, 18, 8, 2);
    porchLight.position.set(-2.78, 2.54, 2.88);
    const wallLight = new T.PointLight(0xff9c4d, 11, 7, 2);
    wallLight.position.set(.92, 2.15, -.07);
    const backLight = new T.PointLight(0xffa755, 12, 8, 2);
    backLight.position.set(-2.12, 2.24, -5.5);
    scene.add(light, light.target, hemi, fill, porchLight, wallLight, backLight);

    const looks = {
      morning: { sun:[-.71,.49,-.52], sunColor:0xffedc0, sunPower:2.55, skyTop:0x508fbe, skyRim:0xe9daba, clouds:0xfff5d6, fog:0xcbd4ab, density:.0084, hemi:0xe4f3ff, soil:0x7c7b54, ambient:1.55, fill: .65, lamps: .13, water:0x398580, stars:0, exposure:1.15 },
      sunset: { sun:[-.82,.083,-.62], sunColor:0xffbd77, sunPower:2.45, skyTop:0x6886ac, skyRim:0xf4ba82, clouds:0xffd4a6, fog:0xe8be91, density:.0092, hemi:0xf8dfba, soil:0x78674b, ambient:1.46, fill: .67, lamps: .77, water:0x387974, stars:0, exposure:1.16 },
      night: { sun:[-.71,.21,-.64], sunColor:0x9bb9ff, sunPower:.82, skyTop:0x141d3e, skyRim:0x3b4b73, clouds:0x5b6891, fog:0x40496a, density:.0108, hemi:0x96b4f1, soil:0x494570, ambient:.86, fill: .26, lamps: 1.65, water:0x223f68, stars:1, exposure:1.09 }
    };
    const sunset = looks.sunset;
    const sky = {
      top: { value: rgb(sunset.skyTop) }, rim: { value: rgb(sunset.skyRim) },
      cloudTint: { value: rgb(sunset.clouds) }, sunTint: { value: rgb(sunset.sunColor) },
      sunDir: { value: vec(...sunset.sun).normalize() }, night: { value: 0 }, time: sim
    };
    const noiseGLSL = `
      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float noise21(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash21(i),hash21(i + vec2(1.,0.)),u.x),
                   mix(hash21(i + vec2(0.,1.)),hash21(i + vec2(1.,1.)),u.x),u.y);
      }
    `;
    const skydome = new T.Mesh(new T.SphereGeometry(730, 44, 26), new T.ShaderMaterial({
      side: T.BackSide, depthWrite: false, uniforms: sky,
      vertexShader: `
        varying vec3 domeDirection;
        void main() {
          domeDirection = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.);
        }`,
      fragmentShader: `
        uniform vec3 top, rim, cloudTint, sunTint, sunDir;
        uniform float night, time;
        varying vec3 domeDirection;
        ${noiseGLSL}
        void main() {
          vec3 d = normalize(domeDirection);
          float y = max(d.y,0.);
          vec3 color = mix(rim, top, smoothstep(0., .81, pow(y, .63)));
          float arc = acos(clamp(dot(d,sunDir),-1.,1.));
          float halo = exp(-arc * (4.7 + night*9.))*.33 + exp(-arc * 35.)*.36;
          color += sunTint * halo * (1. - night*.72);
          float sun = 1. - smoothstep(.020, .024, arc);
          vec3 moonShift = normalize(sunDir + vec3(.014,.008,-.012));
          float cut = 1. - smoothstep(.019,.022,acos(clamp(dot(d,moonShift),-1.,1.)));
          color += sunTint * sun * mix(3.3, 1.9*(1.-cut), night);

          vec2 p = d.xz / (.22 + y) * vec2(2.9,5.9) + vec2(time*.013,2.28);
          float n = noise21(p)*.56 + noise21(p*2.09+1.4)*.27 + noise21(p*4.15)*.12 + noise21(p*8.2)*.05;
          float cover = smoothstep(.48,.68,n) * smoothstep(.024,.18,y) * (1. - smoothstep(.67,.96,y));
          float edge = smoothstep(.46,.57,n) - smoothstep(.56,.71,n);
          vec3 cloud = mix(cloudTint*.63, cloudTint*1.1, smoothstep(.48,.77,n) + edge*.24);
          color = mix(color, cloud, cover * mix(.79,.39,night));
          gl_FragColor = vec4(color, 1.);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    }));
    skydome.frustumCulled = false;
    skydome.renderOrder = -100;
    scene.add(skydome);

    const starData = [];
    const starSizes = [];
    for (let i = 0; i < 740; i++) {
      const theta = range(0, TAU), y = range(.095, .99), r = sqrt(1 - y * y);
      starData.push(661 * r * cos(theta), 661 * y, 661 * r * sin(theta));
      starSizes.push(range(.55, 1.8) ** 1.23);
    }
    const starGeometry = new T.BufferGeometry();
    starGeometry.setAttribute('position', new T.Float32BufferAttribute(starData, 3));
    starGeometry.setAttribute('size', new T.Float32BufferAttribute(starSizes, 1));
    const starMaterial = new T.ShaderMaterial({
      transparent: true, depthWrite: false, blending: T.AdditiveBlending,
      uniforms: { alpha: sky.night, time: sim, dpr: { value: 1 } },
      vertexShader: `
        attribute float size; uniform float time, dpr; varying float sheen;
        void main(){
          sheen = (.66 + .34*sin(time*.94 + position.x*.41 + position.z*.2)) * smoothstep(55.,190.,position.y);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.);
          gl_PointSize = (1. + size*1.6) * dpr;
        }`,
      fragmentShader: `
        uniform float alpha; varying float sheen;
        void main(){
          float r = length(gl_PointCoord-.5);
          gl_FragColor = vec4(.81,.88,1.,alpha*sheen*(1.-smoothstep(.04,.5,r)));
        }`
    });
    const stars = new T.Points(starGeometry, starMaterial);
    scene.add(stars);

    function buildGround() {
      const coords = [0];
      for (let p = .34; p < 24.5; p += .34) coords.push(p);
      for (let p = 25; p < 845; p += Math.max(.7, (p - 21) * .085)) coords.push(p);
      coords.push(870);
      const axis = coords.slice(1).reverse().map(n => -n).concat(coords);
      const positions = [], colors = [], faces = [];
      const low = rgb(0x526c32), middle = rgb(0x80994b), high = rgb(0x9ba952);
      const track = rgb(0xb28a63), clay = rgb(0xd2ab76), silt = rgb(0x665647);
      const tint = new T.Color(), blended = new T.Color();
      for (const z of axis) {
        for (const x of axis) {
          const y = groundHeight(x, z);
          positions.push(x, y, z);
          const band = .53 + .20 * sin(.52*x + .33*z) + .10 * cos(z*.72 - x*.2)
            + .12 * sin(z*.22 + x*.19) + .06 * sin(3.17*x+2.49*z);
          tint.copy(low).lerp(middle, smoothstep(band,.14,.69)).lerp(high,smoothstep(band,.64,.96)*.68);
          const path = trailDistance(x, z);
          if (path < 1.72) {
            const edge = path + .09 * sin(x * 5.3 + z * 4.1) + .09 * cos(x * 2.2 - z * 6.7);
            blended.copy(track).lerp(clay, .50 + .19 * sin(z * .91 + x * .64));
            tint.lerp(blended, 1 - smoothstep(edge, .81, 1.48));
          }
          if (x > -2 && x < 20 && z > -13 && z < 2.2) {
            tint.lerp(silt, 1 - smoothstep(lakeDistance(x, z), .91, 1.10));
          }
          colors.push(tint.r, tint.g, tint.b);
        }
      }
      const width = axis.length;
      for (let z = 0; z < width - 1; z++) for (let x = 0; x < width - 1; x++) {
        const a = z * width + x;
        faces.push(a, a + width, a + 1, a + 1, a + width, a + width + 1);
      }
      const geometry = new T.BufferGeometry();
      geometry.setIndex(faces);
      geometry.setAttribute('position', new T.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new T.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      const material = std({ vertexColors: true });
      material.onBeforeCompile = shader => {

    buildGround();

    function buildCottage() {
      const front = house.z + house.d / 2, back = house.z - house.d / 2;

      const logTints = [0xa77448, 0x925c37, 0xb78454, 0x9d673e, 0x815231, 0xb07947];

      box([house.x, .18, house.z], [house.w + .28, .64, house.d + .32], 0x514d44, null, stone);

          for (const sign of [-1, 1]) {
            addStatic(cylinder, endGrain, [house.x + sign * (length * .5 + .009), y, z], [.225, .016, .225], sample([0xd3a778,0xba8b5e,0xc59461]), [0, 0, PI / 2]);

          for (const sign of [-1, 1]) {

      const ridge = 6.45, eave = 3.75, run = 3.89;

      const slope = Math.hypot(run, ridge - eave);
      for (const sign of [-1, 1]) {
        const angle = pitch * sign;
        box([house.x, (ridge + eave) / 2, house.z + sign * run * .5], [10.52, .18, slope + .14], 0x4f3b31, [angle,0,0]);
        const rows = 12;
        const columns = 23;
        for (let row = 0; row < rows; row++) {
          const along = (row + .5) * slope / rows;
          const z = house.z + sign * along * cos(pitch);
          const y = ridge - along * sin(pitch) + .105;
          for (let column = 0; column < columns; column++) {
            const shift = row % 2 * .19;
            const x = house.x - 5.02 + column * .448 + shift;
            box([x, y + range(-.014,.016), z], [.413, range(.075,.114), .442], sample(slate), [angle, range(-.026,.026), range(-.018,.018)]);
          }
        }
        for (const x of [left - .73, right + .73]) {
          box([x, (ridge + eave) * .5, house.z + sign * run * .5], [.18, .31, slope + .22], beam, [angle, 0, 0]);
          box([x + .012, (ridge + eave) * .5 + .10, house.z + sign * run * .5], [.19, .067, slope + .25], trim, [angle, 0, 0]);
        }
        box([house.x, eave - .055, house.z + sign * (run + .025)], [10.82,.23,.16], beam);
      }
      box([house.x, ridge + .12, house.z], [10.83,.23,.27], 0x6a4a37);
      for (const x of [left - .016, right + .016]) {
        for (let row = 0; row < 14; row++) {
          const y = 3.91 + row * .173;
          const width = Math.max(.13, (ridge - y) / Math.tan(pitch) * 2 - .13);

      function windowAt(x, y, z, width, height, yaw, shutters) {
        const local = (u, v, d) => [x + u*cos(yaw) + d*sin(yaw), y + v, z - u*sin(yaw) + d*cos(yaw)];
        const board = (u,v,d,sx,sy,sz,tint,mat = timber, cast = true) =>

        board(0,0,.02,width+.28,height+.27,.16,0x49372a);

        for (const sign of [-1,1]) {

      windowAt(-7.01, 2.03, front+.17, 1.26, 1.27, 0, true);
      windowAt(-1.05, 2.03, front+.17, 1.15, 1.25, 0, true);

      windowAt(-2.25, 2.19, back-.17, 1.37, 1.16, PI, true);
      windowAt(right+.17, 2.26, -.57, .90, 1.03, PI/2, true);
      windowAt(right+.22, 4.75, house.z, .70, .67, PI/2, false);

      const doorway = -4.45;
      box([doorway,1.52,front+.162], [1.67,2.43,.22], 0x563e2d);

      addStatic(smallSphere, oldIron, [doorway+.48,1.51,front+.427], [.084,.079,.071]);

      const porchX = -4.48, porchZ = 2.04;
      box([porchX, .33, porchZ], [4.05,.27,2.21], beam);
      for (let i = 0; i < 16; i++) box([porchX-1.9+i*.252,.492,porchZ], [.238,.11,2.22], sample(plank));
      for (let i = 0; i < 3; i++) {
        box([doorway,.09+i*.128,3.78-i*.26], [1.88,.18,.36], sample(plank));
      }
      for (const dx of [-1.83,1.83]) {
        const x = porchX + dx;
        rock(x,.12,2.99,.28,0x77715e);
        box([x,1.81,2.98], [.21,2.63,.21], beam);
        branch([x,2.63,2.99],[x,3.11,2.42],.14,timber,trim,boxGeometry);
        box([x,.92,2.30], [.105,.11,1.24], trim);

      box([porchX,3.17,2.97], [4.17,.22,.22], beam);
      const porchAngle = .275;
      box([porchX,3.46,2.14], [4.42,.13,2.27], beam,[porchAngle,0,0]);
      for (let j = 0; j < 6; j++) for (let i = 0; i < 11; i++) {
        const dz = -.94 + .382*j;
        box([porchX-2.02+i*.405,3.55-dz*.282,2.14+dz], [.382,.082,.422], sample(slate), [porchAngle,0,0]);
      }

      const lampX = -2.89, lampZ = 2.86;
      branch([lampX,3.15,lampZ],[lampX,2.76,lampZ],.032,oldIron,0xffffff,cylinder);
      box([lampX,2.54,lampZ], [.19,.31,.19], 0xffffff, null, lanternGlass, false);
      for (const y of [2.35,2.735]) box([lampX,y,lampZ], [.27,.076,.27], 0xffffff,null,oldIron);
      for (const dx of [-.11,.11]) for (const dz of [-.11,.11]) {

      function woodpile(x,z, rows) {
        for (let row = 0; row < rows; row++) for (let i = 0; i < rows + 2 - row; i++) {
          const lx = x + i * .208 + row * .105, ly = .16 + row * .169, lz = z + range(-.034,.034);
          const diameter = range(.158,.235);

      woodpile(-7.68,-5.49,3);
      box([-6.96,.107,1.88], [1.42,.14,.64],beam);

      const chimney = { x: -6.95, z: -2.57, base: 5.39, top: 7.88 };
      box([chimney.x,6.585,chimney.z],[.85,2.38,.76],0x5d4840,null,stone);

    const chimney = buildCottage();
    const smokeMap = texture(96, (ctx, size) => {

    const smoke = [];

    function animateSmoke(t) {

    function makeSurfaceMaterial({ tint, opacity, flow }) {
      const uniforms = T.UniformsUtils.merge([T.UniformsLib.fog, {
        waterTint: { value: rgb(tint) }, skyTint: { value: rgb(sunset.skyRim) },
        sunDir: { value: sky.sunDir.value.clone() }, opacity: { value: opacity },
        current: { value: flow }, center: { value: vec(pond.splashX,pond.y,pond.splashZ) }
      }]);
      uniforms.time = sim;
      return new T.ShaderMaterial({
        uniforms, transparent: true, depthWrite: false, side: T.DoubleSide, fog: true,
        vertexShader: `
          uniform float time, current;
          varying vec3 waterWorld;
          varying vec2 waterUV;
          #include <fog_pars_vertex>
          void main(){
            waterUV = uv;
            vec4 world = modelMatrix*vec4(position,1.);
            if(current<.5){
              world.y += (sin(world.x*2.3 + world.z*.9-time*1.6) + sin(world.z*2.7-world.x*.66+time*1.1))*.011;
            }
            waterWorld = world.xyz;
            vec4 mvPosition = viewMatrix*world;
            gl_Position = projectionMatrix*mvPosition;
            #include <fog_vertex>
          }`,
        fragmentShader: `
          uniform vec3 waterTint, skyTint, sunDir, center;
          uniform float time, opacity, current;
          varying vec3 waterWorld;
          varying vec2 waterUV;
          #include <fog_pars_fragment>
          ${noiseGLSL}
          void main(){
            vec2 p = waterWorld.xz;
            vec3 eye = normalize(cameraPosition-waterWorld);
            float a = p.x*2.3+p.y*.9-time*1.6;
            float b = p.y*2.7-p.x*.66+time*1.1;
            float c = dot(p,vec2(4.8,-4.4)) + time*.9;
            vec3 normal = normalize(vec3(-.036*cos(a)+.013*cos(b)-.021*cos(c),1.,-.039*cos(b)-.015*cos(a)+.025*cos(c)));
            float fresnel = pow(1.-clamp(dot(normal,eye),0.,1.),3.);
            float spec = pow(max(dot(reflect(-sunDir,normal),eye),0.),36.);
            float fine = noise21(p*5.1 + vec2(time*.36,-time*.22));
            vec3 color = mix(waterTint*(.76+.20*fine),skyTint,mix(.13,.65,fresnel));
            color += vec3(1.,.78,.54)*spec*.7;
            float alpha = opacity + fresnel*.14;
            if(current<.5){
              float r = distance(p,center.xz);
              float ripple = pow(.5+.5*cos(r*18.-time*6.7),13.) * exp(-r*.88);
              color += vec3(.57,.76,.69)*ripple*.47;
              color = mix(color,skyTint,smoothstep(.94,1.,waterUV.x)*.14);
            } else {
              vec2 stream = vec2(waterUV.x*14.,waterUV.y*11. - time*4.3);
              float streak = noise21(stream*.92) + .5*noise21(stream*2.9);
              float foam = smoothstep(.75,1.2,streak);
              color = mix(color, vec3(.64,.86,.80) + skyTint*.15, foam*.65);
              alpha *= smoothstep(.0,.141,waterUV.x)*(1.-smoothstep(.859,1.,waterUV.x));
            }
            gl_FragColor = vec4(color,clamp(alpha,0.,1.));
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
            #include <fog_fragment>
          }`
      });

    const lakeMaterial = makeSurfaceMaterial({ tint: sunset.water, opacity: .70, flow: 0 });
    const streamMaterial = makeSurfaceMaterial({ tint: 0x69aca3, opacity: .90, flow: 1 });

    function buildPond() {
      const positions = [pond.x, pond.y, pond.z], uvs = [0,0], indices = [];
      const rings = 16, segments = 128;
      for (let j = 1; j <= rings; j++) {
        const r = j / rings;
        for (let i = 0; i < segments; i++) {
          const angle = i / segments * TAU - PI;
          const [x,z] = shorePoint(angle, r * 1.018);
          positions.push(x,pond.y,z);
          uvs.push(r,i / segments);
          const point = 1 + (j-1)*segments + i;
          const next = 1 + (j-1)*segments + (i+1)%segments;
          if (j === 1) indices.push(0,next,point);
          else indices.push(point-segments,next,point,point-segments,next-segments,next);
        }
      }
      const geometry = new T.BufferGeometry();
      geometry.setAttribute('position',new T.Float32BufferAttribute(positions,3));

      geometry.setIndex(indices);

      for (let i = 0; i < 50; i++) {

        addStatic(lily,reedSurface,[x,y,z],[s,s,s],sample([0x5f8544,0x648949,0x789658,0x4f7e43,0x889c53]),[0,range(0,TAU),0],false);

          if (i % 5 === 0) {

      }

        box([dock.x+sign*.63,.12,-.69],[.14,.17,3.8],0x77583d);
        for (const z of [1,-.47,-2.15]) {
          const floor = groundHeight(dock.x+sign*.76,z);
          const top = z < -1 ? .52 : .63;
          box([dock.x+sign*.76,(floor+top)*.5,z],[.17,top-floor,.17],0x76543b);

    }
    buildPond();

    const wheel = new T.Group();
    wheel.position.copy(wheelAnchor);
    scene.add(wheel);
    const wheelWood = std({ map: woodMap, color: 0x916238 });
    const wetWood = std({ map: woodMap, color: 0xb38351, roughness: .65 });
    const bandWood = std({ map: woodMap, color: 0x755035 });
    function wheelPart(geometry, mat, pos, scale, rotation = null) {
      const mesh = new T.Mesh(geometry,mat);
      mesh.position.set(...pos);
      mesh.scale.set(...scale);

      filter.frequency.value=790;
      filter.Q.value=.65;
      oscillator.connect(filter);
      filter.connect(volume);
      volume.connect(audioMaster);
      volume.gain.setValueAtTime(.0002,now);
      volume.gain.exponentialRampToValueAtTime(.145,now+.10);
      volume.gain.exponentialRampToValueAtTime(.066,now+.31);
      volume.gain.exponentialRampToValueAtTime(.0001,now+.61);
      tremolo.start(now);
      oscillator.start(now);
      oscillator.stop(now+.62);
      tremolo.stop(now+.62);
    }
    function updateAudio(t,wallTime) {
      if (!audioOn) return;
      const now=audioContext.currentTime;
      const rangeToMill=Math.hypot(camera.position.x-wheelAnchor.x,camera.position.z-wheelAnchor.z);
      waterGain.gain.setTargetAtTime(.15+.40/(1+rangeToMill*.098),now,.14);
      airGain.gain.setTargetAtTime(.37+.12*sin(wallTime*.42),now,.25);
      if (state.playing && t>bellTime) {
        sheepSound('chime');
        bellTime=t+10+Math.random()*17;
      }
    }

    const playButton=document.getElementById('play');
    const speedButton=document.getElementById('speed');
    const hud=document.getElementById('hud');
    const hudToggle=document.getElementById('hud-toggle');
    const pace=[.5,1,2];
    let paceIndex=1;
    function togglePlaying() {
      state.playing=!state.playing;
      playButton.setAttribute('aria-pressed',String(state.playing));
      document.getElementById('play-label').textContent=state.playing?'暂停':'播放';
      if (audioOn) audioMaster.gain.setTargetAtTime(state.playing?.66:.28,audioContext.currentTime,.15);
    }
    function cycleSpeed() {
      paceIndex=(paceIndex+1)%pace.length;
      speedButton.textContent=pace[paceIndex]+'×';
      speedButton.setAttribute('aria-label','播放速度 '+pace[paceIndex]+' 倍');
    }
    function toggleHud() {
      hud.hidden=!hud.hidden;
      hudToggle.setAttribute('aria-expanded',String(!hud.hidden));
      hudToggle.setAttribute('aria-label',hud.hidden?'显示界面':'隐藏界面');
    }
    playButton.addEventListener('click',togglePlaying);
    speedButton.addEventListener('click',cycleSpeed);
    soundButton.addEventListener('click',toggleAudio);
    hudToggle.addEventListener('click',toggleHud);
    const modeButtons=[...document.querySelectorAll('[data-mode]')];
    const viewButtons=[...document.querySelectorAll('[data-preset]')];
    for (const button of modeButtons) button.addEventListener('click',() => {
      state.mode=button.dataset.mode;
      wantedLighting=lookValues(state.mode);
      modeButtons.forEach(control => control.setAttribute('aria-pressed',String(control===button)));
    });
    for (const button of viewButtons) button.addEventListener('click',() => {
      state.preset=button.dataset.preset;
      flyTo(state.preset);
      viewButtons.forEach(control => control.setAttribute('aria-pressed',String(control===button)));
    });
    window.addEventListener('keydown',event => {
      if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      const key=event.key.toLowerCase();
      if (event.code==='Space') {
        if (event.target instanceof HTMLButtonElement) return;
        event.preventDefault();
        togglePlaying();
      } else if (key==='m') {
        toggleAudio();
      } else if (key==='h') {
        toggleHud();
      }
    });

    let press=null;
    canvas.addEventListener('pointerdown',event => {
      press=event.isPrimary && event.button===0 ? { x:event.clientX,y:event.clientY,id:event.pointerId } : null;
    });
    canvas.addEventListener('pointermove',event => {
      if (press?.id===event.pointerId && Math.hypot(event.clientX-press.x,event.clientY-press.y)>8) press=null;
    });
    canvas.addEventListener('pointercancel',() => { press=null; });
    const hit=new T.Vector3();
    canvas.addEventListener('pointerup',event => {
      if (!press || press.id!==event.pointerId) return;
      const distance=Math.hypot(event.clientX-press.x,event.clientY-press.y);
      press=null;
      if (distance>8) return;
      const bounds=canvas.getBoundingClientRect();
      pointer.set(2*(event.clientX-bounds.left)/bounds.width-1,1-2*(event.clientY-bounds.top)/bounds.height);
      aim.setFromCamera(pointer,camera);
      let closest=Infinity, picked=null;
      for (const s of flock) {
        contact.center.copy(s.root.position);
        contact.center.y+=s.scale*1.04;
        contact.radius=s.scale*.92;
        if (aim.ray.intersectSphere(contact,hit)) {
          const distance=aim.ray.origin.distanceToSquared(hit);
          if (distance<closest) {
            closest=distance;
            picked=s;
          }
        }
      }
      if (picked) {
        picked.hop=.77;
        sheepSound('bleat');
      }
    });

    let previous=performance.now();
    let elapsed=0;
    function frame(now) {
      const delta=clamp((now-previous)/1000,0,.05);
      previous=now;
      elapsed+=delta;
      const step=state.playing ? delta*pace[paceIndex] : 0;
      sim.value+=step;
      updateLighting(delta);
      updateCamera(delta);
      animateMill(sim.value);
      animateSmoke(sim.value);
      animateFlock(sim.value,step,delta);
      updateAudio(sim.value,elapsed);
      renderer.render(scene,camera);
      state.frames++;
      if (!state.ready) {
        state.ready=true;
        boot.hidden=true;
      }
      requestAnimationFrame(frame);
    }
    frame(previous);
  }
})();
</script>
</body>
</html>
