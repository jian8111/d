<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Riding a Bicycle (Pro1)</title>
  <desc id="desc">A white pelican with an amber gular pouch riding a vintage teal coastal bicycle along a sunlit ocean boardwalk.</desc>
