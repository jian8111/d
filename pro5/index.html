<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle — 鹈鹕骑车 SVG 互动展示</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.72);
      --panel-border: rgba(148, 163, 184, 0.22);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #14b8a6;
      --accent-soft: rgba(20, 184, 166, 0.16);
      --pill-bg: rgba(30, 41, 59, 0.75);
      --pill-hover: rgba(51, 65, 85, 0.9);
      --shadow: 0 24px 64px rgba(2, 6, 23, 0.45);
    }

    body[data-ui="light"] {
      --bg: #f1f5f9;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-border: rgba(15, 23, 42, 0.1);
      --text: #0f172a;
      --muted: #475569;
      --accent: #0d9488;
      --accent-soft: rgba(13, 148, 136, 0.12);
      --pill-bg: rgba(241, 245, 249, 0.95);
      --pill-hover: rgba(226, 232, 240, 1);
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s ease, color 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
    }

    .title-group h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(20, 184, 166, 0.35);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stage-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .theme-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--panel-border);
      background: var(--pill-bg);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      background: var(--pill-hover);
      transform: translateY(-1px);
    }

    button.active {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(20, 184, 166, 0.35);
    }

    .controls-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--pill-bg);
      border: 1px solid var(--panel-border);
      padding: 5px 10px;
      border-radius: 10px;
    }

    .slider-wrap input[type="range"] {
      width: 96px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .svg-frame {
      width: 100%;
      position: relative;
      line-height: 0;
    }

    .svg-frame svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .footer-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 16px;
      border-top: 1px solid var(--panel-border);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .telemetry {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid rgba(45, 212, 191, 0.45);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.84rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.22s ease;
    }

    .header-actions a.btn-link {
      text-decoration: none;
      border: 1px solid var(--panel-border);
      background: var(--pill-bg);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions a.btn-link:hover {
      background: var(--pill-hover);
      transform: translateY(-1px);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body data-ui="dark">
  <div class="container">
    <header>
      <div class="title-group">
        <h1>
          鹈鹕骑车 · Pelican on a Bicycle
          <span class="badge">Pro5 · Pure SVG + 2-Bone IK</span>
        </h1>
        <p class="subtitle">纯矢量几何建模 + 实时逆向运动学双腿踩踏物理引擎 · 支持 5 种场景预设与 SVG 导出</p>
      </div>
      <div class="header-actions">
        <a class="btn-link" href="../index.html">← 返回目录</a>

  <script>
    (function () {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const REAR_AXLE = { x: 235, y: 355 };
      const FRONT_AXLE = { x: 565, y: 355 };
      const BB = { x: 365, y: 364 };
      const CRANK_R = 40;
      const NEAR_HIP = { x: 332, y: 184 };
      const FAR_HIP = { x: 338, y: 178 };
      const L1 = 116;
      const L2 = 112;

      function el(tag, attrs, parent) {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        if (parent) parent.appendChild(node);
        return node;
      }

      // Build spokes programmatically
      function buildSpokes(groupId, cx, cy, offsetDeg) {
        const g = document.getElementById(groupId);
        g.innerHTML = "";
        for (let i = 0; i < 14; i++) {
          const ang = ((i * 360) / 14 + offsetDeg) * Math.PI / 180;
          const hubAng = ang + (i % 2 === 0 ? 0.36 : -0.36);
          el("line", {
            x1: (cx + 9.5 * Math.cos(hubAng)).toFixed(1),
            y1: (cy + 9.5 * Math.sin(hubAng)).toFixed(1),
            x2: (cx + 66.5 * Math.cos(ang)).toFixed(1),
            y2: (cy + 66.5 * Math.sin(ang)).toFixed(1)
          }, g);
        }
        const vang = (245 + offsetDeg) * Math.PI / 180;
        el("line", {
          x1: (cx + 66.5 * Math.cos(vang)).toFixed(1),
          y1: (cy + 66.5 * Math.sin(vang)).toFixed(1),
          x2: (cx + 57.5 * Math.cos(vang)).toFixed(1),
          y2: (cy + 57.5 * Math.sin(vang)).toFixed(1),
          stroke: "#D97706",
          "stroke-width": "2.4",
          "stroke-linecap": "round"
        }, g);
      }

      // Build toothed chainring
      function buildChainring() {
        const g = document.getElementById("chainring-group");
        g.innerHTML = "";
        const pts = [];
        const teeth = 28;
        for (let i = 0; i < teeth * 2; i++) {
          const ang = (i * 360 / (teeth * 2)) * Math.PI / 180;
          const r = i % 2 === 0 ? 26.5 : 23.2;
          pts.push(`${(BB.x + r * Math.cos(ang)).toFixed(1)},${(BB.y + r * Math.sin(ang)).toFixed(1)}`);
        }
        el("path", { d: "M " + pts.join(" L ") + " Z", fill: "#CBD5E1", stroke: "#475569", "stroke-width": "1.4" }, g);
        el("circle", { cx: BB.x, cy: BB.y, r: "19", fill: "#E2E8F0", stroke: "#64748B", "stroke-width": "1.5" }, g);
        for (let i = 0; i < 5; i++) {
          const a = (i * 72) * Math.PI / 180;
          el("circle", {
            cx: (BB.x + 12 * Math.cos(a)).toFixed(1),
            cy: (BB.y + 12 * Math.sin(a)).toFixed(1),
            r: "4",
            fill: "#0F172A",
            opacity: "0.22"
          }, g);
        }
        el("circle", { cx: BB.x, cy: BB.y, r: "6.5", fill: "#94A3B8", stroke: "#334155", "stroke-width": "1.5" }, g);
      }

      // Build 2-bone IK leg elements once, update paths per frame
      function createLegDOM(groupId, isFar) {
        const g = document.getElementById(groupId);
        g.innerHTML = "";
        const legColor = isFar ? "#B45309" : "#EA580C";
        const legHi = isFar ? "#D97706" : "#FB923C";
        const webColor = isFar ? "#7C2D12" : "#C2410C";
        const webFill = isFar ? "#D97706" : "#FB923C";
        const thighFill = isFar ? "#DCE3EC" : "#F8FAFC";

        return {
          shinBase: el("path", { fill: "none", stroke: legColor, "stroke-width": "10", "stroke-linecap": "round", "stroke-linejoin": "round" }, g),
          shinHi: el("path", { fill: "none", stroke: legHi, "stroke-width": "3.6", "stroke-linecap": "round", "stroke-linejoin": "round", opacity: "0.65" }, g),
          thighFill: el("path", { fill: thighFill }, g),
          thighEdge: el("path", { fill: "none", stroke: "#94A3B8", "stroke-width": "1.5", "stroke-linecap": "round", "stroke-linejoin": "round" }, g),
          foot: el("path", { fill: webFill, stroke: webColor, "stroke-width": "1.5", "stroke-linejoin": "round" }, g),
          toes: el("path", { fill: "none", stroke: webColor, "stroke-width": "1.1", "stroke-linecap": "round", opacity: "0.72" }, g)
        };
      }

      function solveIKForwardKnee(hip, ankle) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const d = Math.max(Math.abs(L1 - L2) + 0.001, Math.min(L1 + L2 - 0.001, Math.hypot(dx, dy)));
        const a = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
        const base = Math.atan2(dy, dx);
        const c1 = { x: hip.x + L1 * Math.cos(base + a), y: hip.y + L1 * Math.sin(base + a) };
        const c2 = { x: hip.x + L1 * Math.cos(base - a), y: hip.y + L1 * Math.sin(base - a) };
        return c1.x >= c2.x ? c1 : c2;
      }

      function updateLegDOM(dom, hip, pedal) {
        const soleY = pedal.y - 2.5;
        const ankle = { x: pedal.x - 3, y: soleY - 4.5 };
        const knee = solveIKForwardKnee(hip, { x: pedal.x - 2, y: pedal.y - 7 });
        const upperX = hip.x + (knee.x - hip.x) * 0.42;
        const upperY = hip.y + (knee.y - hip.y) * 0.42;
        const midX = (hip.x + upperX) / 2;
        const midY = (hip.y + upperY) / 2;

        const shinD = `M ${upperX.toFixed(1)} ${upperY.toFixed(1)} Q ${(knee.x + 3).toFixed(1)} ${(knee.y - 2).toFixed(1)}, ${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L ${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}`;
        dom.shinBase.setAttribute("d", shinD);
        dom.shinHi.setAttribute("d", shinD);

        dom.thighFill.setAttribute("d",
          `M ${(hip.x - 10).toFixed(1)} ${(hip.y - 3).toFixed(1)} Q ${(midX + 14).toFixed(1)} ${(midY - 3).toFixed(1)}, ${(upperX + 6).toFixed(1)} ${(upperY + 1).toFixed(1)} Q ${(upperX - 1).toFixed(1)} ${(upperY + 7).toFixed(1)}, ${(upperX - 8).toFixed(1)} ${(upperY + 2).toFixed(1)} Q ${(hip.x - 16).toFixed(1)} ${(hip.y + 14).toFixed(1)}, ${(hip.x - 10).toFixed(1)} ${(hip.y - 3).toFixed(1)} Z`
        );
        dom.thighEdge.setAttribute("d",
          `M ${(hip.x + 6).toFixed(1)} ${(hip.y + 2).toFixed(1)} Q ${(midX + 14).toFixed(1)} ${(midY - 2).toFixed(1)}, ${(upperX + 6).toFixed(1)} ${(upperY + 1).toFixed(1)} Q ${(upperX - 1).toFixed(1)} ${(upperY + 7).toFixed(1)}, ${(upperX - 8).toFixed(1)} ${(upperY + 2).toFixed(1)} Q ${(hip.x - 13).toFixed(1)} ${(hip.y + 12).toFixed(1)}, ${(hip.x - 13).toFixed(1)} ${(hip.y + 6).toFixed(1)}`
        );

        dom.foot.setAttribute("d",
          `M ${(pedal.x - 14).toFixed(1)} ${soleY.toFixed(1)} Q ${(pedal.x - 10).toFixed(1)} ${(soleY - 7).toFixed(1)}, ${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)} Q ${(pedal.x + 12).toFixed(1)} ${(soleY - 5).toFixed(1)}, ${(pedal.x + 20).toFixed(1)} ${(soleY - 0.5).toFixed(1)} Q ${(pedal.x + 21).toFixed(1)} ${(soleY + 2.5).toFixed(1)}, ${(pedal.x + 15).toFixed(1)} ${(soleY + 2.5).toFixed(1)} L ${(pedal.x - 11).toFixed(1)} ${(soleY + 2.5).toFixed(1)} Z`
        );
        dom.toes.setAttribute("d",
          `M ${(ankle.x + 2).toFixed(1)} ${(ankle.y + 1).toFixed(1)} L ${(pedal.x + 17).toFixed(1)} ${(soleY + 0.5).toFixed(1)} M ${(ankle.x + 1).toFixed(1)} ${(ankle.y + 2).toFixed(1)} L ${(pedal.x + 10).toFixed(1)} ${(soleY + 2).toFixed(1)} M ${(ankle.x - 1).toFixed(1)} ${(ankle.y + 2).toFixed(1)} L ${(pedal.x - 10).toFixed(1)} ${(soleY + 1.5).toFixed(1)}`
        );
        return knee;
      }

      buildSpokes("rear-spokes", REAR_AXLE.x, REAR_AXLE.y, 10);
      buildSpokes("front-spokes", FRONT_AXLE.x, FRONT_AXLE.y, 24);
      buildChainring();

      const farLegDOM = createLegDOM("far-leg-group", true);
      const nearLegDOM = createLegDOM("near-leg-group", false);

      // Perspective boardwalk planks that scroll smoothly
      const plankGroup = document.getElementById("boardwalk-planks");
      const plankLines = [];
      for (let i = 0; i < 10; i++) {
        plankLines.push(el("line", { x1: 0, y1: 436, x2: 0, y2: 520 }, plankGroup));
      }

      const rearSpokes = document.getElementById("rear-spokes");
      const frontSpokes = document.getElementById("front-spokes");
      const chainringGroup = document.getElementById("chainring-group");
      const chainTopDash = document.getElementById("chain-top-dash");
      const chainBotDash = document.getElementById("chain-bot-dash");
      const nearCrankArm = document.getElementById("near-crank-arm");
      const nearCrankHi = document.getElementById("near-crank-hi");
      const nearPedalBox = document.getElementById("near-pedal-box");
      const farCrankArm = document.getElementById("far-crank-arm");
      const farCrankHi = document.getElementById("far-crank-hi");
      const farPedalBox = document.getElementById("far-pedal-box");
      const bodyBob = document.getElementById("pelican-body-bob");
      const scarfTails = document.getElementById("scarf-tails");
      const eyelid = document.getElementById("pelican-eyelid");
      const cloud1 = document.getElementById("cloud-1");
      const cloud2 = document.getElementById("cloud-2");
      const cloud3 = document.getElementById("cloud-3");
      const telAngle = document.getElementById("tel-angle");
      const telSpeed = document.getElementById("tel-speed");
      const bpReadout = document.getElementById("bp-ik-readout");

      let crankRad = 56 * Math.PI / 180;
      let wheelDeg = 0;
      let chainOff = 0;
      let roadScroll = 0;
      let cloudScroll = 0;
      let speedMult = 1.0;
      let isPlaying = true;
      let bellPulse = 0;
      let lastTime = performance.now();

      function renderFrame(dt) {
        const angularVel = 2.6 * speedMult; // rad/s
        if (isPlaying) {
          crankRad = (crankRad + angularVel * dt) % (Math.PI * 2);
          const gearRatio = 2.25;
          wheelDeg = (wheelDeg + (angularVel * gearRatio * 180 / Math.PI) * dt) % 360;
          chainOff = (chainOff - angularVel * 24 * dt) % 6;
          roadScroll = (roadScroll + angularVel * 72 * dt) % 95;
          cloudScroll = (cloudScroll + 8 * speedMult * dt);
        }

        const nearPedal = {
          x: BB.x + CRANK_R * Math.cos(crankRad),
          y: BB.y + CRANK_R * Math.sin(crankRad)
        };
        const farPedal = {
          x: BB.x - CRANK_R * Math.cos(crankRad),
          y: BB.y - CRANK_R * Math.sin(crankRad)
        };

        // Subtle cadence bob on upper body (+- 1.4px)
        const bobY = Math.sin(crankRad * 2) * 1.4;
        bodyBob.setAttribute("transform", `translate(0, ${bobY.toFixed(2)})`);

        // Scarf wind ripple
        const flutter = Math.sin(performance.now() * 0.008 * Math.max(0.6, speedMult)) * 2.5;
        scarfTails.setAttribute("transform", `translate(0, ${(flutter * 0.45).toFixed(2)}) rotate(${(flutter * 0.6).toFixed(2)} 378 126)`);

        // Update wheels & drivetrain
        rearSpokes.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} ${REAR_AXLE.x} ${REAR_AXLE.y})`);
        frontSpokes.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} ${FRONT_AXLE.x} ${FRONT_AXLE.y})`);
        chainringGroup.setAttribute("transform", `rotate(${(crankRad * 180 / Math.PI).toFixed(2)} ${BB.x} ${BB.y})`);
        chainTopDash.setAttribute("stroke-dashoffset", chainOff.toFixed(2));
        chainBotDash.setAttribute("stroke-dashoffset", (-chainOff).toFixed(2));

        // Update crank arms & pedals
        nearCrankArm.setAttribute("x2", nearPedal.x.toFixed(1));
        nearCrankArm.setAttribute("y2", nearPedal.y.toFixed(1));
        nearCrankHi.setAttribute("x2", nearPedal.x.toFixed(1));
        nearCrankHi.setAttribute("y2", nearPedal.y.toFixed(1));
        nearPedalBox.setAttribute("transform", `translate(${nearPedal.x.toFixed(1)}, ${nearPedal.y.toFixed(1)})`);

        farCrankArm.setAttribute("x2", farPedal.x.toFixed(1));
        farCrankArm.setAttribute("y2", farPedal.y.toFixed(1));
        farCrankHi.setAttribute("x2", farPedal.x.toFixed(1));
        farCrankHi.setAttribute("y2", farPedal.y.toFixed(1));
        farPedalBox.setAttribute("transform", `translate(${farPedal.x.toFixed(1)}, ${farPedal.y.toFixed(1)})`);

        // Solve IK with hip adjusted by body bob
        const nearKnee = updateLegDOM(nearLegDOM, { x: NEAR_HIP.x, y: NEAR_HIP.y + bobY }, nearPedal);
        updateLegDOM(farLegDOM, { x: FAR_HIP.x, y: FAR_HIP.y + bobY }, farPedal);

        // Scroll perspective planks smoothly
        for (let i = 0; i < plankLines.length; i++) {
          const topX = -40 + i * 95 - roadScroll;
          const botX = topX + (topX - 400) * 0.24;
          plankLines[i].setAttribute("x1", topX.toFixed(1));
          plankLines[i].setAttribute("x2", botX.toFixed(1));
        }

        // Drift clouds smoothly
        const wrap = (x, span) => ((x % span) + span) % span;
        cloud1.setAttribute("transform", `translate(${(400 - wrap(cloudScroll + 310, 960)).toFixed(1)}, 0)`);
        cloud2.setAttribute("transform", `translate(${(450 - wrap(cloudScroll * 0.65 + 420, 960)).toFixed(1)}, 0)`);
        cloud3.setAttribute("transform", `translate(${(420 - wrap(cloudScroll * 0.45 + 160, 960)).toFixed(1)}, 0)`);

        // Natural blink every ~4.2s
        const blinkPhase = (performance.now() % 4200) / 4200;
        eyelid.setAttribute("opacity", blinkPhase > 0.96 ? "1" : "0");

        // Bell ring pulse decay
        if (bellPulse > 0) {
          bellPulse = Math.max(0, bellPulse - dt * 2.2);
          document.getElementById("bell-rings").setAttribute("opacity", bellPulse.toFixed(2));
          document.getElementById("bell-group").setAttribute("transform", `translate(0, ${(Math.sin(bellPulse * 40) * 1.4).toFixed(2)})`);
        } else {
          document.getElementById("bell-rings").setAttribute("opacity", "0");
          document.getElementById("bell-group").setAttribute("transform", "");
        }

        const deg = Math.round(crankRad * 180 / Math.PI);
        telAngle.textContent = `${deg}°`;
        telSpeed.textContent = `${(18.4 * speedMult).toFixed(1)} km/h`;
        bpReadout.textContent = `CRANK θ = ${deg}° | NEAR KNEE (${Math.round(nearKnee.x)}, ${Math.round(nearKnee.y)}) | 2-BONE IK ACTIVE`;
      }

      function tick(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        renderFrame(dt);
        requestAnimationFrame(tick);
      }

      // 5 Scenic Themes
      const THEMES = {
        day: {
          ui: "dark",
          sky: ["#7DD3FC", "#BAE6FD", "#FEF3C7", "#FDE68A"],
          sea: ["#0284C7", "#0EA5E9", "#38BDF8"],
          ground: ["#E7D3B0", "#D6BA8D", "#B08D57"],
          curb: "#A17F4A",
          plank: "#9C7A47",
          sunOpacity: "0.92", haloOpacity: "1", moonOpacity: "0", starsOpacity: "0",
          cloudsOpacity: "0.82", oceanOpacity: "1", groundOpacity: "1",
          beamOpacity: "0", bpOpacity: "0", shadowsOpacity: "1"
        },
        sunset: {
          ui: "dark",
          sky: ["#311042", "#9D174D", "#F97316", "#FDE047"],
          sea: ["#4C1D95", "#9D174D", "#EA580C"],
          ground: ["#9A6B4C", "#7C4D34", "#5C3522"],
          curb: "#6B3E26",
          plank: "#451A03",
          sunOpacity: "0.95", haloOpacity: "1", moonOpacity: "0", starsOpacity: "0.25",
          cloudsOpacity: "0.45", oceanOpacity: "1", groundOpacity: "1",
          beamOpacity: "0.25", bpOpacity: "0", shadowsOpacity: "1"
        },
        night: {
          ui: "dark",
          sky: ["#020617", "#0F172A", "#1E293B", "#334155"],
          sea: ["#020617", "#0F172A", "#1E3A8A"],
          ground: ["#334155", "#1E293B", "#0F172A"],
          curb: "#475569",
          plank: "#0F172A",
          sunOpacity: "0", haloOpacity: "0.2", moonOpacity: "0.95", starsOpacity: "0.9",
          cloudsOpacity: "0.14", oceanOpacity: "1", groundOpacity: "1",
          beamOpacity: "1", bpOpacity: "0", shadowsOpacity: "0.7"
        },
        blueprint: {
          ui: "dark",
          sky: ["#0B1E3D", "#0F2A54", "#0F2A54", "#0B1E3D"],
          sea: ["#0F2A54", "#0F2A54", "#0F2A54"],
          ground: ["#0B1E3D", "#0B1E3D", "#091730"],
          curb: "#38BDF8",
          plank: "#38BDF8",
          sunOpacity: "0", haloOpacity: "0", moonOpacity: "0", starsOpacity: "0",
          cloudsOpacity: "0.18", oceanOpacity: "0.2", groundOpacity: "0.9",
          beamOpacity: "0", bpOpacity: "1", shadowsOpacity: "0.3"
        },
        studio: {
          ui: "light",
          sky: ["#FFFFFF", "#F8FAFC", "#F1F5F9", "#E2E8F0"],
          sea: ["#E2E8F0", "#E2E8F0", "#E2E8F0"],
          ground: ["#F1F5F9", "#E2E8F0", "#CBD5E1"],
          curb: "#CBD5E1",
          plank: "#94A3B8",
          sunOpacity: "0", haloOpacity: "0", moonOpacity: "0", starsOpacity: "0",
          cloudsOpacity: "0", oceanOpacity: "0", groundOpacity: "0.65",
          beamOpacity: "0", bpOpacity: "0", shadowsOpacity: "0.9"
        }
      };

      function applyTheme(name) {
        const t = THEMES[name];
        if (!t) return;
        document.body.setAttribute("data-ui", t.ui);
        document.querySelectorAll(".theme-btn").forEach(b => b.classList.toggle("active", b.dataset.theme === name));

        ["0", "1", "2", "3"].forEach((i, idx) => document.getElementById("skyStop" + i).setAttribute("stop-color", t.sky[idx]));
        ["0", "1", "2"].forEach((i, idx) => document.getElementById("seaStop" + i).setAttribute("stop-color", t.sea[idx]));
        ["0", "1", "2"].forEach((i, idx) => document.getElementById("groundStop" + i).setAttribute("stop-color", t.ground[idx]));

        document.getElementById("boardwalk-curb").setAttribute("fill", t.curb);
        document.getElementById("horizon-curb").setAttribute("stroke", t.plank);
        plankGroup.setAttribute("stroke", t.plank);

        document.getElementById("sun-disc").setAttribute("opacity", t.sunOpacity);
        document.getElementById("sun-halo").setAttribute("opacity", t.haloOpacity);
        document.getElementById("moon-crescent").setAttribute("opacity", t.moonOpacity);
        document.getElementById("night-stars").setAttribute("opacity", t.starsOpacity);
        document.getElementById("clouds-group").setAttribute("opacity", t.cloudsOpacity);
        document.getElementById("ocean-layer").setAttribute("opacity", t.oceanOpacity);
        document.getElementById("ground-layer").setAttribute("opacity", t.groundOpacity);
        document.getElementById("headlight-beam").setAttribute("opacity", t.beamOpacity);
        document.getElementById("bp-grid-rect").setAttribute("opacity", t.bpOpacity);
        document.getElementById("blueprint-overlay").setAttribute("opacity", t.bpOpacity);
        document.getElementById("ground-shadows").setAttribute("opacity", t.shadowsOpacity);
        document.getElementById("dune-grass").setAttribute("opacity", name === "blueprint" || name === "studio" ? "0" : "0.68");
      }

      // Bell Web Audio API synthesis
      function ringBell() {
        bellPulse = 1.0;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          [0, 0.14].forEach(offset => {
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc1.type = "sine";
            osc2.type = "triangle";
            osc1.frequency.setValueAtTime(1760, now + offset);
            osc2.frequency.setValueAtTime(3520, now + offset);
            gain.gain.setValueAtTime(0.001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.16, now + offset + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.45);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);
            osc1.start(now + offset);
            osc2.start(now + offset);
            osc1.stop(now + offset + 0.46);
            osc2.stop(now + offset + 0.46);
          });
        } catch (e) {}
      }

      function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function serializeSVG() {
        const clone = document.getElementById("scene").cloneNode(true);
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        clone.setAttribute("width", "800");
        clone.setAttribute("height", "520");
        return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
      }

      document.querySelectorAll(".theme-btn").forEach(btn => {
        btn.addEventListener("click", () => applyTheme(btn.dataset.theme));
      });

      const playBtn = document.getElementById("btn-play");
      playBtn.addEventListener("click", () => {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? "暂停" : "继续骑行";
      });

      document.getElementById("btn-bell").addEventListener("click", ringBell);

      const speedSlider = document.getElementById("speed-slider");
      const speedReadout = document.getElementById("speed-readout");
      speedSlider.addEventListener("input", () => {
        speedMult = parseFloat(speedSlider.value);
        speedReadout.textContent = speedMult.toFixed(1) + "x";
      });

      document.getElementById("btn-copy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(serializeSVG());
          showToast("已复制当前帧 SVG 代码到剪贴板");
        } catch {
          showToast("剪贴板不可用，请点击下载 SVG");
        }
      });

      document.getElementById("btn-download").addEventListener("click", () => {
        const blob = new Blob([serializeSVG()], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pelican-bicycle.svg";
        a.click();
        URL.revokeObjectURL(url);
        showToast("已下载 pelican-bicycle.svg");
      });

      window.addEventListener("keydown", e => {
        if (e.target.tagName === "INPUT") return;
        if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
        if (e.key === "b" || e.key === "B") ringBell();
        const themeKeys = ["day", "sunset", "night", "blueprint", "studio"];
        const idx = parseInt(e.key, 10) - 1;
        if (idx >= 0 && idx < themeKeys.length) applyTheme(themeKeys[idx]);
      });

      applyTheme("day");
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
