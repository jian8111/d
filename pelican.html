<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骑自行车的鹈鹕 - Pelican on a Bicycle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #fed7aa 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
    }
    h1 {
      margin-bottom: 20px;
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 0.5px;
    }
    svg {
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.08));
    }
    .wheel {
      transform-origin: center;
      animation: spin 3s linear infinite;
    }
    .front-wheel {
      transform-origin: 640px 450px;
    }
    .back-wheel {
      transform-origin: 260px 450px;
    }
    .pedal-crank {
      transform-origin: 450px 450px;
      animation: spin 3s linear infinite;
    }
    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
    .ground-line {
      stroke-dasharray: 20, 15;
      animation: road-move 1s linear infinite;
    }
    @keyframes road-move {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: 35;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>骑自行车的鹈鹕</h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="800" height="577">
      <defs>
        <!-- Gradients -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#bae6fd"/>
          <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="70%" stop-color="#f1f5f9"/>
          <stop offset="100%" stop-color="#cbd5e1"/>
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fdba74"/>
          <stop offset="50%" stop-color="#fb923c"/>
          <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>

        <linearGradient id="beakUpperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fed7aa"/>
          <stop offset="80%" stop-color="#fb923c"/>
          <stop offset="100%" stop-color="#f97316"/>
        </linearGradient>

        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0284c7"/>
          <stop offset="100%" stop-color="#0369a1"/>
        </linearGradient>

        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
      </defs>

      <!-- Background Motion Breeze Lines -->
      <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.4">
        <line x1="80" y1="180" x2="160" y2="180" stroke-dasharray="15,10" />
        <line x1="120" y1="230" x2="220" y2="230" stroke-dasharray="25,12" />
        <line x1="50" y1="310" x2="130" y2="310" stroke-dasharray="10,15" />
      </g>

      <!-- Road & Ground Shadow -->
      <line class="ground-line" x1="100" y1="522" x2="800" y2="522" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="450" cy="522" rx="270" ry="12" fill="#64748b" opacity="0.25"/>

      <!-- BICYCLE -->
      <g id="bicycle">
        <!-- Back Wheel -->
        <g class="wheel back-wheel">
          <!-- Tire -->
          <circle cx="260" cy="450" r="70" fill="none" stroke="#334155" stroke-width="14"/>
          <!-- Rim -->
          <circle cx="260" cy="450" r="63" fill="none" stroke="#94a3b8" stroke-width="3"/>
          <!-- Spokes -->
          <line x1="260" y1="387" x2="260" y2="513" stroke="#cbd5e1" stroke-width="2"/>
          <line x1="197" y1="450" x2="323" y2="450" stroke="#cbd5e1" stroke-width="2"/>
          <line x1="215" y1="405" x2="305" y2="495" stroke="#cbd5e1" stroke-width="2"/>
          <line x1="215" y1="495" x2="305" y2="405" stroke="#cbd5e1" stroke-width="2"/>
          <!-- Hub -->
          <circle cx="260" cy="450" r="10" fill="#475569"/>
        </g>

        <!-- Front Wheel -->
        <g class="wheel front-wheel">
          <!-- Tire -->
          <circle cx="640" cy="450" r="70" fill="none" stroke="#334155" stroke-width="14"/>
          <!-- Rim -->
          <circle cx="640" cy="450" r="63" fill="none" stroke="#94a3b8" stroke-width="3"/>
          <!-- Spokes -->
          <line x1="640" y1="387" x2="640" y2="513" stroke="#cbd5e1" stroke-width="2"/>
          <line x1="577" y1="450" x2="703" y2="450" stroke="#cbd5e1" stroke-width="2"/>
          <line x1="595" y1="405" x2="685" y2="495" stroke="#cbd5e1" stroke-width="2"/>
          <line x1="595" y1="495" x2="685" y2="405" stroke="#cbd5e1" stroke-width="2"/>
          <!-- Hub -->
          <circle cx="640" cy="450" r="10" fill="#475569"/>
        </g>

        <!-- Bicycle Frame -->
        <!-- Rear stays -->
        <line x1="260" y1="450" x2="390" y2="340" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>
        <line x1="260" y1="450" x2="450" y2="450" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>
        <!-- Seat tube -->
        <line x1="390" y1="320" x2="450" y2="450" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>
        <!-- Seat post & Saddle -->
        <line x1="390" y1="340" x2="375" y2="300" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
        <path d="M340 300 Q380 290 415 305 Q375 315 340 300 Z" fill="#1e293b"/>

        <!-- Top tube & Down tube -->
        <line x1="390" y1="340" x2="570" y2="340" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>
        <line x1="450" y1="450" x2="570" y2="340" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>

        <!-- Head tube, Fork & Handlebars -->
        <line x1="570" y1="340" x2="640" y2="450" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>
        <line x1="570" y1="340" x2="555" y2="280" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
        <!-- Handlebar bar & grips -->
        <path d="M540 285 Q560 270 585 285" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>

        <!-- Bottom Bracket & Chainring -->
        <circle cx="450" cy="450" r="22" fill="#64748b"/>
        <circle cx="450" cy="450" r="16" fill="#334155"/>
        <!-- Chain -->
        <path d="M260 450 L450 435 L450 465 Z" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" opacity="0.6"/>

        <!-- Pedals and Cranks -->
        <g class="pedal-crank">
          <!-- Crank arm 1 -->
          <line x1="450" y1="450" x2="450" y2="495" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
          <rect x="435" y="492" width="30" height="7" rx="3" fill="#1e293b"/>
          <!-- Crank arm 2 -->
          <line x1="450" y1="450" x2="450" y2="405" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
          <rect x="435" y="401" width="30" height="7" rx="3" fill="#1e293b"/>
        </g>
      </g>

      <!-- PELICAN -->
      <g id="pelican">
        <!-- Tail Feathers -->
        <path d="M300 290 Q280 295 270 315 Q295 310 325 305 Z" fill="#cbd5e1"/>
        <path d="M290 300 Q270 312 265 330 Q290 322 320 315 Z" fill="#94a3b8"/>

        <!-- Left Leg (reaching down to pedal) -->
        <path d="M380 340 L410 405 L445 410" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Webbed Foot on pedal -->
        <polygon points="440,412 460,405 455,416" fill="#ea580c"/>

        <!-- Torso / Body -->
        <path d="M320 300 C310 260 350 230 400 230 C460 230 490 280 470 340 C440 380 345 370 320 300 Z" fill="url(#bodyGrad)" filter="url(#shadow)"/>

        <!-- Wing (resting slightly backward and steering) -->
        <path d="M380 255 C420 250 460 275 440 330 C410 345 370 325 365 290 C365 270 372 260 380 255 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
        <!-- Wing feathers detail -->
        <path d="M385 295 Q420 300 435 325" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M395 280 Q430 285 442 305" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Right Wing / Arm stretching forward to handlebar -->
        <path d="M420 260 C465 260 515 268 560 280" fill="none" stroke="#f8fafc" stroke-width="16" stroke-linecap="round"/>
        <!-- Wing tip / feathers grabbing handlebar -->
        <path d="M550 275 Q570 280 560 292" fill="#e2e8f0"/>

        <!-- Neck -->
        <path d="M425 240 C445 200 460 170 480 145 C495 130 520 130 535 150 C520 185 490 220 470 250 Z" fill="url(#bodyGrad)"/>

        <!-- Head -->
        <ellipse cx="525" cy="140" rx="35" ry="25" fill="#ffffff"/>

        <!-- Pelican Crest / Tuft Feathers -->
        <path d="M495 130 Q475 125 465 110 Q485 120 500 125 Z" fill="#e2e8f0"/>
        <path d="M500 135 Q480 135 470 122 Q490 130 505 132 Z" fill="#cbd5e1"/>

        <!-- Big Throat Pouch (Gular pouch) - characteristic of pelican -->
        <path d="M530 152 C540 185 580 230 635 220 C680 210 710 160 705 152 Z" fill="url(#pouchGrad)" opacity="0.95" filter="url(#shadow)"/>
        <!-- Pouch texture/stretch lines -->
        <path d="M565 165 Q605 200 640 180" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.4"/>
        <path d="M580 180 Q620 210 655 175" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.4"/>

        <!-- Long Bill / Upper Beak -->
        <path d="M530 135 L720 145 C730 146 732 153 720 156 L535 156 Z" fill="url(#beakUpperGrad)"/>
        <!-- Bill tip hook -->
        <path d="M720 145 Q735 150 725 157 Z" fill="#c2410c"/>

        <!-- Eye -->
        <circle cx="525" cy="132" r="7" fill="#fbbf24"/>
        <circle cx="527" cy="132" r="4" fill="#0f172a"/>
        <circle cx="528" cy="130" r="1.5" fill="#ffffff"/>

        <!-- Cute Cycling Cap / Helmet -->
        <path d="M495 135 C495 110 545 105 555 130 Z" fill="#ef4444"/>
        <!-- Cap visor -->
        <path d="M540 130 Q570 128 580 135 Q555 138 540 135 Z" fill="#b91c1c"/>
      </g>
    </svg>
  </div>
</body>
</html>
