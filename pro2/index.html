<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican on a Bicycle — Pro2 Coastal Vector Illustration</title>
  <meta name="description" content="An interactive inline SVG illustration of a Great White Pelican riding a vintage teal bicycle along a sunlit coastal boardwalk.">
  <style>
    :root {
      --bg-page: #f6efe2;
      --bg-surface: #fffcf6;
      --ink-primary: #173440;
      --ink-secondary: #536b76;
      --border-soft: rgba(23, 52, 64, 0.12);
      --accent-teal: #1d7c92;
      --accent-coral: #d96734;
      --shadow-frame: 0 24px 60px -18px rgba(23, 52, 64, 0.22), 0 4px 16px -4px rgba(23, 52, 64, 0.08);
      --radius-lg: 20px;
      --radius-pill: 999px;
    }

    body[data-mood="morning"] {
      --bg-page: #edf5f7;
      --bg-surface: #ffffff;
      --ink-primary: #123342;
      --ink-secondary: #4e6b78;
    }

    body[data-mood="twilight"] {
      --bg-page: #182334;
      --bg-surface: #202e42;
      --ink-primary: #f1ede4;
      --ink-secondary: #a8b8c9;
      --border-soft: rgba(241, 237, 228, 0.14);
      --shadow-frame: 0 26px 65px -16px rgba(5, 10, 18, 0.65), 0 4px 18px -4px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--ink-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vw, 36px);
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    .showcase {
      width: 100%;
      max-width: 1020px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px 24px;
      padding: 0 4px;
    }

    .title-group h1 {
      font-family: "Georgia", "Palatino Linotype", "Book Antiqua", "Songti SC", serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 2.8vw, 2.15rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .title-group p {
      margin-top: 4px;
      font-size: 0.92rem;
      color: var(--ink-secondary);
      line-height: 1.45;
    }

    .meta-tag {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-secondary);
    }

    .stage-frame {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: clamp(8px, 1.2vw, 14px);
      box-shadow: var(--shadow-frame);
      transition: background-color 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease;
    }

    .svg-wrap {
      width: 100%;
      border-radius: calc(var(--radius-lg) - 6px);
      overflow: hidden;
      background: #8ecae6;
      aspect-ratio: 16 / 10;
      position: relative;
    }

    #pelican-scene {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
    }

    #brass-bell {
      cursor: pointer;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 12px 16px;
      transition: background-color 0.45s ease, border-color 0.45s ease;
    }

    .control-cluster {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    button {
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ink-primary);
      background: transparent;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-pill);
      padding: 7px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    button:hover {
      border-color: var(--accent-teal);
      background-color: rgba(29, 124, 146, 0.08);
    }

    button:active {
      transform: scale(0.97);
    }

    button.primary-btn {
      background-color: var(--accent-teal);
      border-color: var(--accent-teal);
      color: #ffffff;
    }

    button.primary-btn:hover {
      background-color: #166578;
      border-color: #166578;
    }

    .mood-pills {
      display: inline-flex;
      padding: 3px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-soft);
      gap: 2px;
    }

    .mood-pills button {
      border: none;
      padding: 5px 12px;
      font-size: 0.8rem;
      color: var(--ink-secondary);
    }

    .mood-pills button.active {
      background-color: var(--ink-primary);
      color: var(--bg-surface);
    }

    .speed-control {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink-secondary);
    }

    .speed-control input[type="range"] {
      width: 104px;
      accent-color: var(--accent-teal);
      cursor: pointer;
    }

    .speed-readout {
      min-width: 34px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-primary);
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .controls-bar {
        justify-content: center;
      }
      .meta-tag {
        display: none;
      }
    }
  </style>
</head>
<body data-mood="golden">
  <main class="showcase">
    <header class="header">
      <div class="title-group">
        <h1>Pelican on a Coastal Ride</h1>
        <p>实时两段逆向运动学踩踏 · 内联矢量插画与声效 · 海岸木栈道</p>
      </div>
      <span class="meta-tag">PRO2 · INLINE SVG</span>
    </header>

    <section class="stage-frame" aria-label="Pelican riding a bicycle illustration">
      <div class="svg-wrap">

            <linearGradient id="headlandGrad" x1="0" y1="0" x2="0" y2="1">

              <path id="near-shin" d="M 452,343 L 466,429" stroke="url(#footGrad)" stroke-width="7.5" stroke-linecap="round" fill="none"/>
              <ellipse id="near-knee-cuff" cx="451" cy="342" rx="8.5" ry="5.5" transform="rotate(-18 451 342)" fill="#f7f4eb" stroke="#d8d0c1" stroke-width="1"/>
              <g id="near-foot" transform="translate(466, 431)">
                <path d="M -5,1 L 16,-2 C 23,-1 25,3 20,5 L -7,5 Z" fill="#f69857" stroke="#c85322" stroke-width="0.9"/>
                <path d="M -2,2 L 20,0 M -2,3 L 22,3 M -3,4 L 18,5" stroke="#d85724" stroke-width="1.6" stroke-linecap="round"/>
              </g>
            </g>

            <g id="near-pedal" transform="translate(466, 434)">
              <rect x="-13" y="-3.2" width="26" height="6.4" rx="2.5" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
              <circle cx="0" cy="0" r="2.2" fill="#e2e8f0"/>
            </g>

          </g>
        </svg>
      </div>
    </section>

    <section class="controls-bar" aria-label="Animation and scene controls">
      <div class="control-cluster">
        <button id="toggle-play" class="primary-btn" type="button" aria-pressed="true">
          <span id="play-icon" aria-hidden="true">❚❚</span>
          <span id="play-label">暂停骑行</span>
        </button>

        <button id="ring-bell" type="button">
          <span aria-hidden="true">🔔</span>
          <span>按车铃</span>
        </button>

        <label class="speed-control">
          <span>踏频</span>
          <input id="speed-slider" type="range" min="0.4" max="2.4" step="0.1" value="1.1">
          <span id="speed-value" class="speed-readout">1.1x</span>
        </label>
      </div>

      <div class="control-cluster">
        <div class="mood-pills" role="group" aria-label="Coastal lighting mood">
          <button type="button" data-mood-btn="golden" class="active">落日栈道</button>
          <button type="button" data-mood-btn="morning">晴朗清晨</button>
          <button type="button" data-mood-btn="twilight">灯塔暮色</button>
        </div>

        <button id="download-svg" type="button">
          <span aria-hidden="true">↓</span>
          <span>导出 SVG</span>
        </button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const BB = { x: 445, y: 416 };
      const CRANK_R = 28;
      const WHEEL_R = 72;
      const GEAR_RATIO = 1.9;
      const L1 = 92;
      const L2 = 92;

      const HIP_NEAR = { x: 402, y: 266 };
      const HIP_FAR = { x: 412, y: 264 };

      const el = {
        rearWheel: document.getElementById("rear-wheel-spin"),
        frontWheel: document.getElementById("front-wheel-spin"),
        spider: document.getElementById("chainring-spider"),
        chainLinks: document.getElementById("chain-links"),
        nearCrank: document.getElementById("near-crank-arm"),
        farCrank: document.getElementById("far-crank-arm"),
        nearPedal: document.getElementById("near-pedal"),
        farPedal: document.getElementById("far-pedal"),
        nearThigh: document.getElementById("near-thigh"),
        nearThighEdge: document.getElementById("near-thigh-edge"),
        nearShin: document.getElementById("near-shin"),
        nearKneeCuff: document.getElementById("near-knee-cuff"),
        nearFoot: document.getElementById("near-foot"),
        farThigh: document.getElementById("far-thigh"),
        farShin: document.getElementById("far-shin"),
        farKneeCuff: document.getElementById("far-knee-cuff"),
        farFoot: document.getElementById("far-foot"),
        pelicanBody: document.getElementById("pelican-body-group"),
        pelicanHead: document.getElementById("pelican-head-group"),
        scarfTails: document.getElementById("scarf-tails"),
        scarfStripes: document.getElementById("scarf-stripes"),
        roadMarks: document.getElementById("road-marks-scroll"),
        railingPosts: document.getElementById("railing-posts-scroll"),
        cloud1: document.getElementById("cloud-1"),
        cloud2: document.getElementById("cloud-2"),
        cloud3: document.getElementById("cloud-3"),
        boat1: document.getElementById("boat-1"),
        boat2: document.getElementById("boat-2"),
        bell: document.getElementById("brass-bell"),
        bellRipples: document.getElementById("bell-ripples"),
        togglePlay: document.getElementById("toggle-play"),
        playIcon: document.getElementById("play-icon"),
        playLabel: document.getElementById("play-label"),
        speedSlider: document.getElementById("speed-slider"),
        speedValue: document.getElementById("speed-value"),
        ringBellBtn: document.getElementById("ring-bell"),
        downloadBtn: document.getElementById("download-svg"),
        svg: document.getElementById("pelican-scene")
      };

      const MOODS = {
        golden: {
          sky: ["#4ea8de", "#9ad4f5", "#fde4bd", "#f9c896"],
          sun: ["#fffdf2", "#ffe8a3", "#ffcb77", "#ffcb77"],
          sunDisc: "#fffbeb",
          ocean: ["#48a9c5", "#2a82a1", "#1e607c"],
          deck: ["#edd5b3", "#dec097", "#c49f71"],
          dune: ["#94ab74", "#65804b"],
          stars: 0,
          beacon: 0.25
        },
        morning: {
          sky: ["#2c8cc9", "#7ac7f0", "#d4effc", "#eef8fc"],
          sun: ["#ffffff", "#fff5cc", "#fde68a", "#fde68a"],
          sunDisc: "#ffffff",
          ocean: ["#56bdd9", "#2e96b8", "#1f708f"],
          deck: ["#f2dfc2", "#e4c9a2", "#cca87b"],
          dune: ["#9ebc78", "#6d8c4d"],
          stars: 0,
          beacon: 0.1
        },
        twilight: {
          sky: ["#1a2b49", "#374b73", "#a46677", "#e89872"],
          sun: ["#fff6dc", "#ffd29b", "#f48c72", "#f48c72"],
          sunDisc: "#ffeed0",
          ocean: ["#2f6685", "#214966", "#163148"],
          deck: ["#c9ae92", "#b09172", "#8d6f53"],
          dune: ["#5b7355", "#3d5039"],
          stars: 0.85,
          beacon: 0.92
        }
      };

      function solveIK(hx, hy, ax, ay, l1, l2) {
        const dx = ax - hx;
        const dy = ay - hy;
        const d = Math.min(Math.hypot(dx, dy), l1 + l2 - 1.5);
        const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
        const mx = hx + (a * dx) / d;
        const my = hy + (a * dy) / d;
        return {
          kx: mx + (h * dy) / d,
          ky: my - (h * dx) / d
        };
      }

      function buildThighPaths(hx, hy, kx, ky) {
        const dx = kx - hx;
        const dy = ky - hy;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len;
        const uy = dy / len;
        const nx = -uy;
        const ny = ux;

        const h1x = hx + nx * 13;
        const h1y = hy + ny * 13;
        const h2x = hx - nx * 10;
        const h2y = hy - ny * 10;

        const k1x = kx + nx * 6;
        const k1y = ky + ny * 6;
        const k2x = kx - nx * 6;
        const k2y = ky - ny * 6;

        const m1x = hx + dx * 0.55 + nx * 10.5;
        const m1y = hy + dy * 0.55 + ny * 10.5;
        const m2x = hx + dx * 0.55 - nx * 7.5;
        const m2y = hy + dy * 0.55 - ny * 7.5;

        const fillPath =
          `M ${h2x.toFixed(1)},${h2y.toFixed(1)} ` +
          `Q ${(hx + nx * 2).toFixed(1)},${(hy + ny * 2 - 4).toFixed(1)} ${h1x.toFixed(1)},${h1y.toFixed(1)} ` +
          `Q ${m1x.toFixed(1)},${m1y.toFixed(1)} ${k1x.toFixed(1)},${k1y.toFixed(1)} ` +
          `Q ${(kx + ux * 4).toFixed(1)},${(ky + uy * 4).toFixed(1)} ${k2x.toFixed(1)},${k2y.toFixed(1)} ` +
          `Q ${m2x.toFixed(1)},${m2y.toFixed(1)} ${h2x.toFixed(1)},${h2y.toFixed(1)} Z`;

        const edgePath =
          `M ${h1x.toFixed(1)},${h1y.toFixed(1)} ` +
          `Q ${m1x.toFixed(1)},${m1y.toFixed(1)} ${k1x.toFixed(1)},${k1y.toFixed(1)} ` +
          `Q ${(kx + ux * 4).toFixed(1)},${(ky + uy * 4).toFixed(1)} ${k2x.toFixed(1)},${k2y.toFixed(1)} ` +
          `Q ${m2x.toFixed(1)},${m2y.toFixed(1)} ${h2x.toFixed(1)},${h2y.toFixed(1)}`;

        return { fillPath, edgePath, angleDeg: (Math.atan2(dy, dx) * 180) / Math.PI - 90 };
      }

      let crankTheta = (40 * Math.PI) / 180;
      let worldDist = 0;
      let speedMult = 1.1;
      let isPlaying = true;
      let lastTime = performance.now();
      let bellTimer = 0;
      let cloudClock = 0;

      function updateScene(dt) {
        const dTheta = 3.1 * speedMult * dt;
        crankTheta += dTheta;
        cloudClock += dt * (0.6 + speedMult * 0.4);

        const wheelRad = dTheta * GEAR_RATIO;
        worldDist += wheelRad * WHEEL_R;

        const bodyBob = Math.sin(crankTheta * 2) * 1.4;
        const headNod = Math.sin(crankTheta * 2 - 0.6) * 1.1;

        el.pelicanBody.setAttribute("transform", `translate(0, ${bodyBob.toFixed(2)})`);
        el.pelicanHead.setAttribute("transform", `rotate(${(headNod * 0.7).toFixed(2)} 430 185)`);

        // Scarf wind flutter
        const w1 = Math.sin(cloudClock * 6.5) * 4.2;
        const w2 = Math.cos(cloudClock * 5.2) * 4.8;
        el.scarfTails.setAttribute(
          "d",
          `M 426,184 C 402,${(179 + w1 * 0.4).toFixed(1)} 374,${(175 + w1).toFixed(1)} 344,${(183 + w1 * 0.9).toFixed(1)} ` +
          `C 354,${(187 + w1 * 0.7).toFixed(1)} 368,187 378,186 ` +
          `C 362,${(191 + w2 * 0.7).toFixed(1)} 344,${(195 + w2).toFixed(1)} 326,${(192 + w2).toFixed(1)} ` +
          `C 356,${(202 + w2 * 0.5).toFixed(1)} 396,198 430,192 Z`
        );
        el.scarfStripes.setAttribute(
          "d",
          `M 358,${(181 + w1 * 0.7).toFixed(1)} L 352,${(186 + w1 * 0.7).toFixed(1)} ` +
          `M 344,${(192 + w2 * 0.8).toFixed(1)} L 336,${(195 + w2 * 0.8).toFixed(1)}`
        );

        // Rotate wheels & chainring
        const wheelDeg = ((worldDist / WHEEL_R) * 180) / Math.PI;
        const crankDeg = (crankTheta * 180) / Math.PI;
        el.rearWheel.setAttribute("transform", `rotate(${(wheelDeg % 360).toFixed(2)} 315 406)`);
        el.frontWheel.setAttribute("transform", `rotate(${(wheelDeg % 360).toFixed(2)} 645 406)`);
        el.spider.setAttribute("transform", `rotate(${(crankDeg % 360).toFixed(2)})`);
        el.chainLinks.setAttribute("stroke-dashoffset", (-((crankTheta * 25) % 7)).toFixed(2));

        // Scroll boardwalk & railing seamlessly (240px repeat tile)
        const roadOffset = worldDist % 240;
        const railOffset = (worldDist * 0.85) % 240;
        el.roadMarks.setAttribute("transform", `translate(${(-roadOffset).toFixed(2)}, 0)`);
        el.railingPosts.setAttribute("transform", `translate(${(-railOffset).toFixed(2)}, 0)`);

        // Slow cloud & boat drift
        const c1x = ((80 - cloudClock * 7) % 1160 + 1160) % 1160 - 150;
        const c2x = ((475 - cloudClock * 4.5) % 1160 + 1160) % 1160 - 150;
        const c3x = ((765 - cloudClock * 9) % 1160 + 1160) % 1160 - 150;
        el.cloud1.setAttribute("transform", `translate(${c1x.toFixed(1)}, 74)`);
        el.cloud2.setAttribute("transform", `translate(${c2x.toFixed(1)}, 50)`);
        el.cloud3.setAttribute("transform", `translate(${c3x.toFixed(1)}, 165)`);

        const b1y = 331 + Math.sin(cloudClock * 1.4) * 1.4;
        const b2y = 338 + Math.cos(cloudClock * 1.2) * 1.1;
        el.boat1.setAttribute("transform", `translate(152, ${b1y.toFixed(2)})`);
        el.boat2.setAttribute("transform", `translate(796, ${b2y.toFixed(2)}) scale(0.75)`);

        // Compute near & far pedal positions
        const pNearX = BB.x + CRANK_R * Math.cos(crankTheta);
        const pNearY = BB.y + CRANK_R * Math.sin(crankTheta);
        const pFarX = BB.x - CRANK_R * Math.cos(crankTheta);
        const pFarY = BB.y - CRANK_R * Math.sin(crankTheta);

        el.nearCrank.setAttribute("x2", pNearX.toFixed(2));
        el.nearCrank.setAttribute("y2", pNearY.toFixed(2));
        el.farCrank.setAttribute("x2", pFarX.toFixed(2));
        el.farCrank.setAttribute("y2", pFarY.toFixed(2));

        const pedalTilt = Math.sin(crankTheta) * 5;
        el.nearPedal.setAttribute("transform", `translate(${pNearX.toFixed(2)}, ${pNearY.toFixed(2)}) rotate(${pedalTilt.toFixed(1)})`);
        el.farPedal.setAttribute("transform", `translate(${pFarX.toFixed(2)}, ${pFarY.toFixed(2)}) rotate(${(-pedalTilt).toFixed(1)})`);

        // Dynamic Hip Positions track subtle body bob
        const hnY = HIP_NEAR.y + bodyBob;
        const hfY = HIP_FAR.y + bodyBob;

        // Solve 2-bone IK for near leg
        const nearAnkleX = pNearX;
        const nearAnkleY = pNearY - 5;
        const kNear = solveIK(HIP_NEAR.x, hnY, nearAnkleX, nearAnkleY, L1, L2);
        const nearThigh = buildThighPaths(HIP_NEAR.x, hnY, kNear.kx, kNear.ky);
        el.nearThigh.setAttribute("d", nearThigh.fillPath);
        el.nearThighEdge.setAttribute("d", nearThigh.edgePath);
        el.nearShin.setAttribute("d", `M ${kNear.kx.toFixed(1)},${kNear.ky.toFixed(1)} L ${nearAnkleX.toFixed(1)},${nearAnkleY.toFixed(1)}`);
        el.nearKneeCuff.setAttribute("cx", kNear.kx.toFixed(1));
        el.nearKneeCuff.setAttribute("cy", kNear.ky.toFixed(1));
        el.nearKneeCuff.setAttribute("transform", `rotate(${nearThigh.angleDeg.toFixed(1)} ${kNear.kx.toFixed(1)} ${kNear.ky.toFixed(1)})`);
        el.nearFoot.setAttribute("transform", `translate(${pNearX.toFixed(2)}, ${(pNearY - 3).toFixed(2)}) rotate(${pedalTilt.toFixed(1)})`);

        // Solve 2-bone IK for far leg
        const farAnkleX = pFarX;
        const farAnkleY = pFarY - 4;
        const kFar = solveIK(HIP_FAR.x, hfY, farAnkleX, farAnkleY, L1, L2);
        const farThigh = buildThighPaths(HIP_FAR.x, hfY, kFar.kx, kFar.ky);
        el.farThigh.setAttribute("d", farThigh.fillPath);
        el.farShin.setAttribute("d", `M ${kFar.kx.toFixed(1)},${kFar.ky.toFixed(1)} L ${farAnkleX.toFixed(1)},${farAnkleY.toFixed(1)}`);
        el.farKneeCuff.setAttribute("cx", kFar.kx.toFixed(1));
        el.farKneeCuff.setAttribute("cy", kFar.ky.toFixed(1));
        el.farKneeCuff.setAttribute("transform", `rotate(${farThigh.angleDeg.toFixed(1)} ${kFar.kx.toFixed(1)} ${kFar.ky.toFixed(1)})`);
        el.farFoot.setAttribute("transform", `translate(${pFarX.toFixed(2)}, ${(pFarY - 3).toFixed(2)}) rotate(${(-pedalTilt).toFixed(1)})`);
      }

      function tick(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (isPlaying) {
          updateScene(dt);
        }

        if (bellTimer > 0) {
          bellTimer = Math.max(0, bellTimer - dt);
          const p = 1 - bellTimer / 0.65;
          el.bellRipples.setAttribute("opacity", Math.sin(p * Math.PI).toFixed(2));
          el.bellRipples.setAttribute("transform", `scale(${(0.9 + p * 0.45).toFixed(2)})`);
        } else {
          el.bellRipples.setAttribute("opacity", "0");
        }

        requestAnimationFrame(tick);
      }

      // Synthesized Web Audio Brass Bicycle Bell ("ding-ding!")
      let audioCtx = null;
      function playBrassBell() {
        bellTimer = 0.65;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          if (!audioCtx) audioCtx = new AudioContext();
          if (audioCtx.state === "suspended") audioCtx.resume();

          const ringOnce = (startOffset) => {
            const t0 = audioCtx.currentTime + startOffset;
            const freqs = [2093, 4186, 5274];
            freqs.forEach((freq, idx) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(freq, t0);
              const amp = idx === 0 ? 0.14 : idx === 1 ? 0.07 : 0.03;
              gain.gain.setValueAtTime(0.0001, t0);
              gain.gain.exponentialRampToValueAtTime(amp, t0 + 0.008);
              gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(t0);
              osc.stop(t0 + 0.58);
            });
          };

          ringOnce(0);
          ringOnce(0.14);
        } catch (_) {
          // Audio playback optional if blocked by environment
        }
      }

      function applyMood(moodKey) {
        const m = MOODS[moodKey];
        if (!m) return;
        document.body.setAttribute("data-mood", moodKey);
        document.querySelectorAll("[data-mood-btn]").forEach((b) => {
          b.classList.toggle("active", b.getAttribute("data-mood-btn") === moodKey);
        });

        m.sky.forEach((c, i) => document.getElementById(`skyStop${i}`).setAttribute("stop-color", c));
        m.sun.forEach((c, i) => document.getElementById(`sunStop${i}`).setAttribute("stop-color", c));
        document.getElementById("sun-disc").setAttribute("fill", m.sunDisc);
        m.ocean.forEach((c, i) => document.getElementById(`oceanStop${i}`).setAttribute("stop-color", c));
        m.deck.forEach((c, i) => document.getElementById(`deckStop${i}`).setAttribute("stop-color", c));
        m.dune.forEach((c, i) => document.getElementById(`duneStop${i}`).setAttribute("stop-color", c));
        document.getElementById("twilight-stars").setAttribute("opacity", String(m.stars));
        document.getElementById("lighthouse-beacon").setAttribute("opacity", String(m.beacon));
      }

      // Controls wiring
      el.togglePlay.addEventListener("click", () => {
        isPlaying = !isPlaying;
        el.togglePlay.setAttribute("aria-pressed", String(isPlaying));
        el.playIcon.textContent = isPlaying ? "❚❚" : "▶";
        el.playLabel.textContent = isPlaying ? "暂停骑行" : "继续骑行";
      });

      el.speedSlider.addEventListener("input", (e) => {
        speedMult = parseFloat(e.target.value);
        el.speedValue.textContent = `${speedMult.toFixed(1)}x`;
      });

      el.ringBellBtn.addEventListener("click", playBrassBell);
      el.bell.addEventListener("click", playBrassBell);

      document.querySelectorAll("[data-mood-btn]").forEach((btn) => {
        btn.addEventListener("click", () => applyMood(btn.getAttribute("data-mood-btn")));
      });

      el.downloadBtn.addEventListener("click", () => {
        const clone = el.svg.cloneNode(true);
        clone.setAttribute("width", "960");
        clone.setAttribute("height", "600");
        const serializer = new XMLSerializer();
        const source = serializer.serializeToString(clone);
        const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pelican-bicycle-pro2.svg";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      // Initialize exact initial IK pose and start animation loop
      updateScene(0);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
