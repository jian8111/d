<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑行 · Pelican on a Bicycle (Pro 3)</title>
  <meta name="description" content="Interactive inline SVG illustration of an American white pelican riding a coastal cruiser bicycle with real-time 2-bone inverse kinematics pedaling." />
  <style>
    :root {
      --bg: #f6f1e7;
      --surface: #fffdf9;
      --ink: #172a36;
      --muted: #5a6d7a;
      --border: #e3dac8;
      --accent: #147d75;
      --accent-hover: #0f625c;
      --warm: #d96b1b;
      --shadow: 0 20px 50px -18px rgba(19, 38, 49, 0.16), 0 4px 14px -4px rgba(19, 38, 49, 0.08);
    }

    body[data-mood="sunset"] {
      --bg: #f3e6da;
      --surface: #fff9f3;
      --ink: #2a1d24;
      --muted: #6e575c;
      --border: #e4cfc2;
      --accent: #c9522d;
      --accent-hover: #a74020;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 20px;
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    .studio-shell {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 0 4px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .title-block p {
      margin: 4px 0 0;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .telemetry {
      display: flex;
      align-items: center;
      gap: 14px;
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .telemetry strong {
      color: var(--ink);
      font-weight: 600;
    }

    .stage-frame {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      box-shadow: var(--shadow);
      transition: background-color 0.45s ease, border-color 0.45s ease;
    }

    .svg-wrap {
      width: 100%;
      aspect-ratio: 1000 / 680;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #cbeaf6;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
    }

    .clickable {
      cursor: pointer;
    }

    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 6px 20px -10px rgba(19, 38, 49, 0.1);
      transition: background-color 0.45s ease, border-color 0.45s ease;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button,
    .link-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    button:hover,
    .link-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button:active,
    .link-btn:active {
      transform: translateY(1px);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #ffffff;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .speed-control input[type="range"] {
      width: 130px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .speed-val {
      min-width: 3.2em;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--ink);
    }

    .hint-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hint-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .hint-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .stage-frame {
        padding: 8px;
        border-radius: 16px;
      }
      .controls {
        padding: 12px;
      }
      .speed-control {
        width: 100%;
        justify-content: space-between;
      }
      .speed-control input[type="range"] {
        flex: 1;
      }
    }
  </style>
</head>
<body data-mood="morning">
  <main class="studio-shell">
    <header class="topbar">
      <div class="title-block">
        <h1>海风鹈鹕骑行 · Pelican on a Bicycle</h1>

  <script>
    (() => {
      const BB = { x: 468, y: 474 };
      const CRANK_R = 44;
      const WHEEL_R = 96;
      const NEAR_HIP = { x: 412, y: 284 };
      const FAR_HIP = { x: 422, y: 284 };
      const L1 = 126;
      const L2 = 126;

      // DOM elements
      const rearRotor = document.getElementById("rear-wheel-rotor");
      const frontRotor = document.getElementById("front-wheel-rotor");
      const chainringRotor = document.getElementById("chainring-rotor");
      const bikeChain = document.getElementById("bike-chain");

      const nearCrankArm = document.getElementById("near-crank-arm");
      const nearPedalPin = document.getElementById("near-pedal-pin");
      const nearPedal = document.getElementById("near-pedal");
      const nearLegPath = document.getElementById("near-leg-path");
      const nearKneeJoint = document.getElementById("near-knee-joint");
      const nearFoot = document.getElementById("near-foot");
      const nearThighCuff = document.getElementById("near-thigh-cuff");

      const farCrankArm = document.getElementById("far-crank-arm");
      const farPedalPin = document.getElementById("far-pedal-pin");
      const farPedal = document.getElementById("far-pedal");
      const farLegPath = document.getElementById("far-leg-path");
      const farKneeJoint = document.getElementById("far-knee-joint");
      const farFoot = document.getElementById("far-foot");
      const farThighCuff = document.getElementById("far-thigh-cuff");

      const pelicanBody = document.getElementById("pelican-body-group");
      const nearWing = document.getElementById("near-wing");
      const farWing = document.getElementById("far-wing");
      const scarfTails = document.getElementById("scarf-tails");
      const roadDashes = document.getElementById("road-dashes");
      const bollardRects = Array.from(document.querySelectorAll("#bollards rect"));
      const oceanGlints = document.getElementById("ocean-glints");
      const cloudsLayer = document.getElementById("clouds-layer");
      const sailboat = document.getElementById("sailboat");
      const breezeLines = document.getElementById("breeze-lines");

      const speedKmhEl = document.getElementById("speed-kmh");
      const cadenceRpmEl = document.getElementById("cadence-rpm");
      const togglePlayBtn = document.getElementById("toggle-play");
      const ringBellBtn = document.getElementById("ring-bell");
      const toggleMoodBtn = document.getElementById("toggle-mood");
      const speedSlider = document.getElementById("speed-slider");
      const speedLabel = document.getElementById("speed-label");
      const downloadSvgBtn = document.getElementById("download-svg");

      const bellHit = document.getElementById("bell-hit");
      const bellDome = document.getElementById("bell-dome");
      const bellWaves = document.getElementById("bell-waves");
      const pelicanEye = document.getElementById("pelican-eye");
      const pelicanWink = document.getElementById("pelican-eye-wink");

      let playing = true;
      let speedMult = 1.0;
      let crankAngle = Math.PI / 3; // matches 60deg initial pose
      let wheelAngle = 0;
      let roadDistance = 0;
      let elapsed = 0;
      let lastTime = performance.now();
      let bellTimer = 0;
      let winkTimer = 0;
      let audioCtx = null;

      function solveIK(hip, ankle, l1, l2) {
        let dx = ankle.x - hip.x;
        let dy = ankle.y - hip.y;
        let d = Math.hypot(dx, dy);
        const minD = Math.abs(l1 - l2) + 2;
        const maxD = l1 + l2 - 2;
        if (d < minD) d = minD;
        if (d > maxD) d = maxD;
        const ux = dx / (Math.hypot(dx, dy) || 1);
        const uy = dy / (Math.hypot(dx, dy) || 1);
        const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
        const mx = hip.x + a * ux;
        const my = hip.y + a * uy;
        // Knee bends forward (+x direction)
        return {
          x: mx + h * uy,
          y: my - h * ux
        };
      }

      function updatePose() {
        const pn = {
          x: BB.x + CRANK_R * Math.cos(crankAngle),
          y: BB.y + CRANK_R * Math.sin(crankAngle)
        };
        const pf = {
          x: BB.x + CRANK_R * Math.cos(crankAngle + Math.PI),
          y: BB.y + CRANK_R * Math.sin(crankAngle + Math.PI)
        };

        // Cranks & Pedals
        nearCrankArm.setAttribute("x2", pn.x.toFixed(2));
        nearCrankArm.setAttribute("y2", pn.y.toFixed(2));
        nearPedalPin.setAttribute("cx", pn.x.toFixed(2));
        nearPedalPin.setAttribute("cy", pn.y.toFixed(2));
        nearPedal.setAttribute("transform", `translate(${pn.x.toFixed(2)}, ${pn.y.toFixed(2)})`);

        farCrankArm.setAttribute("x2", pf.x.toFixed(2));
        farCrankArm.setAttribute("y2", pf.y.toFixed(2));
        farPedalPin.setAttribute("cx", pf.x.toFixed(2));
        farPedalPin.setAttribute("cy", pf.y.toFixed(2));
        farPedal.setAttribute("transform", `translate(${pf.x.toFixed(2)}, ${pf.y.toFixed(2)})`);

        // Subtle rider bob synced with pedaling
        const bobY = Math.sin(crankAngle * 2) * 2.2;
        const nearHip = { x: NEAR_HIP.x, y: NEAR_HIP.y + bobY * 0.65 };
        const farHip = { x: FAR_HIP.x, y: FAR_HIP.y + bobY * 0.65 };

        // IK Legs
        const nearAnkle = { x: pn.x, y: pn.y - 7 };
        const farAnkle = { x: pf.x, y: pf.y - 7 };
        const nearKnee = solveIK(nearHip, nearAnkle, L1, L2);
        const farKnee = solveIK(farHip, farAnkle, L1, L2);

        nearLegPath.setAttribute(
          "d",
          `M ${nearHip.x.toFixed(2)} ${nearHip.y.toFixed(2)} L ${nearKnee.x.toFixed(2)} ${nearKnee.y.toFixed(2)} L ${nearAnkle.x.toFixed(2)} ${nearAnkle.y.toFixed(2)}`
        );
        nearKneeJoint.setAttribute("cx", nearKnee.x.toFixed(2));
        nearKneeJoint.setAttribute("cy", nearKnee.y.toFixed(2));
        nearFoot.setAttribute("transform", `translate(${nearAnkle.x.toFixed(2)}, ${nearAnkle.y.toFixed(2)})`);

        farLegPath.setAttribute(
          "d",
          `M ${farHip.x.toFixed(2)} ${farHip.y.toFixed(2)} L ${farKnee.x.toFixed(2)} ${farKnee.y.toFixed(2)} L ${farAnkle.x.toFixed(2)} ${farAnkle.y.toFixed(2)}`
        );
        farKneeJoint.setAttribute("cx", farKnee.x.toFixed(2));
        farKneeJoint.setAttribute("cy", farKnee.y.toFixed(2));
        farFoot.setAttribute("transform", `translate(${farAnkle.x.toFixed(2)}, ${farAnkle.y.toFixed(2)})`);

        // Rider & Scarf motion
        pelicanBody.setAttribute("transform", `translate(0, ${bobY.toFixed(2)})`);
        nearThighCuff.setAttribute("transform", `translate(0, ${(bobY * 0.65).toFixed(2)})`);
        farThighCuff.setAttribute("transform", `translate(0, ${(bobY * 0.65).toFixed(2)})`);
        nearWing.setAttribute("transform", `translate(0, ${(bobY * 0.45).toFixed(2)})`);
        farWing.setAttribute("transform", `translate(0, ${(bobY * 0.45).toFixed(2)})`);

        const scarfDeg = Math.sin(elapsed * (5.5 + speedMult * 4)) * (2.5 + speedMult * 2.2);
        scarfTails.setAttribute("transform", `rotate(${scarfDeg.toFixed(2)}, 454, 198)`);

        // Wheels, Chainring & Chain
        const wheelDeg = (wheelAngle * 180) / Math.PI;
        const crankDeg = ((crankAngle - Math.PI / 3) * 180) / Math.PI;
        rearRotor.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        frontRotor.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        chainringRotor.setAttribute("transform", `rotate(${crankDeg.toFixed(2)})`);
        bikeChain.setAttribute("stroke-dashoffset", (-roadDistance * 0.65).toFixed(2));

        // Road & Promenade Parallax
        const dashShift = -(roadDistance % 68);
        roadDashes.setAttribute("transform", `translate(${dashShift.toFixed(2)}, 0)`);

        const span = 1120; // 7 bollards * 160px
        bollardRects.forEach((rect, idx) => {
          const baseX = idx * 160;
          let x = ((baseX - roadDistance) % span + span) % span - 60;
          rect.setAttribute("x", x.toFixed(2));
        });

        const oceanShift = -((roadDistance * 0.08) % 240);
        oceanGlints.setAttribute("transform", `translate(${oceanShift.toFixed(2)}, 0)`);
        const cloudDrift = Math.sin(elapsed * 0.25) * 26;
        cloudsLayer.setAttribute("transform", `translate(${cloudDrift.toFixed(2)}, 0)`);
        const boatBob = Math.sin(elapsed * 1.8) * 1.6;
        sailboat.setAttribute("transform", `translate(${(835 - ((elapsed * 4) % 40)).toFixed(2)}, ${(384 + boatBob).toFixed(2)})`);
        const breezePulse = 0.35 + Math.min(0.55, speedMult * 0.25) * (0.7 + 0.3 * Math.sin(elapsed * 8));
        breezeLines.setAttribute("opacity", breezePulse.toFixed(2));
      }

      function tick(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (playing) {
          elapsed += dt;
          const crankOmega = 5.8 * speedMult; // rad/s
          const dCrank = crankOmega * dt;
          const dWheel = dCrank * 1.45; // slight overdrive gear ratio
          crankAngle += dCrank;
          wheelAngle += dWheel;
          roadDistance += dWheel * WHEEL_R;
        }

        if (bellTimer > 0) {
          bellTimer = Math.max(0, bellTimer - dt);
          const shake = Math.sin(bellTimer * 65) * 8 * (bellTimer / 0.7);
          bellDome.setAttribute("transform", `rotate(${shake.toFixed(2)}, 0, 5)`);
          bellWaves.setAttribute("opacity", (bellTimer / 0.7).toFixed(2));
        } else {
          bellDome.setAttribute("transform", "");
          bellWaves.setAttribute("opacity", "0");
        }

        if (winkTimer > 0) {
          winkTimer = Math.max(0, winkTimer - dt);
          pelicanEye.setAttribute("opacity", "0");
          pelicanWink.setAttribute("opacity", "1");
        } else {
          pelicanEye.setAttribute("opacity", "1");
          pelicanWink.setAttribute("opacity", "0");
        }

        updatePose();
        requestAnimationFrame(tick);
      }

      function playBellSound() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            audioCtx = new Ctx();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;
          [0, 0.14].forEach((offset) => {
            [2093, 3136].forEach((freq, idx) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(freq, now + offset);
              gain.gain.setValueAtTime(idx === 0 ? 0.12 : 0.05, now + offset);
              gain.gain.exponentialRampToValueAtTime(0.0008, now + offset + 0.55);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(now + offset);
              osc.stop(now + offset + 0.58);
            });
          });
        } catch (_) {
          // AudioContext optional
        }
      }

      function triggerBell() {
        bellTimer = 0.7;
        winkTimer = 0.45;
        playBellSound();
      }

      function updateReadout() {
        const rpm = playing ? Math.round(55 * speedMult) : 0;
        const kmh = playing ? (18.4 * speedMult).toFixed(1) : "0.0";
        cadenceRpmEl.textContent = rpm;
        speedKmhEl.textContent = kmh;
        speedLabel.textContent = `${speedMult.toFixed(1)}×`;
      }

      // Lighting mood switcher
      const MOODS = {
        morning: {
          sky: ["#76C5E2", "#CAEBF6", "#FFF1D4"],
          sunGlow: ["#FFFBE6", "#FFE08A", "#FFE08A"],
          sunDisc: "#FFF7CC",
          ocean: ["#2D8BBA", "#1E6C93", "#15506F"],
          road: ["#535D6B", "#38404B"],
          wall: ["#F6EFE2", "#DFD3BE"],
          headlands: ["#82B6C4", "#8DBEC8"],
          glint: "#BAE6FD",
          btnText: "切换落日金晖"
        },
        sunset: {
          sky: ["#5B5F97", "#E68A73", "#FFD08E"],
          sunGlow: ["#FFF3D1", "#FF9A52", "#FF9A52"],
          sunDisc: "#FFE099",
          ocean: ["#3F6C94", "#284B70", "#1B3350"],
          road: ["#4B4756", "#312E3B"],
          wall: ["#F0DFC8", "#D3B99D"],
          headlands: ["#8F7E8D", "#9B8793"],
          glint: "#FDE68A",
          btnText: "切换晨光海风"
        }
      };

      let currentMood = "morning";
      function applyMood(moodKey) {
        const m = MOODS[moodKey];
        document.body.dataset.mood = moodKey;
        document.getElementById("sky-stop-0").setAttribute("stop-color", m.sky[0]);
        document.getElementById("sky-stop-1").setAttribute("stop-color", m.sky[1]);
        document.getElementById("sky-stop-2").setAttribute("stop-color", m.sky[2]);
        document.getElementById("sun-glow-0").setAttribute("stop-color", m.sunGlow[0]);
        document.getElementById("sun-glow-1").setAttribute("stop-color", m.sunGlow[1]);
        document.getElementById("sun-glow-2").setAttribute("stop-color", m.sunGlow[2]);
        document.getElementById("sun-disc").setAttribute("fill", m.sunDisc);
        document.getElementById("ocean-stop-0").setAttribute("stop-color", m.ocean[0]);
        document.getElementById("ocean-stop-1").setAttribute("stop-color", m.ocean[1]);
        document.getElementById("ocean-stop-2").setAttribute("stop-color", m.ocean[2]);
        document.getElementById("road-stop-0").setAttribute("stop-color", m.road[0]);
        document.getElementById("road-stop-1").setAttribute("stop-color", m.road[1]);
        document.getElementById("wall-stop-0").setAttribute("stop-color", m.wall[0]);
        document.getElementById("wall-stop-1").setAttribute("stop-color", m.wall[1]);
        document.getElementById("headland-left").setAttribute("fill", m.headlands[0]);
        document.getElementById("headland-right").setAttribute("fill", m.headlands[1]);
        oceanGlints.setAttribute("stroke", m.glint);
        toggleMoodBtn.textContent = m.btnText;
      }

      // Event bindings
      togglePlayBtn.addEventListener("click", () => {
        playing = !playing;
        togglePlayBtn.textContent = playing ? "暂停骑行" : "继续骑行";
        updateReadout();
      });

      speedSlider.addEventListener("input", (e) => {
        speedMult = parseFloat(e.target.value);
        updateReadout();
      });

      ringBellBtn.addEventListener("click", triggerBell);
      bellHit.addEventListener("click", triggerBell);
      pelicanBody.addEventListener("click", () => {
        winkTimer = 0.45;
      });

      toggleMoodBtn.addEventListener("click", () => {
        currentMood = currentMood === "morning" ? "sunset" : "morning";
        applyMood(currentMood);
      });

      downloadSvgBtn.addEventListener("click", () => {
        const svgEl = document.getElementById("scene");
        const serializer = new XMLSerializer();
        const source = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(svgEl);
        const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pelican-pro3.svg";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.code === "Space") {
          e.preventDefault();
          togglePlayBtn.click();
        } else if (e.key === "b" || e.key === "B") {
          triggerBell();
        }
      });

      updateReadout();
      updatePose();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
