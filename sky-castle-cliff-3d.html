<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172a31">
<link rel="icon" href="data:,">
<title>风崖与浮城</title>
<style>
:root{color-scheme:dark;--ink:#f9efdc;--muted:#c3c9bc;--accent:#f0c98c;--border:rgba(237,217,181,.23);--glass:rgba(19,33,37,.84);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#172a31;color:var(--ink)}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(13,25,37,.34),transparent 25%,transparent 80%,rgba(11,22,25,.34))}
.masthead{position:absolute;top:max(27px,env(safe-area-inset-top));left:max(32px,env(safe-area-inset-left));text-shadow:0 2px 15px #15252ddd}
.masthead h1{font-family:"Songti SC","Noto Serif CJK SC",SimSun,serif;font-weight:600;font-size:clamp(30px,5vw,64px);margin:8px 0 0;letter-spacing:.13em;line-height:1.05}
.masthead p{margin:0;color:var(--accent);font-size:11px;letter-spacing:.27em;display:flex;align-items:center;gap:10px}
.masthead p::before{content:"";width:24px;height:1px;background:currentColor}
.toolbar{position:absolute;right:max(32px,env(safe-area-inset-right));top:max(27px,env(safe-area-inset-top));display:flex;align-items:flex-end;flex-direction:column;gap:8px}
button{appearance:none;font:inherit;color:inherit;border:1px solid transparent;border-radius:5px;padding:0 11px;min-height:44px;background:transparent;cursor:pointer;white-space:nowrap;pointer-events:auto;transition:color .2s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
button:hover{background:#f0c98c22;color:#fff9e9}
button:focus-visible,#scene:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{color:#ffe0a8;background:#d8ae7326;border-color:#e9c48b59}
.utility{display:flex;gap:6px}
.utility button,.chart,.console{background:var(--glass);border:1px solid var(--border);box-shadow:0 5px 24px #0002;backdrop-filter:blur(12px)}
.utility button{padding:0 12px;font-size:12px}
.chart{width:176px;padding:10px 12px 9px;border-radius:8px;font-size:10px;color:var(--muted);letter-spacing:.11em}
.chart-head{display:flex;justify-content:space-between;color:var(--ink)}
#altitude{color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.03em}
#chart{display:block;margin-top:5px;width:150px;height:61px}
.console{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:9px;padding:8px;border-radius:9px;max-width:calc(100% - 24px);pointer-events:auto}
.control-group{display:flex;align-items:center;gap:3px;min-width:0}
.control-group+.control-group{border-left:1px solid var(--border);padding-left:9px}
.group-label{font-size:10px;letter-spacing:.14em;color:#d4c4a8;padding:0 3px 0 5px;white-space:nowrap}
.console button{font-size:12px}
.play-symbol{display:inline-block;color:var(--accent);font-size:11px;margin-right:5px;min-width:11px}
#notice{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);max-width:calc(100% - 34px);width:max-content;padding:12px 18px;border:1px solid var(--border);border-radius:6px;background:var(--glass);font-size:14px;text-align:center}
@media(max-width:1050px){.console{gap:5px}.control-group+.control-group{padding-left:5px}.group-label{display:none}.console button{padding-inline:8px}}
@media(max-width:780px){
 .masthead{top:max(22px,env(safe-area-inset-top));left:15px}.masthead h1{letter-spacing:.09em}.masthead p{font-size:9px;letter-spacing:.19em}.masthead p::before{width:13px}
 .toolbar{right:12px;top:max(18px,env(safe-area-inset-top));gap:5px}.utility{gap:4px}.utility button{padding-inline:7px;font-size:11px}.chart{display:none}
 .console{width:calc(100% - 24px);bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column;gap:4px;padding:6px}.control-group{justify-content:center;gap:3px}.control-group+.control-group{padding:4px 0 0;border-left:0;border-top:1px solid var(--border)}.control-group button{flex:1}.console button{padding-inline:3px;font-size:11px}
}
@media(max-width:360px){.masthead h1{font-size:26px}.utility button{padding-inline:6px}.console{max-width:calc(100% - 16px);width:calc(100% - 16px)}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="可旋转探索的风崖与浮城三维场景"></canvas>
<main id="ui" aria-label="巡航控制">
  <header class="masthead" id="masthead"><p>拖动旋转 · 缩放视角</p><h1>风崖与浮城</h1></header>
  <div class="toolbar">
    <div class="utility">
      <button id="sound" type="button" aria-pressed="false" title="切换海风声景 (M)">声音</button>
      <button id="hud" type="button" aria-expanded="true" aria-controls="masthead chart-panel console sound" title="收起或展开控制台 (H)">收起面板</button>
    </div>
    <div id="chart-panel" class="chart" aria-label="浮城巡航图">
      <div class="chart-head"><span>巡航图</span><span id="altitude"></span></div>
      <canvas id="chart" width="300" height="122" aria-hidden="true"></canvas>
    </div>
  </div>
  <div class="console" id="console">
    <div class="control-group" role="group" aria-label="镜头视角">
      <span class="group-label" aria-hidden="true">视角</span>
      <button type="button" data-preset="wide" aria-pressed="true">悬崖全景</button>
      <button type="button" data-preset="castle" aria-pressed="false">浮空城堡</button>
      <button type="button" data-preset="tower" aria-pressed="false">山崖眺望</button>
      <button type="button" data-preset="sea" aria-pressed="false">海面仰望</button>
    </div>
    <div class="control-group" role="group" aria-label="天光">
      <span class="group-label" aria-hidden="true">天光</span>
      <button type="button" data-mode="day" aria-pressed="true">晴海长风</button>
      <button type="button" data-mode="sunset" aria-pressed="false">暮霞海天</button>
      <button type="button" data-mode="night" aria-pressed="false">星月夜航</button>
    </div>
    <div class="control-group" role="group" aria-label="巡航与跟随">
      <button type="button" id="play" title="播放或暂停 (Space)"><span class="play-symbol" aria-hidden="true">Ⅱ</span><span id="play-text">暂停</span></button>
      <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="2" aria-pressed="false">2×</button>
      <button type="button" id="follow" aria-pressed="false">跟随</button>
    </div>
  </div>
  <div id="notice" role="status">正在展开海岸图景…</div>
</main>

    }
    function resize() {
      const width=canvas.clientWidth || window.innerWidth;
      const height=canvas.clientHeight || window.innerHeight;
      const dimensionsChanged=width!==viewportWidth || height!==viewportHeight;
      viewportWidth=width;
      viewportHeight=height;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, width<=780?1.55:2));
      renderer.setSize(width,height,false);
      camera.aspect=width/Math.max(height,1);
      camera.fov=presetFov();
      camera.updateProjectionMatrix();
      if(dimensionsChanged && state.ready && !follow &&
        (transition || (presetAnchor && controls.target.distanceTo(presetAnchor)<.25))) {
        const {eye,target}=pose(state.preset);
        transition=null;
        camera.position.copy(eye);
        controls.target.copy(target);
        presetAnchor.copy(target);
        updateCamera(0);
      }
    }
    function updateCamera(delta) {
      if(transition) {
        transition.t=Math.min(1,transition.t+delta/1.22);
        const t=transition.t;
        const eased=t*t*(3-2*t);
        if(transition.trackingOnly) {
          trackedTarget.copy(castle.position).add(v3(0,3,0));
          controls.target.lerpVectors(transition.target,trackedTarget,eased);
          camera.position.copy(transition.eye).add(shift.subVectors(controls.target,transition.target));
        } else {
          const {eye,target}=pose(state.preset);
          camera.position.lerpVectors(transition.eye,eye,eased);
          controls.target.lerpVectors(transition.target,target,eased);
          camera.fov=mix(transition.fov,presetFov(),eased);
          camera.updateProjectionMatrix();
        }
        if(t===1) transition=null;
      } else if(follow) {
        shift.subVectors(castle.position,previousCastle);
        camera.position.add(shift);
        controls.target.add(shift);
      }
      previousCastle.copy(castle.position);
      controls.update(delta);
      if(camera.position.y<2.1) {
        camera.position.y=2.1;
        camera.lookAt(controls.target);
      }
      sky.position.copy(camera.position);
    }
    controls.addEventListener('start',()=>{
      if(transition) {
        transition=null;
        presetAnchor=null;
      }
    });
    controls.addEventListener('change',()=>{
      if(presetAnchor && !transition &&
        (controls.target.distanceTo(presetAnchor)>=.25 || camera.position.distanceTo(pose(state.preset).eye)>=.25)) {
        presetAnchor=null;
      }
    });
    window.addEventListener('resize',resize);

    function drawChart() {
      if(!chart || !hudOpen || !chartCanvas.clientWidth) return;
      const map=(p)=>[131+p.x*2.21,58+p.z*1.42];
      chart.clearRect(0,0,300,122);
      chart.lineWidth=1;
      chart.strokeStyle='rgba(214,205,175,.14)';
      chart.beginPath();
      for(let x=9;x<300;x+=23){chart.moveTo(x,0);chart.lineTo(x,122);}
      for(let y=10;y<122;y+=20){chart.moveTo(0,y);chart.lineTo(300,y);}
      chart.stroke();
      chart.fillStyle='rgba(169,184,145,.24)';
      chart.strokeStyle='rgba(185,196,155,.50)';
      chart.beginPath();
      chart.moveTo(0,3);
      chart.lineTo(42,0);chart.lineTo(60,10);chart.lineTo(55,21);chart.lineTo(75,36);chart.lineTo(60,57);
      chart.lineTo(78,76);chart.lineTo(44,90);chart.lineTo(39,109);chart.lineTo(0,119);
      chart.closePath();chart.fill();chart.stroke();
      chart.strokeStyle='#c7ad7b';
      chart.lineWidth=1.8;
      chart.setLineDash([4,4]);
      chart.beginPath();
      for(let i=0;i<=90;i++){
        const [x,y]=map(route(i/90*TAU/routeRate,pastPosition));
        if(i)chart.lineTo(x,y);else chart.moveTo(x,y);
      }
      chart.stroke();
      chart.setLineDash([]);
      const [x,y]=map(castle.position);
      chart.fillStyle='#f7d49b';
      chart.beginPath();chart.arc(x,y,4.6,0,TAU);chart.fill();
      chart.strokeStyle='#f7d49866';
      chart.beginPath();chart.arc(x,y,8.4,0,TAU);chart.stroke();
      $('altitude').textContent=`${Math.round(castle.position.y)} m`;
    }

    function makeAudio() {
      const Audio=window.AudioContext || window.webkitAudioContext;
      if(!Audio) return null;
      const ctx=new Audio();
      const volume=ctx.createGain();
      volume.gain.value=0;
      volume.connect(ctx.destination);
      const rng=seeded(676913);
      const buffer=ctx.createBuffer(1,ctx.sampleRate*4,ctx.sampleRate);
      const data=buffer.getChannelData(0);
      let drift=0;
      for(let i=0;i<data.length;i++) {
        const white=rng()*2-1;
        drift=drift*.968+white*.067;
        data[i]=drift*.80+white*.2;
      }
      const noise=ctx.createBufferSource();
      noise.buffer=buffer;
      noise.loop=true;
      function noiseBand(type, frequency, q, level, span, rate) {
        const filter=ctx.createBiquadFilter();
        const gain=ctx.createGain();
        const lfo=ctx.createOscillator();
        const depth=ctx.createGain();
        filter.type=type;
        filter.frequency.value=frequency;
        filter.Q.value=q;
        gain.gain.value=level;
        lfo.frequency.value=rate;
        depth.gain.value=span;
        noise.connect(filter).connect(gain).connect(volume);
        lfo.connect(depth).connect(gain.gain);
        lfo.start();
      }
      noiseBand('lowpass',325,.47,.48,.26,.197);
      noiseBand('bandpass',492,.83,.25,.16,.33);
      noiseBand('bandpass',1070,1.8,.047,.029,.121);
      noise.start();
      const brassFilter=ctx.createBiquadFilter();
      const machine=ctx.createGain();
      const tick=ctx.createOscillator();
      const tremolo=ctx.createGain();
      const pulseDepth=ctx.createGain();
      brassFilter.frequency.value=254;
      brassFilter.type='lowpass';
      machine.gain.value=Number(state.playing);
      tick.frequency.value=2.04*speed;
      tremolo.gain.value=.028;
      pulseDepth.gain.value=.025;
      tick.connect(pulseDepth).connect(tremolo.gain);
      brassFilter.connect(tremolo).connect(machine).connect(volume);
      for (const [freq,type] of [[54.9,'triangle'],[109.8,'sine'],[164.8,'sine']]) {
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.frequency.value=freq;
        osc.type=type;
        gain.gain.value=freq===54.9?.8:.13;
        osc.connect(gain).connect(brassFilter);
        osc.start();
      }
      tick.start();
      return {ctx,volume,machine,tick};
    }
    async function toggleAudio() {
      if(soundEnabled) soundEnabled=false;
      else {
        try {
          audio ??= makeAudio();
          if(!audio) return;
          soundEnabled=true;
          await audio.ctx.resume();
        } catch(error) {
          soundEnabled=false;
          console.warn('音频无法启动',error);
        }
      }
      if(audio) audio.volume.gain.setTargetAtTime(soundEnabled?.47:0,audio.ctx.currentTime,.18);
      $('sound').setAttribute('aria-pressed',String(soundEnabled));
      $('sound').textContent=soundEnabled?'静音':'声音';
    }
    function toggleHUD() {
      hudOpen=!hudOpen;
      for(const id of ['masthead','chart-panel','console','sound']) $(id).hidden=!hudOpen;
      $('hud').setAttribute('aria-expanded',String(hudOpen));
      $('hud').textContent=hudOpen?'收起面板':'展开面板';
    }
    function togglePlaying() {
      state.playing=!state.playing;
      $('play-text').textContent=state.playing?'暂停':'播放';
      $('play').querySelector('.play-symbol').textContent=state.playing?'Ⅱ':'▶';
      if(audio) audio.machine.gain.setTargetAtTime(Number(state.playing),audio.ctx.currentTime,.12);
    }
    $('sound').addEventListener('click',toggleAudio);
    $('hud').addEventListener('click',toggleHUD);
    $('play').addEventListener('click',togglePlaying);
    $('follow').addEventListener('click',()=>{ if(follow) transition=null; setFollow(!follow); });
    document.querySelectorAll('[data-preset]').forEach((b)=>b.addEventListener('click',()=>selectPreset(b.dataset.preset)));
    document.querySelectorAll('[data-mode]').forEach((b)=>b.addEventListener('click',()=>{
      setLighting(b.dataset.mode);
      animateWorld();
      renderer.shadowMap.needsUpdate=true;
    }));
    document.querySelectorAll('[data-speed]').forEach((b)=>b.addEventListener('click',()=>{
      speed=Number(b.dataset.speed);
      if(audio) audio.tick.frequency.setTargetAtTime(2.04*speed,audio.ctx.currentTime,.18);
      mark('[data-speed]','speed',speed);
    }));
    window.addEventListener('keydown',(event)=>{
      if(event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if(event.code==='Space') {
        event.preventDefault();
        togglePlaying();
      } else if(event.code==='KeyM') toggleAudio();
      else if(event.code==='KeyH') toggleHUD();
    });

    setLighting('day');
    resize();
    animateWorld();
    const opening=pose('wide');
    camera.position.copy(opening.eye);
    controls.target.copy(opening.target);
    presetAnchor=opening.target.clone();
    updateCamera(0);
    renderer.shadowMap.needsUpdate=true;
    renderer.render(scene,camera);
    state.ready=true;
    notice.hidden=true;
    drawChart();
    function frame(now) {
      const delta=lastFrame ? clamp((now-lastFrame)/1000,0,.065) : 0;
      lastFrame=now;
      if(state.playing && delta>0) {
        time+=delta;
        flightTime+=delta*speed;
        animateWorld();
        if(state.frames%6===0) renderer.shadowMap.needsUpdate=true;
      }
      updateCamera(delta);
      renderer.render(scene,camera);
      state.frames++;
      if(state.frames%6===0) drawChart();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
