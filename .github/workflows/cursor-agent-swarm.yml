name: Cursor Agent Swarm CI

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Swarm task prompt for Cursor Agent"
        required: true
        type: string
      workers_count:
        description: "Number of parallel worker slices to plan"
        required: false
        default: "3"
        type: string
      target_branch:
        description: "Base branch"
        required: false
        default: "main"
        type: string
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  swarm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        startsWith(github.event.comment.body, '/swarm') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Validate CURSOR_API_KEY secret
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::Missing CURSOR_API_KEY repository secret. Run: gh secret set CURSOR_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'main' }}

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor Agent Swarm (restricted workspace edits)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          INPUT_PROMPT: ${{ inputs.task_prompt }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          WORKERS_COUNT: ${{ inputs.workers_count || '3' }}
        run: |
          TASK_TEXT="${INPUT_PROMPT:-$COMMENT_BODY}"
          PROMPT_FILE="$(mktemp)"
          {
            echo "Follow AGENTS.md and .cursor/skills/swarm/SKILL.md."
            echo "IMPORTANT: Do NOT run git commit, git push, or gh pr create; a later workflow step publishes changes deterministically."
            echo "Suggested parallel worker budget: ${WORKERS_COUNT}."
            echo "Task:"
            printf '%s\n' "$TASK_TEXT"
          } > "$PROMPT_FILE"
          agent -p "$(cat "$PROMPT_FILE")" --model auto
          rm -f "$PROMPT_FILE"

      - name: Verify repository after Swarm execution
        run: python3 .cursor/skills/swarm-verify/scripts/verify_repo.py

      - name: Publish Swarm branch and Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          BASE_BRANCH: ${{ inputs.target_branch || 'main' }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No workspace changes produced by Cursor Swarm run."
            exit 0
          fi
          BRANCH_NAME="swarm/run-${RUN_ID}"
          git config user.name "PRO1V"
          git config user.email "valerie...@gmail.com"
          git checkout -B "$BRANCH_NAME"
          git add -A
          git commit -m "[PRO1V(valerie...@gmail.com)] ci(swarm): apply automated Cursor Swarm task #${RUN_ID}"
          git push -u origin "$BRANCH_NAME"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "feat(swarm): automated Cursor Swarm run #${RUN_ID}" \
            --body "Generated by GitHub Actions Cursor Agent Swarm workflow run \`#${RUN_ID}\` and verified with \`verify_repo.py\`."
