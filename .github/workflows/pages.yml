# 署名: PRO1V(valerie...@gmail.com)
name: Deploy Showcase & CursorSwarm to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository assets before publishing
        run: python3 .cursor/skills/swarm-verify/scripts/verify_repo.py

      - name: Assemble static site artifact
        run: |
          mkdir -p _site
          # 署名: PRO1V(valerie...@gmail.com) | 创作: Codespaces Codex (gpt-6.1-sol/xhigh) 提取核验双发布
          # 并发集成署名: PRO5C(crispinowilbourn@gmail.com) | 维护署名: PRO2H(hadcockulloa@gmail.com), PRO3J(saveljevsjill148@gmail.com), PRO1V(valerie...@gmail.com)
          cp index.html pelican-antigravity-ride.html pelican-coastal-courier.html pelican-sol-ride.html meadow-cottage-3d.html sky-castle-cliff-3d.html pelican-6000-years-mv.html pelican-6000-mv.html pelican-test.html the-pelican-test.html pelican-6000-pure-code.html swarm-demo.html pelican-swarm-demo.html pelican-ride.html pelican-ride.svg pelican_bike.html cursor-swarm-city.html cursor-swarm-foundry.html pelican-swarm-coaster.html _site/
          cp -r assets pro1 pro2 pro3 pro4 pro5 pro6 pelican-6000 _site/
          rm -rf _site/pelican-6000/tools/__pycache__
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
