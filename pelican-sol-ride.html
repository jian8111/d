<script>
(() => {
  'use strict';

  const byId = (id) => document.getElementById(id);
  const scene = byId('scene');
  const gear = byId('gear-select');
  const playToggle = byId('play-toggle');
  const blueprintButton = byId('blueprint-button');
  const modeButtons = [...document.querySelectorAll('[data-mode]')];
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  const elements = Object.fromEntries([
    'sun', 'night-sky', 'day-gulls', 'sun-water', 'cloud-drift', 'island-drift', 'sail-drift',
    'sea-lines', 'lighthouse', 'lighthouse-halo', 'lighthouse-ray', 'lantern-window',
    'verge-plants', 'foreground-plants', 'road-stitches', 'gravel', 'headlamp-light',
    'headlamp-lens', 'rear-wheel', 'front-wheel', 'chainring', 'chain', 'saddle',
    'saddle-spring', 'bird', 'tail-feathers', 'wing', 'basket-flowers', 'scarf-silhouette',
    'scarf-top-stripe', 'scarf-bottom-stripe', 'scarf-fringe', 'pouch', 'pouch-detail',
    'open-eye', 'closed-eye', 'bell-dome', 'bell-notes', 'note-one', 'note-two', 'note-three',
    'pouch-surprise', 'fish', 'droplets', 'blueprint', 'bird-hit', 'bell-hit', 'play-icon',
    'play-label', 'speed', 'distance', 'cadence', 'mode-name'
  ].map((id) => [id, byId(id)]));

  // Supply a local favicon so HTTP hosts do not need a separate file.
  const favicon = document.createElement('link');
  favicon.rel = 'icon';
  favicon.href = 'data:,';
  document.head.append(favicon);

  const palettes = {
    morning: {
      name: '晴海晨光', sun: [978, 178],
      colors: {
        'sky-top': '#a8a8df', 'sky-mid': '#d3c1e5', 'sky-low': '#ffe0c0',
        cloud: '#fff0e0', 'cloud-shadow': '#bea8d2', orb: '#fff0ba', halo: '#ffdbad',
        'island-far': '#a29ac7', 'island-near': '#807da9', 'sea-top': '#a09bc5', 'sea-low': '#66638d',
        wave: '#f8e1df', 'wall-top': '#e5bd9e', wall: '#b68e96', sand: '#e0af9d',
        'road-top': '#77708d', 'road-low': '#514b69', 'road-line': '#e5bbae',
        leaf: '#51476d', 'plant-light': '#8e6383', flower: '#f5d3ab',
        'tower-light': '#f8ddc0', 'tower-dark': '#c08d91', boat: '#f9dfc8', 'bike-light': '#fff1d8'
      }
    },
    sunset: {
      name: '琥珀落日', sun: [937, 254],
      colors: {
        'sky-top': '#9c78a5', 'sky-mid': '#e293a6', 'sky-low': '#ffc892',
        cloud: '#ffd4b1', 'cloud-shadow': '#bb789b', orb: '#ffe6a4', halo: '#ffb989',
        'island-far': '#a06b88', 'island-near': '#785678', 'sea-top': '#b78298', 'sea-low': '#6f577c',
        wave: '#ffcdaf', 'wall-top': '#d6a07f', wall: '#9f7181', sand: '#c9917f',
        'road-top': '#695771', 'road-low': '#46394f', 'road-line': '#e7ac96',
        leaf: '#4f3c58', 'plant-light': '#895a6e', flower: '#ffcb94',
        'tower-light': '#f1be9e', 'tower-dark': '#b7747b', boat: '#ffcea9', 'bike-light': '#fff0d4'
      }
    },
    night: {
      name: '港湾星夜', sun: [966, 164],
      colors: {
        'sky-top': '#20203f', 'sky-mid': '#373457', 'sky-low': '#736389',
        cloud: '#9d8db4', 'cloud-shadow': '#524869', orb: '#ffedcb', halo: '#bca7cf',
        'island-far': '#645c83', 'island-near': '#494567', 'sea-top': '#57577f', 'sea-low': '#343a59',
        wave: '#c4bae0', 'wall-top': '#a5849b', wall: '#695974', sand: '#876e83',
        'road-top': '#4a4764', 'road-low': '#302d49', 'road-line': '#b09ab4',
        leaf: '#342e50', 'plant-light': '#675481', flower: '#d6b4c6',
        'tower-light': '#c5a9bb', 'tower-dark': '#916b87', boat: '#d5c0cc', 'bike-light': '#eae2f6'
      }
    }
  };

  const tau = Math.PI * 2;
  const toDegrees = 180 / Math.PI;
  const rollingRadius = 76.5;
  const wheelRadiusMeters = 0.34;
  const pixelsPerMeter = rollingRadius / wheelRadiusMeters;
  const wheelTurnsPerCrank = 1.65;
  const cruiseCadence = 68;
  const crankX = 621;
  const crankY = 526;
  const crankRadius = 38;
  const ankleOffset = { x: -12, y: -9 };
  const notes = [elements['note-one'], elements['note-two'], elements['note-three']];
  const drops = [...elements.droplets.children];
  const nearLeg = makeLeg('near', 576, 389, 96, 94, 0);
  const farLeg = makeLeg('far', 565, 386, 99, 96, Math.PI);
  const anglePanel = nearLeg.angle.parentElement;
  let mode = 'morning';
  let playing = !motionPreference.matches;
  let multiplier = Number(gear.value);
  let blueprintOn = false;
  let rideSeconds = 0;
  let roadDistance = 0;
  let frameId = 0;
  let previousFrame = null;
  let nextTelemetry = 0;
  let bellStart = -Infinity;
  let pouchStart = -Infinity;
  let audioContext;

  function makeLeg(side, hipX, hipY, thigh, shin, phase) {
    const vectors = byId(side + '-vectors');
    return {
      hipX, hipY, thigh, shin, phase,
      lines: ['edge', 'color', 'light'].map((part) => byId(side + '-leg-' + part)),
      cranks: side === 'near' ? [byId('near-crank-edge'), byId('near-crank')] : [byId('far-crank')],
      foot: byId(side + '-foot'),
      vectorPath: vectors.querySelector('path'),
      joints: [...vectors.querySelectorAll('circle')],
      labels: [...vectors.querySelectorAll('text')],
      angle: byId(side + '-angle'),
      prefix: side === 'near' ? 'R ' : 'L '
    };
  }

  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const wrap = (value, period) => ((value % period) + period) % period;
  const fixed = (value) => value.toFixed(3);
  const smooth = (value) => {
    const t = clamp(value, 0, 1);
    return t * t * (3 - 2 * t);
  };
  const point = (x, y) => fixed(x) + ' ' + fixed(y);
  const translate = (element, x, y) => element.setAttribute('transform', 'translate(' + point(x, y) + ')');
  const rotate = (element, angle, x = 0, y = 0) => {
    element.setAttribute('transform', 'rotate(' + fixed(angle) + ' ' + point(x, y) + ')');
  };
  const visible = (element, show) => {
    const display = show ? 'inline' : 'none';
    if (element.getAttribute('display') !== display) element.setAttribute('display', display);
  };

  // Extend the periodically scrolling layers so the wrap stays outside the drawing.
  function repeatArt(group, indexes, period) {
    const originals = [...group.children];
    for (const index of indexes) {
      const copy = originals[index].cloneNode();
      copy.setAttribute('transform', 'translate(' + period + ' 0) ' + copy.getAttribute('transform'));
      group.append(copy);
    }
  }

  repeatArt(elements['cloud-drift'], [4], -1420);
  repeatArt(elements['cloud-drift'], [2, 3, 4], 1420);
  repeatArt(elements['sail-drift'], [1, 2, 3], 1320);

  function fitSceneControls() {
    const scale = scene.getScreenCTM()?.a;
    if (!scale) return;
    elements['bell-hit'].setAttribute('r', fixed(Math.max(23, 22 / scale)));
    const panelScale = clamp(0.78 / scale, 1, 1.75);
    anglePanel.setAttribute('transform', 'translate(321 487) scale(' + fixed(panelScale) + ')');
  }

  function setMode(nextMode) {
    mode = nextMode;
    const palette = palettes[mode];
    for (const [key, value] of Object.entries(palette.colors)) scene.style.setProperty('--' + key, value);
    translate(elements.sun, ...palette.sun);
    translate(elements['sun-water'], palette.sun[0], 0);
    visible(elements.sun, mode !== 'night');
    visible(elements['night-sky'], mode === 'night');
    visible(elements['day-gulls'], mode !== 'night');
    visible(elements['lighthouse-halo'], mode !== 'morning');
    visible(elements['headlamp-light'], mode !== 'morning');
    visible(elements['lighthouse-ray'], mode === 'night');
    elements['cloud-drift'].setAttribute('opacity', mode === 'night' ? '.48' : '1');
    elements['sun-water'].setAttribute('opacity', mode === 'night' ? '.56' : '1');
    elements['lighthouse-halo'].setAttribute('opacity', mode === 'sunset' ? '.79' : '1');
    elements['lantern-window'].setAttribute('fill', mode === 'morning' ? '#f5c991' : '#fff1a3');
    elements['headlamp-lens'].setAttribute('fill', mode === 'morning' ? '#e2c7a0' : '#fff2a7');
    for (const button of modeButtons) button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
    elements['mode-name'].textContent = palette.name;
    requestFrame();
  }

  function setPlaying(value) {
    playing = value;
    previousFrame = null;
    elements['play-label'].textContent = value ? '暂停' : '播放';
    elements['play-icon'].setAttribute('d', value ? 'M9 5v14m6-14v14' : 'm8 5 11 7-11 7Z');
    updateTelemetry();
    requestFrame();
  }

  function updateTelemetry() {
    const rpm = playing ? cruiseCadence * multiplier : 0;
    const speed = rpm / 60 * wheelTurnsPerCrank * tau * wheelRadiusMeters * 3.6;
    elements.speed.textContent = speed.toFixed(1);
    elements.distance.textContent = (roadDistance / pixelsPerMeter / 1000).toFixed(3);
    elements.cadence.textContent = String(Math.round(rpm));
  }

  function renderScenery() {
    const breeze = motionPreference.matches ? 0 : rideSeconds;
    translate(elements['cloud-drift'], -wrap(roadDistance * 0.024 + breeze * 2.2, 1420), 0);
    translate(elements['island-drift'], -34 * Math.sin(roadDistance / 3900), 0);
    translate(elements.lighthouse, -28 * Math.sin(roadDistance / 2850), 0);
    translate(elements['sail-drift'], -wrap(roadDistance * 0.055, 1320), Math.sin(breeze * 1.2) * 1.8);
    translate(elements['verge-plants'], -wrap(roadDistance * 0.71, 1280), 0);
    translate(elements['foreground-plants'], -wrap(roadDistance * 1.13, 1280), 0);
    elements['sea-lines'].setAttribute('patternTransform', 'translate(' +
      point(-wrap(roadDistance * 0.13 + breeze * 4, 550), Math.sin(breeze * 1.3) * 2) + ')');
    elements['road-stitches'].setAttribute('patternTransform',
      'translate(' + point(-wrap(roadDistance, 580), 565) + ')');
    elements.gravel.setAttribute('patternTransform', 'translate(' + point(-wrap(roadDistance, 147), 0) + ')');

    if (mode === 'night') {
      const sweep = breeze * 0.64 + 0.52;
      const facing = Math.cos(sweep);
      const rise = Math.sin(sweep);
      const angle = Math.atan2(rise * 0.19, facing) * toDegrees;
      const length = 0.25 + Math.abs(facing) * 0.75;
      elements['lighthouse-ray'].setAttribute('transform', 'rotate(' + fixed(angle) + ') scale(' + fixed(length) + ' 1)');
      elements['lighthouse-ray'].setAttribute('opacity', fixed(0.38 + Math.abs(facing) * 0.62));
    }
  }

  function renderLeg(leg, crankAngle, bounce) {
    const angle = crankAngle + leg.phase;
    const pedalX = crankX + Math.cos(angle) * crankRadius;
    const pedalY = crankY + Math.sin(angle) * crankRadius;
    const hipX = leg.hipX;
    const hipY = leg.hipY + bounce;
    const ankleX = pedalX + ankleOffset.x;
    const ankleY = pedalY + ankleOffset.y;
    const dx = ankleX - hipX;
    const dy = ankleY - hipY;

    // The full pedal circle lies inside the reachable annulus for both leg lengths.
    // The cosine rule locates the knee on the forward side of the hip–ankle vector.
    const distance = Math.hypot(dx, dy);
    const projection = (leg.thigh ** 2 - leg.shin ** 2 + distance ** 2) / (2 * distance);
    const height = Math.sqrt(Math.max(0, leg.thigh ** 2 - projection ** 2));
    const kneeX = hipX + (dx * projection + dy * height) / distance;
    const kneeY = hipY + (dy * projection - dx * height) / distance;
    const pose = 'M' + point(hipX, hipY) + 'L' + point(kneeX, kneeY) + ' ' + point(ankleX, ankleY);
    const crank = 'M' + point(crankX, crankY) + 'L' + point(pedalX, pedalY);
    for (const line of leg.lines) line.setAttribute('d', pose);
    for (const arm of leg.cranks) arm.setAttribute('d', crank);
    translate(leg.foot, pedalX, pedalY);

    if (blueprintOn) {
      leg.vectorPath.setAttribute('d', pose);
      const joints = [[hipX, hipY], [kneeX, kneeY], [ankleX, ankleY]];
      for (const [index, [x, y]] of joints.entries()) {
        leg.joints[index].setAttribute('cx', fixed(x));
        leg.joints[index].setAttribute('cy', fixed(y));
        const label = leg.labels[index];
        if (label) {
          label.setAttribute('x', fixed(x + 8));
          label.setAttribute('y', fixed(y - 8));
        }
      }
      const cosine = (leg.thigh ** 2 + leg.shin ** 2 - distance ** 2) / (2 * leg.thigh * leg.shin);
      const kneeAngle = Math.acos(clamp(cosine, -1, 1)) * toDegrees;
      leg.angle.textContent = leg.prefix + kneeAngle.toFixed(1) + '°';
    }
  }

  function renderScarf(wind) {
    const edgeX = 490 - wind * 1.1;
    const edgeY = 283 + wind;
    elements['scarf-silhouette'].setAttribute('d', 'M601 284C566 281 557 ' + fixed(273 - wind * .4) +
      ' 540 ' + fixed(279 - wind * .22) + 'Q511 ' + fixed(291 + wind * .5) + ' ' +
      point(edgeX, edgeY - 10) + 'L' + point(edgeX - 2, edgeY + 8) +
      'Q517 ' + fixed(312 + wind * .36) + ' 544 ' + fixed(298 - wind * .23) +
      'T598 298Z');
    elements['scarf-top-stripe'].setAttribute('d', 'M595 287Q564 ' + fixed(280 - wind * .48) +
      ' 540 ' + fixed(285 - wind * .22) + 'Q515 ' + fixed(295 + wind * .45) + ' ' + point(edgeX + 1, edgeY - 5));
    elements['scarf-bottom-stripe'].setAttribute('d', 'M593 294Q567 ' + fixed(286 - wind * .4) +
      ' 543 ' + fixed(292 - wind * .22) + 'Q514 ' + fixed(303 + wind * .37) + ' ' + point(edgeX, edgeY + 3));
    elements['scarf-fringe'].setAttribute('d', [0, 4, 8, 12].map((index) =>
      'M' + point(edgeX, edgeY - 8 + index) + 'l-7 -3').join(''));
  }

  function renderBike() {
    // Rolling without slip: the same ground displacement drives the road and rθ.
    const wheelRadians = roadDistance / rollingRadius;
    const wheelAngle = wrap(wheelRadians, tau) * toDegrees;
    const crankAngle = wrap(wheelRadians / wheelTurnsPerCrank + 0.54, tau);
    const reduced = motionPreference.matches;
    const bounce = reduced ? 0 : 1.25 * Math.sin(crankAngle * 2 - 0.4) + 0.65 * Math.sin(rideSeconds * 9.1);
    elements['rear-wheel'].setAttribute('transform', 'translate(457 526) rotate(' + fixed(wheelAngle) + ')');
    elements['front-wheel'].setAttribute('transform', 'translate(789 526) rotate(' + fixed(wheelAngle) + ')');
    rotate(elements.chainring, crankAngle * toDegrees);
    elements.chain.setAttribute('stroke-dashoffset', fixed(-wrap(crankAngle * 23.5, 6)));
    translate(elements.saddle, 0, bounce);
    translate(elements.bird, 0, bounce);
    translate(elements['bird-hit'], 0, bounce);
    elements['saddle-spring'].setAttribute('transform', 'translate(0 435) scale(1 ' +
      fixed(1 - bounce / 18) + ') translate(0 -435)');
    renderLeg(farLeg, crankAngle, bounce);
    renderLeg(nearLeg, crankAngle, bounce);

    const breeze = reduced ? 0 : Math.sin(rideSeconds * 4.7) * 4.8 + Math.sin(rideSeconds * 8.1) * 1.9;
    renderScarf(breeze + (reduced ? 0 : multiplier * 0.8));
    rotate(elements['tail-feathers'], breeze * 0.71, 520, 382);
    rotate(elements.wing, Math.sin(crankAngle) * (reduced ? 0 : 1.4), 681, 375);
    elements['basket-flowers'].setAttribute('transform', 'translate(809 384) rotate(' + fixed(breeze * .42) + ')');
    const blinking = !reduced && wrap(rideSeconds + 0.85, 4.9) > 4.75;
    visible(elements['open-eye'], !blinking);
    visible(elements['closed-eye'], blinking);
    return bounce;
  }

  function renderEffects(time, bounce) {
    const reduced = motionPreference.matches;
    const bellAge = (time - bellStart) / 1000;
    const bellActive = bellAge < 1.67;
    visible(elements['bell-notes'], bellActive);
    translate(elements['bell-dome'], 0, bellActive && !reduced ?
      Math.sin(bellAge * 100) * Math.exp(-bellAge * 9) : 0);
    if (bellActive) {
      notes.forEach((note, index) => {
        const age = bellAge - index * .16;
        const progress = clamp(age / 1.35, 0, 1);
        const lift = reduced ? 0 : progress;
        note.setAttribute('transform', 'translate(' +
          point(725 + index * 26 + lift * (17 + 7 * index), 351 - index * 13 - lift * 88) +
          ') rotate(' + fixed(-10 + index * 9 + lift * 15) + ')');
        note.setAttribute('opacity', fixed(smooth(age / .13) * (1 - smooth((progress - .5) / .5))));
      });
    }

    const pouchAge = (time - pouchStart) / 1000;
    const pouchActive = pouchAge < 1.87;
    const opening = pouchActive ? smooth(pouchAge / .2) * (1 - smooth((pouchAge - .67) / .63)) : 0;
    const ripple = pouchActive && !reduced ? Math.sin(pouchAge * 17) * opening : 0;
    elements.pouch.setAttribute('d', 'M664 231Q679 ' + fixed(247 + opening * 9) + ' 708 ' +
      fixed(250 + opening * 21) + 'Q767 ' + fixed(251 + opening * 24) + ' 837 ' +
      fixed(253 + opening * 47) + 'Q778 ' + fixed(268 + opening * 51) + ' 722 ' +
      fixed(279 + opening * 43 + ripple) + 'Q681 ' + fixed(286 + opening * 24) +
      ' 656 ' + fixed(273 + opening * 3) + 'Q668 249 664 231Z');
    elements['pouch-detail'].setAttribute('d', 'M670 ' + fixed(264 + opening * 11) + 'Q708 ' +
      fixed(284 + opening * 55 + ripple) + ' 773 ' + fixed(267 + opening * 48));
    const fishActive = pouchActive && pouchAge >= .12 && pouchAge <= 1.43;
    visible(elements['pouch-surprise'], fishActive);
    if (fishActive) {
      const t = clamp((pouchAge - .12) / 1.31, 0, 1);
      const x = reduced ? 850 : 805 + t * 172;
      const y = reduced ? 218 : 266 + bounce - 355 * t + 420 * t ** 2;
      const angle = reduced ? -12 : -28 + 93 * t + Math.sin(t * 35) * 7;
      const opacity = smooth(t / .08) * (1 - smooth((t - .8) / .2));
      elements.fish.setAttribute('transform', 'translate(' + point(x, y) + ') rotate(' + fixed(angle) + ')');
      elements.fish.setAttribute('opacity', fixed(opacity));
      drops.forEach((drop, index) => {
        const spread = reduced ? .43 : t;
        const vx = 31 + index * 24;
        const vy = 190 + (index % 3) * 37;
        translate(drop, 801 + spread * vx, 263 + bounce - vy * spread + 295 * spread ** 2);
        drop.setAttribute('opacity', fixed(opacity * (1 - .36 * index / drops.length)));
      });
    }
    return bellActive || pouchActive;
  }

  function requestFrame() {
    if (!frameId) frameId = requestAnimationFrame(frame);
  }

  function frame(time) {
    frameId = 0;
    if (playing && previousFrame !== null) {
      const delta = clamp((time - previousFrame) / 1000, 0, .064);
      const wheelSpeed = cruiseCadence * multiplier / 60 * wheelTurnsPerCrank * tau * rollingRadius;
      rideSeconds += delta;
      roadDistance += delta * wheelSpeed;
    }
    previousFrame = playing ? time : null;
    renderScenery();
    const bounce = renderBike();
    const effectsActive = renderEffects(time, bounce);
    if (time >= nextTelemetry) {
      updateTelemetry();
      nextTelemetry = time + 100;
    }
    if (playing || effectsActive) requestFrame();
  }

  function getAudio() {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return null;
    try {
      audioContext ||= new Audio();
      if (audioContext.state !== 'running') audioContext.resume().catch(() => {});
      return audioContext;
    } catch {
      return null;
    }
  }

  function playBellAudio(audio) {
    const now = audio.currentTime + .008;
    const partials = [[1, .12, .38], [1.49, .064, .22], [2.08, .043, .17],
      [2.67, .028, .11], [3.89, .017, .076], [5.13, .01, .045]];
    for (const [strike, force] of [[now, 1], [now + .115, .56]]) {
      for (const [ratio, volume, decay] of partials) {
        const oscillator = audio.createOscillator();
        const envelope = audio.createGain();
        oscillator.frequency.setValueAtTime(782 * ratio, strike);
        oscillator.frequency.exponentialRampToValueAtTime(779 * ratio, strike + .034);
        envelope.gain.setValueAtTime(.0001, strike);
        envelope.gain.exponentialRampToValueAtTime(volume * force, strike + .004);
        envelope.gain.exponentialRampToValueAtTime(.0001, strike + decay);
        oscillator.connect(envelope).connect(audio.destination);
        oscillator.start(strike);
        oscillator.stop(strike + decay + .01);
      }
    }
  }

  function playPouchAudio(audio) {
    const now = audio.currentTime + .14;
    const length = Math.ceil(audio.sampleRate * .25);
    const noise = audio.createBuffer(1, length, audio.sampleRate);
    const samples = noise.getChannelData(0);
    for (let i = 0; i < length; i++) samples[i] = Math.random() * 2 - 1;
    const spray = audio.createBufferSource();
    const filter = audio.createBiquadFilter();
    const sprayVolume = audio.createGain();
    spray.buffer = noise;
    filter.type = 'bandpass';
    filter.Q.value = .73;
    filter.frequency.setValueAtTime(2480, now);
    filter.frequency.exponentialRampToValueAtTime(640, now + .23);
    sprayVolume.gain.setValueAtTime(.001, now);
    sprayVolume.gain.exponentialRampToValueAtTime(.35, now + .019);
    sprayVolume.gain.exponentialRampToValueAtTime(.001, now + .24);
    spray.connect(filter).connect(sprayVolume).connect(audio.destination);
    spray.start(now);

    const chirp = audio.createOscillator();
    const chirpVolume = audio.createGain();
    const start = now + .085;
    chirp.type = 'triangle';
    chirp.frequency.setValueAtTime(430, start);
    chirp.frequency.exponentialRampToValueAtTime(1350, start + .071);
    chirp.frequency.exponentialRampToValueAtTime(540, start + .19);
    chirpVolume.gain.setValueAtTime(.0001, start);
    chirpVolume.gain.exponentialRampToValueAtTime(.073, start + .038);
    chirpVolume.gain.exponentialRampToValueAtTime(.0001, start + .22);
    chirp.connect(chirpVolume).connect(audio.destination);
    chirp.start(start);
    chirp.stop(start + .23);
  }

  function ringBell() {
    bellStart = performance.now();
    const audio = getAudio();
    if (audio) playBellAudio(audio);
    requestFrame();
  }

  function surprisePouch() {
    pouchStart = performance.now();
    const audio = getAudio();
    if (audio) playPouchAudio(audio);
    requestFrame();
  }

  function toggleBlueprint() {
    blueprintOn = !blueprintOn;
    visible(elements.blueprint, blueprintOn);
    blueprintButton.setAttribute('aria-pressed', String(blueprintOn));
    requestFrame();
  }

  function exportSnapshot() {
    renderScenery();
    renderEffects(performance.now(), renderBike());
    const snapshot = scene.cloneNode(true);
    snapshot.setAttribute('width', '1280');
    snapshot.setAttribute('height', '680');
    snapshot.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    snapshot.setAttribute('role', 'img');
    snapshot.querySelector('#near-angle')?.parentElement.setAttribute('transform', 'translate(321 487)');
    snapshot.querySelectorAll('[data-interactive], [display="none"]').forEach((element) => element.remove());
    const markup = new XMLSerializer().serializeToString(snapshot);
    const signature = '<!-- 署名: PRO2H(hadcockulloa@gmail.com) -->';
    const blob = new Blob([signature, '\n', markup], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'pelican-sol-ride-' + mode + '.svg';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  for (const button of modeButtons) button.addEventListener('click', () => setMode(button.dataset.mode));
  playToggle.addEventListener('click', () => setPlaying(!playing));
  gear.addEventListener('change', () => {
    multiplier = Number(gear.value);
    updateTelemetry();
    requestFrame();
  });
  byId('bell-button').addEventListener('click', ringBell);
  byId('pouch-button').addEventListener('click', surprisePouch);
  blueprintButton.addEventListener('click', toggleBlueprint);
  byId('export-button').addEventListener('click', exportSnapshot);
  elements['bell-hit'].addEventListener('click', ringBell);
  elements['bird-hit'].addEventListener('click', surprisePouch);
  for (const [target, action] of [[elements['bell-hit'], ringBell], [elements['bird-hit'], surprisePouch]]) {
    target.addEventListener('keydown', (event) => {
      if ((event.key === 'Enter' || event.code === 'Space') && !event.repeat) {
        event.preventDefault();
        action();
      }
    });
  }
  document.addEventListener('keydown', (event) => {
    if (event.defaultPrevented || event.repeat || event.isComposing ||
        event.altKey || event.ctrlKey || event.metaKey || event.target === gear) return;
    if (event.code === 'Space') {
      if (event.target !== playToggle && event.target.matches?.('button:focus-visible')) return;
      event.preventDefault();
      setPlaying(!playing);
    } else {
      const shortcuts = { b: ringBell, f: surprisePouch, i: toggleBlueprint };
      const action = shortcuts[event.key.toLowerCase()];
      if (action) {
        event.preventDefault();
        action();
      }
    }
  });
  document.addEventListener('visibilitychange', () => { previousFrame = null; });
  motionPreference.addEventListener('change', (event) => {
    if (event.matches) setPlaying(false);
    requestFrame();
  });

  new ResizeObserver(fitSceneControls).observe(scene);
  setMode(mode);
  setPlaying(playing);
})();
</script>
</body>
</html>
