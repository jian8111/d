<!DOCTYPE html>
<!-- 署名: PRO1V(valerie...@gmail.com) | Antigravity 原创直写（非 Codex） -->
<html lang="zh-CN" data-theme="azure">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<title>海风邮差号 · Pelican Antigravity Ride</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2312767e'/%3E%3Cpath d='M9 17c4-7 10-7 15-3-4 2-6 5-10 5-2 0-4-1-5-2Z' fill='%23fff8ea'/%3E%3Cpath d='M18 13l8 2-6 3Z' fill='%23f59e42'/%3E%3C/svg%3E">
<style>
  :root {
    --page-bg: #f6f2e8;
    --panel-bg: #fffdf8;
    --panel-soft: #f1eadc;
    --ink: #172b38;
    --muted: #556a78;
    --line: #dfd5c1;
    --accent: #12767e;
    --accent-hover: #0d5c63;
    --accent-soft: #dff1f0;
    --accent-ink: #0c5258;
    --shadow: rgba(20, 44, 58, 0.11);
    --badge-bg: rgba(23, 43, 56, 0.78);
    --badge-ink: #fdf9f0;
    --kbd-bg: #ebe3d2;
    --stage-border: #cfc4ae;
    color-scheme: light;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  }

  html[data-theme="tangerine"] {
    --page-bg: #faf0e6;
    --panel-bg: #fffaf4;
    --panel-soft: #f5e5d5;
    --ink: #2c1b26;
    --muted: #6f525d;
    --line: #e4ccb9;
    --accent: #c94e2c;
    --accent-hover: #a83d20;
    --accent-soft: #fce3d8;
    --accent-ink: #8f3218;
    --shadow: rgba(65, 29, 28, 0.12);
    --badge-bg: rgba(44, 27, 38, 0.8);
    --badge-ink: #fff6ea;
    --kbd-bg: #efdccb;
    --stage-border: #d9b8a1;
  }

  html[data-theme="lantern"] {
    --page-bg: #0e1625;
    --panel-bg: #152136;
    --panel-soft: #1c2c47;
    --ink: #eef4fc;
    --muted: #98aec8;
    --line: #283c5c;
    --accent: #efb447;
    --accent-hover: #f7c768;
    --accent-soft: #273752;
    --accent-ink: #ffd780;
    --shadow: rgba(3, 8, 18, 0.45);
    --badge-bg: rgba(12, 22, 39, 0.84);
    --badge-ink: #f5f0dc;
    --kbd-bg: #223452;
    --stage-border: #2c4368;
    color-scheme: dark;
  }

  html[data-theme="sakura"] {
    --page-bg: #faf2f4;
    --panel-bg: #fffbfc;
    --panel-soft: #f5e5ea;
    --ink: #292030;
    --muted: #6c5b71;
    --line: #e5cfd6;
    --accent: #c14a70;
    --accent-hover: #9f3859;
    --accent-soft: #fae0e8;
    --accent-ink: #8c2c4c;
    --shadow: rgba(58, 28, 46, 0.11);
    --badge-bg: rgba(41, 32, 48, 0.78);
    --badge-ink: #fff7fa;
    --kbd-bg: #efdde2;
    --stage-border: #dabcc6;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    max-width: 100%;
    overflow-x: clip;
    background: var(--page-bg);
    color: var(--ink);
    transition: background-color 0.2s ease;
  }

  button, select {
    font: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
    touch-action: manipulation;
  }

  button:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap {
    width: min(100% - 48px, 1340px);
    margin: 0 auto;
    padding: 14px 0 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand {
    min-width: 0;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 0 0 3px;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .eyebrow-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent);
    display: inline-block;
  }

  .masthead h1 {
    margin: 0;
    color: var(--ink);
    font-size: clamp(1.55rem, 3vw, 2.45rem);
    line-height: 1.08;
    letter-spacing: -0.03em;
    font-weight: 800;
  }

  .masthead .sub {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.42;
  }

  .theme-bar {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px;
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 6px 18px -10px var(--shadow);
  }

  .theme-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 40px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 700;
    white-space: nowrap;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .theme-btn:hover {
    background: var(--panel-soft);
    color: var(--ink);
  }

  .theme-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-color: color-mix(in srgb, var(--accent) 34%, transparent);
  }

  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    display: inline-block;
    flex: none;
  }

  .stage-card {
    position: relative;
    margin: 0;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--stage-border);
    background: #6ab5dc;
    box-shadow: 0 20px 48px -24px var(--shadow);
  }

  #scene {
    display: block;
    width: 100%;
    aspect-ratio: 1280 / 550;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .stage-hud {
    position: absolute;
    left: 14px;
    right: 14px;
    top: 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
  }

  .hud-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 11px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-ink);
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .hud-pill strong {
    font-variant-numeric: tabular-nums;
  }

  .hud-toast {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translate(-50%, 8px);
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-ink);
    font-size: 0.8rem;
    font-weight: 650;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
    max-width: calc(100% - 28px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hud-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 13px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-bg);
    color: var(--ink);
    font-size: 0.84rem;
    font-weight: 680;
    white-space: nowrap;
    transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .btn:hover {
    background: var(--panel-soft);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
    min-width: 96px;
  }

  html[data-theme="lantern"] .btn.primary {
    color: #121c2d;
  }

  .btn.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .btn[aria-pressed="true"]:not(.primary) {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  }

  .gear-box {
    position: relative;
    display: inline-flex;
    align-items: center;
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    min-height: 44px;
  }

  .gear-box select {
    appearance: none;
    border: 0;
    background: transparent;
    min-height: 42px;
    padding: 0 30px 0 34px;
    font-size: 0.84rem;
    font-weight: 680;
    cursor: pointer;
  }

  .gear-icon {
    position: absolute;
    left: 10px;
    width: 17px;
    height: 17px;
    pointer-events: none;
    color: var(--accent);
  }

  .gear-chevron {
    position: absolute;
    right: 9px;
    width: 14px;
    height: 14px;
    pointer-events: none;
    color: var(--muted);
  }

  .ico {
    width: 17px;
    height: 17px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.85;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .spacer {
    margin-inline-start: auto;
  }

  kbd {
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--kbd-bg);
    color: var(--muted);
    font: 700 0.65rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .telemetry {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    margin: 0;
  }

  .telemetry > div {
    min-width: 0;
    padding: 10px 14px;
  }

  .telemetry > div + div {
    border-left: 1px solid var(--line);
  }

  .telemetry dt {
    margin: 0 0 3px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
  }

  .telemetry dd {
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 3px 6px;
    font-size: 1.24rem;
    font-weight: 780;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  .telemetry .unit {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
  }

  .foot-note {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--muted);
    padding: 0 2px;
  }

  #hit-pelican, #hit-bell, #hit-road, #hit-sky {
    cursor: pointer;
  }

  @media (max-width: 900px) {
    .wrap {
      width: calc(100% - 28px);
      padding: 16px 0 24px;
    }
    #scene {
      aspect-ratio: 1280 / 680;
    }
    .spacer {
      margin-inline-start: 0;
    }
  }

  @media (max-width: 640px) {
    .wrap {
      width: calc(100% - 20px);
      padding: 12px 0 20px;
      gap: 10px;
    }
    .masthead {
      gap: 10px;
    }
    .masthead .sub {
      font-size: 0.82rem;
    }
    .theme-bar {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
    }
    .theme-btn {
      padding: 0 4px;
      gap: 4px;
      font-size: 0.74rem;
      min-height: 38px;
    }
    .swatch {
      width: 8px;
      height: 8px;
    }
    .stage-card {
      border-radius: 13px;
    }
    #scene {
      aspect-ratio: 1.15;
    }
    .stage-hud {
      left: 8px;
      right: 8px;
      top: 8px;
    }
    .hud-pill {
      padding: 5px 9px;
      font-size: 0.69rem;
    }
    .hud-hint {
      display: none;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .btn {
      min-width: 0;
      padding: 0 6px;
      font-size: 0.76rem;
      gap: 4px;
      min-height: 44px;
    }
    .btn.primary {
      min-width: 0;
    }
    .gear-box {
      min-width: 0;
    }
    .gear-box select {
      width: 100%;
      padding: 0 22px 0 7px;
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gear-chevron {
      right: 6px;
      width: 12px;
      height: 12px;
    }
    .gear-icon, kbd {
      display: none;
    }
    .telemetry {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .telemetry > div {
      padding: 9px 10px;
    }
    .telemetry > div:nth-child(3) {
      border-left: 0;
      border-top: 1px solid var(--line);
    }
    .telemetry > div:nth-child(4) {
      border-top: 1px solid var(--line);
    }
    .telemetry dd {
      font-size: 1.06rem;
    }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="masthead">
    <div class="brand">
      <p class="eyebrow"><span class="eyebrow-dot"></span>ANTIGRAVITY ORIGINAL · PURE SVG &amp; 2-BONE IK</p>
      <h1>海风邮差号</h1>
      <p class="sub">戴水手帽的白鹈鹕骑着复古海湾单车沿堤岸送航空信——零外链纯矢量动画、真实无滑移轮速与可互动海风物理。</p>
    </div>
    <div class="theme-bar" role="group" aria-label="海岸天色">
      <button type="button" class="theme-btn" data-theme="azure" aria-pressed="true"><span class="swatch" style="background:#3e9fd6"></span>晴汐蓝</button>
      <button type="button" class="theme-btn" data-theme="tangerine" aria-pressed="false"><span class="swatch" style="background:#e87d44"></span>橘子海</button>
      <button type="button" class="theme-btn" data-theme="lantern" aria-pressed="false"><span class="swatch" style="background:#7eb3ff"></span>夏夜萤火</button>
      <button type="button" class="theme-btn" data-theme="sakura" aria-pressed="false"><span class="swatch" style="background:#e58ca8"></span>樱风薄雾</button>
    </div>
  </header>

  <figure class="stage-card">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">海风邮差号 · 海岸骑行的白鹈鹕</title>
      <desc id="svg-desc">戴着深蓝邮差帽与珊瑚红条纹围巾的白鹈鹕，骑着满载航空信件与鲜活沙丁鱼的复古绿松石单车，沿地中海风格的跨海堤岸迎风骑行。</desc>
      <defs>
        <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
          <stop id="sky-s0" offset="0%" stop-color="#3c8fc9"/>
          <stop id="sky-s1" offset="52%" stop-color="#87c8e6"/>
          <stop id="sky-s2" offset="100%" stop-color="#f8ebd2"/>
        </linearGradient>
        <radialGradient id="orb-halo" cx="50%" cy="50%" r="50%">
          <stop id="halo-s0" offset="0%" stop-color="#fff8d6" stop-opacity="0.92"/>
          <stop id="halo-s1" offset="38%" stop-color="#ffe8a8" stop-opacity="0.45"/>
          <stop id="halo-s2" offset="100%" stop-color="#ffe8a8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sea-grad" x1="0" y1="0" x2="0" y2="1">
          <stop id="sea-s0" offset="0%" stop-color="#3593b3"/>
          <stop id="sea-s1" offset="45%" stop-color="#227796"/>
          <stop id="sea-s2" offset="100%" stop-color="#175873"/>
        </linearGradient>
        <linearGradient id="road-grad" x1="0" y1="0" x2="0" y2="1">
          <stop id="road-s0" offset="0%" stop-color="#5d6b78"/>
          <stop id="road-s1" offset="60%" stop-color="#45525f"/>
          <stop id="road-s2" offset="100%" stop-color="#323d48"/>
        </linearGradient>
        <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="1">
          <stop id="wall-s0" offset="0%" stop-color="#f2e4cb"/>
          <stop id="wall-s1" offset="100%" stop-color="#cbb899"/>
        </linearGradient>
        <linearGradient id="beam-grad" x1="0" y1="0.5" x2="1" y2="0.5">
          <stop offset="0%" stop-color="#fff0a6" stop-opacity="0.62"/>
          <stop offset="55%" stop-color="#ffd56b" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#ffd56b" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="body-grad" x1="0.1" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="68%" stop-color="#f7f2e7"/>
          <stop offset="100%" stop-color="#e3d9c8"/>
        </linearGradient>
        <linearGradient id="wing-grad" x1="0" y1="0" x2="0.9" y2="1">
          <stop offset="0%" stop-color="#fffdf8"/>
          <stop offset="62%" stop-color="#ebe3d5"/>
          <stop offset="100%" stop-color="#cfc5b6"/>
        </linearGradient>
        <linearGradient id="beak-top-grad" x1="0" y1="0" x2="1" y2="0.3">
          <stop offset="0%" stop-color="#ffd978"/>
          <stop offset="72%" stop-color="#f5b349"/>
          <stop offset="100%" stop-color="#e37c34"/>
        </linearGradient>
        <linearGradient id="pouch-grad" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#f9aa4e"/>
          <stop offset="60%" stop-color="#ec7f3a"/>
          <stop offset="100%" stop-color="#c95b2b"/>
        </linearGradient>
        <linearGradient id="frame-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#26a3a6"/>
          <stop offset="55%" stop-color="#14797e"/>
          <stop offset="100%" stop-color="#0d5358"/>
        </linearGradient>
        <linearGradient id="leather-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b5643b"/>
          <stop offset="100%" stop-color="#6e361c"/>
        </linearGradient>
        <linearGradient id="fish-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e8f9ff"/>
          <stop offset="48%" stop-color="#7dc7e4"/>
          <stop offset="100%" stop-color="#2e6b8e"/>
        </linearGradient>
        <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff4b8" stop-opacity="0.9"/>
          <stop offset="45%" stop-color="#ffca64" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#ffca64" stop-opacity="0"/>
        </radialGradient>

        <!-- Reusable 18-Spoke Vintage Wheel -->
        <g id="wheel-def">
          <circle r="82" fill="none" stroke="#1e2730" stroke-width="11"/>
          <circle r="76" fill="none" stroke="#efe4cc" stroke-width="3.6"/>
          <circle r="71" fill="none" stroke="#c7b79c" stroke-width="2.4"/>
          <circle r="67" fill="none" stroke="#7d8f9c" stroke-width="1.4" stroke-opacity="0.65"/>
          <g id="wheel-spokes" stroke="#d8e2e8" stroke-width="1.35" stroke-opacity="0.88"></g>
          <rect x="-2.2" y="-68" width="4.4" height="9" rx="1.5" fill="#e5b34c" stroke="#24313b" stroke-width="1"/>
          <circle r="11" fill="#d9a441" stroke="#1e2730" stroke-width="2.2"/>
          <circle r="4.5" fill="#fff3d1"/>
        </g>
      </defs>

      <!-- 1. SKY & CELESTIAL LAYER -->
      <rect id="hit-sky" width="1280" height="390" fill="url(#sky-grad)"/>
      <g id="stars-layer" opacity="0"></g>

      <g id="celestial" transform="translate(970, 128)">
        <circle r="142" fill="url(#orb-halo)"/>
        <circle id="orb-ring" r="52" fill="none" stroke="#fff7d6" stroke-width="1.5" stroke-opacity="0.32" stroke-dasharray="6 8"/>
        <circle id="orb-core" r="34" fill="#fff7d4"/>
        <path id="moon-crescent" d="M 6,-32 A 32,32 0 1 1 -28,16 A 25,25 0 1 0 6,-32 Z" fill="#fff6cc" opacity="0"/>
      </g>

      <!-- Slow Parallax Clouds -->
      <g id="clouds-far"></g>

    const beta = Math.asin((r2 - r1) / d);
    const nTop = base - Math.PI / 2 - beta;
    const nBot = base + Math.PI / 2 + beta;

    const topD = `M ${(Math.cos(nTop) * r1).toFixed(2)},${(Math.sin(nTop) * r1).toFixed(2)} L ${(BB.x + Math.cos(nTop) * r2).toFixed(2)},${(BB.y + Math.sin(nTop) * r2).toFixed(2)}`;

  /* -------------------- Procedural Web Audio Soundscape -------------------- */
  const Sound = (() => {
    let ctx = null;
    let enabled = false;
    let masterGain = null;
    let oceanGain = null;
    let windFilter = null;
    let windGain = null;

    function ensureCtx() {
      if (ctx) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.0001;
      masterGain.connect(ctx.destination);

      // Synthesize seamless 2s noise buffer for ocean waves & coastal breeze
      const sr = ctx.sampleRate;
      const len = sr * 2;
      const buf = ctx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.04 * w) / 1.04;
        data[i] = last * 3.2;
      }

      // Ocean surf bed
      const surfSrc = ctx.createBufferSource();
      surfSrc.buffer = buf;
      surfSrc.loop = true;
      const surfFilter = ctx.createBiquadFilter();
      surfFilter.type = "lowpass";
      surfFilter.frequency.value = 340;
      oceanGain = ctx.createGain();
      oceanGain.gain.value = 0.14;
      const surfLfo = ctx.createOscillator();
      surfLfo.frequency.value = 0.14;
      const surfLfoGain = ctx.createGain();
      surfLfoGain.gain.value = 0.06;
      surfLfo.connect(surfLfoGain).connect(oceanGain.gain);
      surfSrc.connect(surfFilter).connect(oceanGain).connect(masterGain);
      surfSrc.start();
      surfLfo.start();

      // Speed-coupled coastal wind
      const windSrc = ctx.createBufferSource();
      windSrc.buffer = buf;
      windSrc.loop = true;
      windFilter = ctx.createBiquadFilter();
      windFilter.type = "bandpass";
      windFilter.frequency.value = 520;
      windFilter.Q.value = 1.6;
      windGain = ctx.createGain();
      windGain.gain.value = 0.04;
      windSrc.connect(windFilter).connect(windGain).connect(masterGain);
      windSrc.start();

      return true;
    }

    function setEnabled(flag) {
      enabled = flag;
      if (enabled) {
        if (!ensureCtx()) return false;
        if (ctx.state === "suspended") ctx.resume();
        masterGain.gain.setTargetAtTime(0.65, ctx.currentTime, 0.08);
      } else if (ctx && masterGain) {
        masterGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.06);
      }
      return enabled;
    }

    function updateAmbience(speedKmh, gustStrength) {
      if (!enabled || !ctx || !windFilter || !windGain) return;
      const now = ctx.currentTime;
      const freq = 380 + speedKmh * 14 + gustStrength * 420;
      const gain = Math.min(0.24, 0.02 + speedKmh * 0.002 + gustStrength * 0.11);
      windFilter.frequency.setTargetAtTime(freq, now, 0.12);
      windGain.gain.setTargetAtTime(gain, now, 0.12);
    }

    function playBell() {
      if (!enabled || !ensureCtx()) return;
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      const partials = [
        { f: 1568, g: 0.24, d: 1.25 },
        { f: 3136, g: 0.11, d: 0.72 },
        { f: 4280, g: 0.06, d: 0.44 }
      ];
      [0, 0.11].forEach((offset, hit) => {
        partials.forEach((p) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(p.f * (hit ? 1.006 : 1), now + offset);
          gain.gain.setValueAtTime(0.0001, now + offset);
          gain.gain.linearRampToValueAtTime(p.g, now + offset + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + p.d);
          osc.connect(gain).connect(masterGain);
          osc.start(now + offset);
          osc.stop(now + offset + p.d + 0.04);
        });
      });
    }

    function playFishToss() {
      if (!enabled || !ensureCtx()) return;
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(360, now);
      osc.frequency.exponentialRampToValueAtTime(760, now + 0.14);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      osc.connect(gain).connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.22);
    }

    function playFishCatch() {
      if (!enabled || !ensureCtx()) return;
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + idx * 0.055);
        gain.gain.setValueAtTime(0.001, now + idx * 0.055);
        gain.gain.linearRampToValueAtTime(0.14, now + idx * 0.055 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.055 + 0.22);
        osc.connect(gain).connect(masterGain);
        osc.start(now + idx * 0.055);
        osc.stop(now + idx * 0.055 + 0.24);
      });
    }

    function playHop() {
      if (!enabled || !ensureCtx()) return;
      if (ctx.state === "suspended") ctx.resume();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      const filt = ctx.createBiquadFilter();
      filt.type = "lowpass";
      filt.frequency.value = 640;
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.exponentialRampToValueAtTime(390, now + 0.16);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.13, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
      osc.connect(filt).connect(gain).connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.26);
    }

    function playTick() {
      if (!enabled || !ctx || ctx.state !== "running") return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(980, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.02);
      gain.gain.setValueAtTime(0.026, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.024);
      osc.connect(gain).connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.026);
    }

    return { setEnabled, updateAmbience, playBell, playFishToss, playFishCatch, playHop, playTick };
  })();

  /* -------------------- Analytical 2-Bone IK Solver -------------------- */
  function solve2BoneIK(hip, target, l1, l2) {
    const dx = target.x - hip.x;
    const dy = target.y - hip.y;
    const rawD = Math.hypot(dx, dy);
    const minD = Math.abs(l1 - l2) + 0.5;
    const maxD = l1 + l2 - 0.5;
    const d = Math.max(minD, Math.min(maxD, rawD));
    const ux = dx / (rawD || 1);
    const uy = dy / (rawD || 1);

    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const hSq = Math.max(0, l1 * l1 - a * a);
    const h = Math.sqrt(hSq);

    // Forward (+x) knee bend in SVG (+x right, +y down): rotate u by -90° => (uy, -ux)
    const kx = hip.x + a * ux + h * uy;
    const ky = hip.y + a * uy - h * ux;

    const cosKnee = Math.max(-1, Math.min(1, (l1 * l1 + l2 * l2 - d * d) / (2 * l1 * l2)));
    const kneeDeg = Math.acos(cosKnee) * (180 / Math.PI);

    return { knee: { x: kx, y: ky }, kneeDeg };
  }

  function exportSVG() {
    const svg = el("scene");
    const clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", SVG_NS);
    clone.setAttribute("width", "1280");
    clone.setAttribute("height", "680");
    const comment = document.createComment(" 署名: PRO1V(valerie...@gmail.com) | 海风邮差号 · Pelican Antigravity Ride 导出帧 ");
    const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' +
      new XMLSerializer().serializeToString(comment) + "\n" +
      new XMLSerializer().serializeToString(clone);

    const a = document.createElement("a");

    a.download = `pelican-antigravity-ride-${state.theme}.svg`;
    document.body.appendChild(a);
    a.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`已导出当前帧：pelican-antigravity-ride-${state.theme}.svg`);
  }

  /* -------------------- Main Simulation & Render Loop -------------------- */
  let lastTs = 0;

  function step(dt) {
    const gCfg = GEARS[state.gear];
    const gustFactor = 1 + state.gust * 0.42;
    const targetRpm = gCfg.rpm * gustFactor;
    state.rpm += (targetRpm - state.rpm) * Math.min(1, dt * 4.5);

    const crankOmega = (state.rpm / 60) * Math.PI * 2;
    const wheelOmega = crankOmega * gCfg.ratio;
    const groundPxPerSec = wheelOmega * WHEEL_R;

    // 0.70m wheel diameter => circumference ~2.199m
    const wheelRevsPerSec = wheelOmega / (Math.PI * 2);
    state.speedKmh = wheelRevsPerSec * 2.199 * 3.6;

    if (state.playing) {
      state.time += dt;
      state.crankAngle = (state.crankAngle + crankOmega * dt) % (Math.PI * 2);
      state.wheelAngle = (state.wheelAngle + wheelOmega * dt) % (Math.PI * 2);
      state.chainOffset = (state.chainOffset + crankOmega * 20 * dt) % 16;
      state.distanceM += wheelRevsPerSec * 2.199 * dt;
      state.windmillAngle = (state.windmillAngle + (24 + state.gust * 65) * dt) % 360;

      // Cadence half-turn mechanical click
      const halfTurn = Math.floor(state.crankAngle / Math.PI);
      if (halfTurn !== state.lastHalfTurn) {
        state.lastHalfTurn = halfTurn;
        Sound.playTick();
      }
    }

    // Decay tailwind gust
    if (state.gust > 0) state.gust = Math.max(0, state.gust - dt * 0.36);

    // Bunny-hop & wheelie spring physics
    if (state.hopY > 0 || state.hopVy !== 0) {
      state.hopVy -= 1320 * dt;
      state.hopY += state.hopVy * dt;
      if (state.hopY < 0) {
        state.hopY = 0;
        state.hopVy = 0;
      }
    }
    if (state.wheelie > 0 || Math.abs(state.wheelieV) > 0.05) {
      const spring = -42 * state.wheelie - 6.8 * state.wheelieV;
      state.wheelieV += spring * dt;
      state.wheelie += state.wheelieV * dt;
      if (state.wheelie < 0) {
        state.wheelie = 0;
        state.wheelieV = Math.max(0, -state.wheelieV * 0.25);
      }
      if (state.wheelie > 22) {
        state.wheelie = 22;
        state.wheelieV = Math.min(0, state.wheelieV);
      }
    }

    // Bell ring animation
    if (state.bellAnim > 0) state.bellAnim = Math.max(0, state.bellAnim - dt * 1.4);

    // Fish toss parabolic arc
    if (state.fish.active) {
      state.fish.t += dt;
      if (state.fish.t >= state.fish.dur) {
        state.fish.active = false;
        state.fish.caught += 1;
        state.pouchJiggle = 1.0;
        Sound.playFishCatch();
        showToast(`精准接住！已吞下第 ${state.fish.caught} 条沙丁鱼`);
      }
    }
    if (state.pouchJiggle > 0) state.pouchJiggle = Math.max(0, state.pouchJiggle - dt * 2.2);

    // Blinking
    state.blinkTimer -= dt;
    if (state.blinkTimer <= 0) {
      state.blinkDur = 0.14;
      state.blinkTimer = 2.6 + Math.random() * 3.4;
    }
    if (state.blinkDur > 0) state.blinkDur = Math.max(0, state.blinkDur - dt);

    Sound.updateAmbience(state.playing ? state.speedKmh : 0, state.gust);

    const worldDx = state.playing ? groundPxPerSec * dt : 0;
    renderWorld(worldDx, dt);
    renderBikeAndPelican();
    renderTelemetry();
  }

  function renderWorld(worldDx, dt) {
    const t = state.time;
    const theme = THEMES[state.theme];

    // Twinkle stars
    if (theme.starsAlpha > 0) {
      for (const s of starsData) {
        const tw = 0.45 + 0.55 * Math.sin(t * 2.4 + s.phase);
        s.el.setAttribute("opacity", tw.toFixed(2));
      }
    }

    // Clouds
    for (const c of cloudsFar) {
      c.x -= worldDx * c.speed + (state.playing ? 6 * dt : 0);
      if (c.x < -140) c.x += 1560;
      c.el.setAttribute("transform", `translate(${c.x.toFixed(1)}, ${c.y})`);
    }
    for (const c of cloudsNear) {
      c.x -= worldDx * c.speed + (state.playing ? 12 * dt : 0);
      if (c.x < -160) c.x += 1600;
      c.el.setAttribute("transform", `translate(${c.x.toFixed(1)}, ${c.y})`);
    }

    // Seabirds
    for (const b of birds) {
      b.x -= worldDx * 0.09 + (state.playing ? 22 * dt : 0);
      if (b.x < -60) {
        b.x = 1340;
        b.scatterY = 0;
        b.scatterVy = 0;
      }
      if (b.scatterY !== 0 || b.scatterVy !== 0) {
        b.scatterVy += 68 * dt;
        b.scatterY += b.scatterVy * dt;
        if (b.scatterY > 0) { b.scatterY = 0; b.scatterVy = 0; }
      }
      const flap = Math.sin(t * 6.5 + b.p) * 5.5 * b.s;
      const w = 13 * b.s;
      const y = b.y + b.scatterY + Math.sin(t * 1.8 + b.p) * 3;
      b.el.setAttribute("d", `M${(b.x - w).toFixed(1)},${(y - flap).toFixed(1)} Q${(b.x - w * 0.45).toFixed(1)},${(y - 5 * b.s).toFixed(1)} ${b.x.toFixed(1)},${y.toFixed(1)} Q${(b.x + w * 0.45).toFixed(1)},${(y - 5 * b.s).toFixed(1)} ${(b.x + w).toFixed(1)},${(y - flap).toFixed(1)}`);
    }

    // Islands & Cliffside Town
    for (const isl of islands) {
      isl.offset -= worldDx * 0.085;
      if (isl.offset <= -1600) isl.offset += 3200;
      isl.el.setAttribute("transform", `translate(${isl.offset.toFixed(1)}, 0)`);
    }
    if (windmillBlades) {
      windmillBlades.forEach((b) => b.setAttribute("transform", `translate(0, -10) rotate(${state.windmillAngle.toFixed(1)})`));
    }

    // Sea Sun/Moon Shimmer
    const orbX = theme.orbPos[0];
    for (const s of shimmerBars) {
      const shift = Math.sin(t * 2.1 + s.phase) * 14;
      const half = s.w * (0.45 + 0.08 * Math.sin(t * 3 + s.phase));
      s.el.setAttribute("x1", (orbX - half + shift).toFixed(1));
      s.el.setAttribute("x2", (orbX + half + shift).toFixed(1));
    }

    // Sailboats
    for (const b of boats) {
      b.x -= worldDx * b.speed;
      if (b.x < -80) b.x = 1360;
      const bob = Math.sin(t * 2.2 + b.p) * 2.4;
      const tilt = Math.sin(t * 1.7 + b.p) * 2.8;
      b.el.setAttribute("transform", `translate(${b.x.toFixed(1)}, ${(b.y + bob).toFixed(1)}) rotate(${tilt.toFixed(2)})`);
    }

    // Ocean Waves
    for (const w of waves) {
      w.x -= worldDx * w.speed;
      if (w.x < -120) w.x += 1440;
      const bob = Math.sin(t * 2.6 + w.phase) * 1.6;
      w.el.setAttribute("transform", `translate(${w.x.toFixed(1)}, ${(w.y + bob).toFixed(1)})`);
    }

    // Occasional Leaping Sea Fish
    for (const jf of seaJumpers) {
      if (!jf.active) {
        jf.timer -= dt;
        if (jf.timer <= 0 && state.playing) {
          jf.active = true;
          jf.t = 0;
          jf.x = 180 + Math.random() * 940;
          jf.y = 375 + Math.random() * 52;
        }
      } else {
        jf.t += dt;
        const u = jf.t / jf.dur;
        if (u >= 1) {
          jf.active = false;
          jf.timer = 4.2 + Math.random() * 5.0;
          jf.el.setAttribute("opacity", "0");
        } else {
          const fx = jf.x + (u - 0.5) * 68;
          const fy = jf.y - Math.sin(u * Math.PI) * 34;
          const ang = (0.5 - u) * -95;
          jf.el.setAttribute("opacity", Math.sin(u * Math.PI).toFixed(2));
          jf.el.setAttribute("transform", `translate(${fx.toFixed(1)}, ${fy.toFixed(1)}) rotate(${ang.toFixed(1)})`);
        }
      }
    }

    // Balustrade (mid-near speed)
    const balWrap = balustrades.length * 64;
    for (const b of balustrades) {
      b.x -= worldDx * 0.72;
      if (b.x < -64) b.x += balWrap;
      b.el.setAttribute("transform", `translate(${b.x.toFixed(1)}, 0)`);
    }

    // Promenade Trees & Lampposts
    for (const p of promenadeProps) {
      p.x -= worldDx * 0.82;
      if (p.x < -120) p.x += 1680;
      p.el.setAttribute("transform", `translate(${p.x.toFixed(1)}, 0)`);
    }

    // Road Dashes (true 1:1 ground speed!)
    const dashWrap = roadDashes.length * 160;
    for (const d of roadDashes) {
      d.x -= worldDx;
      if (d.x < -120) d.x += dashWrap;
      d.el.setAttribute("x", d.x.toFixed(1));
    }

    // Milepost (true 1:1 ground speed)
    for (const m of mileposts) {
      m.x -= worldDx;
      if (m.x < -60) {
        m.x = 1360;
        m.num += 1;
        m.txt.textContent = `${String(m.num).padStart(2, "0")}k`;
      }
      m.el.setAttribute("transform", `translate(${m.x.toFixed(1)}, 0)`);
    }

    // Slipstream Wind Ribbons (visible at higher gears or during gust)
    const speedRatio = Math.max(0, (state.speedKmh - 18) / 28) + state.gust * 0.85;
    for (const r of windRibbons) {
      r.x -= worldDx * (1.28 + state.gust * 0.5) + (state.playing ? 120 * dt : 0);
      if (r.x < -220) r.x = 1340 + Math.random() * 140;
      const op = Math.min(0.55, speedRatio * 0.42);
      r.el.setAttribute("opacity", op.toFixed(2));
      if (op > 0.02) {
        const wy = r.y + Math.sin(t * 5 + r.phase) * 6;
        const amp = 6 + state.gust * 8;
        r.el.setAttribute("d", `M${r.x.toFixed(1)},${wy.toFixed(1)} Q${(r.x + r.len * 0.5).toFixed(1)},${(wy - amp).toFixed(1)} ${(r.x + r.len).toFixed(1)},${wy.toFixed(1)}`);
      }
    }

    // Atmosphere Particles (Petals / Fireflies / Embers / Sea Spray)
    const pType = theme.particleType;
    for (const p of particles) {
      if (state.playing) {
        const speedMul = pType === "firefly" ? 0.35 : (0.7 + state.gust * 0.9);
        p.x += (p.vx * speedMul - worldDx * (pType === "firefly" ? 0.15 : 0.35)) * dt;
        p.y += (pType === "firefly" ? Math.sin(t * 2.5 + p.phase) * 18 : p.vy) * dt;
        p.rot += 110 * dt;
      }
      if (p.x < -30) { p.x = 1310; p.y = 90 + Math.random() * 440; }
      if (p.y > 650) { p.y = 60; p.x = 200 + Math.random() * 1080; }

      if (pType === "petal") {
        p.el.setAttribute("fill", "#ffd2e2");
        p.el.setAttribute("rx", "5.5");
        p.el.setAttribute("ry", "2.8");
        p.el.setAttribute("opacity", "0.78");
        p.el.setAttribute("transform", `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(0)})`);
      } else if (pType === "firefly") {
        const glow = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 3.8 + p.phase));
        p.el.setAttribute("fill", "#ffe97d");
        p.el.setAttribute("rx", "2.6");
        p.el.setAttribute("ry", "2.6");
        p.el.setAttribute("opacity", glow.toFixed(2));
        p.el.setAttribute("transform", `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)})`);
      } else if (pType === "ember") {
        p.el.setAttribute("fill", "#ffd99c");
        p.el.setAttribute("rx", "2.6");
        p.el.setAttribute("ry", "1.6");
        p.el.setAttribute("opacity", "0.46");
        p.el.setAttribute("transform", `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(0)})`);
      } else {
        const sprayOp = Math.min(0.45, 0.12 + state.gust * 0.35);
        p.el.setAttribute("fill", "#ffffff");
        p.el.setAttribute("rx", "3.4");
        p.el.setAttribute("ry", "1.4");
        p.el.setAttribute("opacity", sprayOp.toFixed(2));
        p.el.setAttribute("transform", `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)})`);
      }
    }
  }

  let latestKneeR = 112;
  let latestKneeL = 112;

  function renderBikeAndPelican() {
    const t = state.time;
    const phi = state.crankAngle;
    const wheelDeg = (state.wheelAngle * 180) / Math.PI;
    const crankDeg = (phi * 180) / Math.PI;

    // Suspension bounce synced to 2x pedal torque + gentle road texture
    const pedalBounce = Math.sin(phi * 2) * 2.1 + Math.sin(t * 9.5) * (state.playing ? 0.6 : 0);
    const rigY = RIG_BASE_Y - state.hopY + pedalBounce;
    el("rig-root").setAttribute("transform", `translate(${RIG_BASE_X}, ${rigY.toFixed(2)})`);
    el("rig-pitch").setAttribute("transform", `rotate(${(-state.wheelie).toFixed(2)})`);

    // Ground shadow responds to jump & wheelie
    const shScale = Math.max(0.55, 1 - state.hopY / 260);
    const shRx = 192 * shScale - state.wheelie * 1.4;
    el("bike-shadow").setAttribute("rx", shRx.toFixed(1));
    el("bike-shadow").setAttribute("opacity", (0.34 * shScale).toFixed(2));

    // Rotate wheels & chainring & chain links
    el("wheel-rear").setAttribute("transform", `translate(0, 0) rotate(${wheelDeg.toFixed(2)})`);
    el("wheel-front").setAttribute("transform", `translate(228, 0) rotate(${wheelDeg.toFixed(2)})`);
    el("chainring").setAttribute("transform", `translate(${BB.x}, ${BB.y}) rotate(${crankDeg.toFixed(2)})`);
    el("chain-upper-links").setAttribute("stroke-dashoffset", (-state.chainOffset).toFixed(2));
    el("chain-lower-links").setAttribute("stroke-dashoffset", (state.chainOffset).toFixed(2));

    // Pedals (180° opposed)
    const pr = { x: BB.x + Math.cos(phi) * CRANK_R, y: BB.y + Math.sin(phi) * CRANK_R };
    const pl = { x: BB.x - Math.cos(phi) * CRANK_R, y: BB.y - Math.sin(phi) * CRANK_R };

    el("crank-near").setAttribute("x2", pr.x.toFixed(2));
    el("crank-near").setAttribute("y2", pr.y.toFixed(2));
    el("crank-near-hi").setAttribute("x2", pr.x.toFixed(2));
    el("crank-near-hi").setAttribute("y2", pr.y.toFixed(2));
    el("pedal-near").setAttribute("transform", `translate(${pr.x.toFixed(2)}, ${pr.y.toFixed(2)})`);

    el("crank-far").setAttribute("x2", pl.x.toFixed(2));
    el("crank-far").setAttribute("y2", pl.y.toFixed(2));
    el("pedal-far").setAttribute("transform", `translate(${pl.x.toFixed(2)}, ${pl.y.toFixed(2)})`);

    // Pelican posture dynamics (leans forward slightly at high gears)
    const leanDeg = Math.min(7, (state.gear - 2) * 1.4 + state.gust * 2.5) - state.wheelie * 0.25;
    const bodyBob = Math.sin(phi * 2 - 0.6) * 2.6;
    el("pelican-body-group").setAttribute("transform", `translate(0, ${bodyBob.toFixed(2)}) rotate(${leanDeg.toFixed(2)}, 54, -124)`);

    // 2-Bone Analytical IK for Both Pelican Legs!
    const hipR = { x: HIP_R.x, y: HIP_R.y + bodyBob * 0.55 };
    const hipL = { x: HIP_L.x, y: HIP_L.y + bodyBob * 0.55 };
    const ankleR = { x: pr.x, y: pr.y - 5 };
    const ankleL = { x: pl.x, y: pl.y - 5 };

    const ikR = solve2BoneIK(hipR, ankleR, L1, L2);
    const ikL = solve2BoneIK(hipL, ankleL, L1, L2);
    latestKneeR = ikR.kneeDeg;
    latestKneeL = ikL.kneeDeg;

    const legRD = `M ${hipR.x.toFixed(1)},${hipR.y.toFixed(1)} L ${ikR.knee.x.toFixed(1)},${ikR.knee.y.toFixed(1)} L ${ankleR.x.toFixed(1)},${ankleR.y.toFixed(1)}`;
    const legLD = `M ${hipL.x.toFixed(1)},${hipL.y.toFixed(1)} L ${ikL.knee.x.toFixed(1)},${ikL.knee.y.toFixed(1)} L ${ankleL.x.toFixed(1)},${ankleL.y.toFixed(1)}`;

    el("leg-near-outline").setAttribute("d", legRD);
    el("leg-near-fill").setAttribute("d", legRD);
    el("leg-near-hi").setAttribute("d", legRD);
    el("leg-far-outline").setAttribute("d", legLD);
    el("leg-far-fill").setAttribute("d", legLD);

    // Webbed pelican feet resting flat on self-leveling pedals
    const footPath = (a) => `M ${(a.x - 10).toFixed(1)},${(a.y + 2).toFixed(1)} Q ${(a.x + 4).toFixed(1)},${(a.y - 4).toFixed(1)} ${(a.x + 17).toFixed(1)},${(a.y + 3).toFixed(1)} Q ${(a.x + 8).toFixed(1)},${(a.y + 6).toFixed(1)} ${(a.x - 10).toFixed(1)},${(a.y + 4).toFixed(1)} Z`;
    el("foot-near").setAttribute("d", footPath(ankleR));
    el("foot-far").setAttribute("d", footPath(ankleL));

    // Keep forewing hand aligned to handlebar grip despite torso bob/lean
    const rad = (-leanDeg * Math.PI) / 180;
    const gx = 138 - 54, gy = -158 - (-124) - bodyBob;
    const lx = 54 + gx * Math.cos(rad) - gy * Math.sin(rad) - 76;
    const ly = -124 + gx * Math.sin(rad) + gy * Math.cos(rad) - (-172);
    const midX = (12 + lx) * 0.5 + 8;
    const midY = (4 + ly) * 0.5 + 14;
    const armD = `M 12,4 Q ${midX.toFixed(1)},${midY.toFixed(1)} ${lx.toFixed(1)},${ly.toFixed(1)}`;
    el("arm-near-outline").setAttribute("d", armD);
    el("arm-near-fill").setAttribute("d", armD);
    el("hand-near").setAttribute("cx", lx.toFixed(1));
    el("hand-near").setAttribute("cy", ly.toFixed(1));

    // Wing flap on hop/wheelie & subtle feather flutter on speed
    const flapDeg = state.hopY * 0.42 + state.wheelie * 0.85 + Math.sin(t * 8) * (1.2 + state.gust * 4);
    el("wing-flap").setAttribute("transform", `rotate(${flapDeg.toFixed(2)}, -4, 0)`);

    // Tail feather wag
    const tailWag = Math.sin(t * 7 + phi) * 3.5 + (state.pouchJiggle > 0.1 ? Math.sin(t * 28) * 9 : 0);
    el("pelican-tail").setAttribute("transform", `translate(-30, -158) rotate(${tailWag.toFixed(2)})`);

    // Dynamic Sailor Scarf Wave Spline
    const windAmp = 5 + state.speedKmh * 0.24 + state.gust * 11;
    const windFreq = 7.5 + state.speedKmh * 0.16 + state.gust * 6;
    const pts = [];
    for (let i = 0; i <= 7; i++) {
      const u = i / 7;
      const sx = 86 - u * (118 + state.gust * 26);
      const sy = -208 + u * 16 + Math.sin(t * windFreq - u * 5.2) * windAmp * u;
      pts.push([sx, sy]);
    }
    let scarfD = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 1; i < pts.length; i++) {
      const p0 = pts[i - 1], p1 = pts[i];
      const mx = ((p0[0] + p1[0]) * 0.5).toFixed(1);
      const my = ((p0[1] + p1[1]) * 0.5).toFixed(1);
      scarfD += ` Q ${p0[0].toFixed(1)},${p0[1].toFixed(1)} ${mx},${my}`;
    }
    const lastP = pts[pts.length - 1];
    scarfD += ` L ${lastP[0].toFixed(1)},${lastP[1].toFixed(1)}`;
    el("scarf-tail-shadow").setAttribute("d", scarfD);
    el("scarf-tail-main").setAttribute("d", scarfD);
    el("scarf-tail-stripe").setAttribute("d", scarfD);

    // Head subtle nod, cap lift on hop, blinking & fish tracking
    let headPitch = Math.sin(phi * 2) * 1.8;
    let targetJaw = 0;
    let pupilX = 10.4, pupilY = -10.2;

    if (state.fish.active) {
      const u = state.fish.t / state.fish.dur;
      // Parabolic fish trajectory from beak tip out and right back into open pouch
      const arcH = Math.sin(u * Math.PI) * 108;
      const fx = 212 + Math.sin(u * Math.PI) * 34;
      const fy = -268 - arcH;
      const fRot = -45 + u * 360;
      el("tossed-fish").setAttribute("opacity", "1");
      el("tossed-fish").setAttribute("transform", `translate(${fx.toFixed(1)}, ${fy.toFixed(1)}) rotate(${fRot.toFixed(1)})`);

      headPitch = -Math.sin(u * Math.PI) * 16;
      // Open wide on launch (0..0.22) and wide open to catch (0.72..1.0)
      if (u < 0.25) targetJaw = Math.sin((u / 0.25) * Math.PI) * 28;
      else if (u > 0.68) targetJaw = Math.sin(((u - 0.68) / 0.32) * Math.PI) * 34;
      pupilX = 11.4;
      pupilY = -12.6;
    } else {
      el("tossed-fish").setAttribute("opacity", "0");
    }

    state.jawAngle += (targetJaw - state.jawAngle) * 0.28;
    const jiggle = Math.sin(t * 24) * state.pouchJiggle * 5.5 + Math.sin(phi * 2) * 1.6;
    el("pelican-head").setAttribute("transform", `translate(115, -268) rotate(${headPitch.toFixed(2)})`);
    el("pelican-jaw").setAttribute("transform", `translate(18, 2) rotate(${(state.jawAngle + jiggle * 0.35).toFixed(2)})`);
    el("postman-cap").setAttribute("transform", `translate(-4, ${(-22 - state.hopY * 0.08).toFixed(1)}) rotate(${(-8 - state.hopY * 0.1).toFixed(1)})`);
    el("eye-pupil").setAttribute("cx", pupilX.toFixed(1));
    el("eye-pupil").setAttribute("cy", pupilY.toFixed(1));
    el("eyelid").setAttribute("opacity", state.blinkDur > 0 ? "1" : "0");

    // Basket fish subtle bob
    el("basket-fish").setAttribute("transform", `translate(42, ${(-10 + Math.sin(t * 6) * 2.2).toFixed(1)}) rotate(${(-26 + Math.sin(t * 5) * 5).toFixed(1)})`);

    // Bell visual acoustic rings
    if (state.bellAnim > 0) {
      const p = 1 - state.bellAnim;
      el("bell-rings").setAttribute("opacity", state.bellAnim.toFixed(2));
      el("bell-ring-1").setAttribute("r", (12 + p * 34).toFixed(1));
      el("bell-ring-2").setAttribute("r", (18 + p * 54).toFixed(1));
    } else {
      el("bell-rings").setAttribute("opacity", "0");
    }

    // Update Engineering Blueprint Overlay when active
    if (state.blueprint) {
      el("ik-vec-near").setAttribute("d", legRD);
      el("ik-vec-far").setAttribute("d", legLD);
      el("ik-hip-r").setAttribute("cx", hipR.x.toFixed(1));
      el("ik-hip-r").setAttribute("cy", hipR.y.toFixed(1));
      el("ik-knee-r").setAttribute("cx", ikR.knee.x.toFixed(1));
      el("ik-knee-r").setAttribute("cy", ikR.knee.y.toFixed(1));
      el("ik-ankle-r").setAttribute("cx", ankleR.x.toFixed(1));
      el("ik-ankle-r").setAttribute("cy", ankleR.y.toFixed(1));
      el("ik-knee-l").setAttribute("cx", ikL.knee.x.toFixed(1));
      el("ik-knee-l").setAttribute("cy", ikL.knee.y.toFixed(1));
      el("bp-angles").textContent = `R-KNEE ${ikR.kneeDeg.toFixed(1)}° · L-KNEE ${ikL.kneeDeg.toFixed(1)}°`;
      el("bp-crank").textContent = `CRANK ${String(Math.round(crankDeg)).padStart(3, "0")}° · L1=${L1} L2=${L2}`;
      el("bp-slip").textContent = `WHEEL SLIP 0.00% · RATIO ${GEARS[state.gear].ratio.toFixed(2)}×`;
    }
  }

  let uiTick = 0;
  function renderTelemetry() {
    uiTick++;
    if (uiTick % 4 !== 0) return;
    el("t-speed").textContent = (state.playing ? state.speedKmh : 0).toFixed(1);
    el("t-rpm").textContent = String(state.playing ? Math.round(state.rpm) : 0);
    el("t-ratio").textContent = `RPM · ${GEARS[state.gear].ratio.toFixed(2)}×`;
    el("t-dist").textContent = (state.distanceM / 1000).toFixed(2);
    el("t-fish").textContent = String(state.fish.caught);
    el("t-knee").textContent = `条 · R ${Math.round(latestKneeR)}°`;
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    step(dt);
    requestAnimationFrame(loop);
  }

  /* -------------------- Event Binding -------------------- */
  function bindEvents() {
    document.querySelectorAll(".theme-btn").forEach((btn) => {
      btn.addEventListener("click", () => applyTheme(btn.dataset.theme));
    });

    el("btn-play").addEventListener("click", togglePlay);
    el("btn-bell").addEventListener("click", triggerBell);
    el("btn-fish").addEventListener("click", triggerFishToss);
    el("btn-hop").addEventListener("click", triggerHop);
    el("btn-gust").addEventListener("click", triggerGust);
    el("btn-ik").addEventListener("click", toggleIK);
    el("btn-sound").addEventListener("click", toggleSound);
    el("btn-export").addEventListener("click", exportSVG);

    el("gear-select").addEventListener("change", (e) => {
      state.gear = Number(e.target.value);
      showToast(`已切换至 ${GEARS[state.gear].label}`);
    });

    // Direct SVG hit areas
    el("hit-pelican").addEventListener("click", (e) => { e.stopPropagation(); triggerFishToss(); });
    el("hit-bell").addEventListener("click", (e) => { e.stopPropagation(); triggerBell(); });
    el("hit-road").addEventListener("click", triggerHop);
    el("hit-sky").addEventListener("click", triggerGust);

    // Keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.code === "Space") { e.preventDefault(); triggerHop(); }
      else if (e.key === "p" || e.key === "P") togglePlay();
      else if (e.key === "b" || e.key === "B") triggerBell();
      else if (e.key === "f" || e.key === "F") triggerFishToss();
      else if (e.key === "w" || e.key === "W") triggerGust();
      else if (e.key === "x" || e.key === "X") toggleIK();
      else if (e.key === "m" || e.key === "M") toggleSound();
      else if (e.key === "s" || e.key === "S") { e.preventDefault(); exportSVG(); }
      else if (e.key >= "1" && e.key <= "6") {
        state.gear = Number(e.key);
        el("gear-select").value = e.key;
        showToast(`已切换至 ${GEARS[state.gear].label}`);
      }
    });
  }

  /* -------------------- Boot -------------------- */
  initWheelSpokes();
  initChainTangents();
  initStars();
  initClouds();
  initBirds();
  initIslands();
  initSeaShimmer();
  initBoats();
  initWaves();
  initSeaFish();
  initBalustrade();
  initPromenade();
  initRoadDashes();
  initMileposts();
  initWindRibbons();
  initParticles();
  bindEvents();
  applyTheme("azure");

  if (!state.playing) {
    el("btn-play").setAttribute("aria-pressed", "false");
    el("lbl-play").textContent = "骑行";
    el("ico-play").innerHTML = '<polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/>';
  }

  // Expose deterministic inspection hook for verification
  window.__PELICAN_RIDE__ = {
    state,
    applyTheme,
    triggerBell,
    triggerFishToss,
    triggerHop,
    triggerGust,
    toggleIK,
    step
  };

  step(0.016);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
