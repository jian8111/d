      right: 16px;
      bottom: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(27, 42, 54, 0.9);
      color: #fffdf8;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.2;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;

    .toast.visible {

      transform: translateY(0);

    .controls-panel {
      padding: 16px 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button {

      border: 1px solid var(--border);
      background: var(--bg-page);
      color: var(--ink-main);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.1s ease;
    }

      border-color: var(--accent);
      color: var(--accent);
    }

    button:active {
      transform: translateY(1px);
    }

    button.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.btn-teal.is-active {
      background: var(--teal);
      border-color: var(--teal);
      color: #ffffff;
    }

      gap: 10px;

      font-weight: 600;
      color: var(--ink-muted);
      background: var(--bg-page);
      border: 1px solid var(--border);

      accent-color: var(--accent);

      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--ink-main);
      font-variant-numeric: tabular-nums;
      min-width: 44px;
      text-align: right;

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;

      padding: 10px 14px;

      background: var(--bg-page);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--ink-muted);
    }

    .telemetry-items {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 18px;
    }

    .telemetry-item strong {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: var(--ink-main);
      margin-left: 4px;
    }

    .shortcut-hint {
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

      display: inline-block;
      padding: 1px 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  <script>
    (() => {

      const legEls = {

      const state = {

      // Procedural static geometry helpers (spokes & gear teeth)
      function buildGearPath(cx, cy, teeth, rOuter, rRoot) {
        const parts = [];
        const steps = teeth * 2;
        for (let i = 0; i < steps; i++) {
          const ang = (Math.PI * 2 * i) / steps;
          const r = i % 2 === 0 ? rOuter : rRoot;
          parts.push(`${i === 0 ? "M" : "L"} ${(cx + r * Math.cos(ang)).toFixed(2)} ${(cy + r * Math.sin(ang)).toFixed(2)}`);
        }
        return parts.join(" ") + " Z";
      }

      function populateSpokes(containerId) {
        const g = document.getElementById(containerId);
        const n = 18;
        const rHub = 10.5;
        const rRim = 61.0;
        const cross = 0.48;
        for (let i = 0; i < n; i++) {
          const rimAng = (Math.PI * 2 * i) / n;
          const dir = i % 2 === 0 ? 1 : -1;
          const hubAng = rimAng + dir * cross;
          const line = document.createElementNS(SVG_NS, "line");
          line.setAttribute("x1", (rHub * Math.cos(hubAng)).toFixed(2));
          line.setAttribute("y1", (rHub * Math.sin(hubAng)).toFixed(2));
          line.setAttribute("x2", (rRim * Math.cos(rimAng)).toFixed(2));
          line.setAttribute("y2", (rRim * Math.sin(rimAng)).toFixed(2));
          line.setAttribute("stroke", i % 2 === 0 ? "#cbd5e1" : "#94a3b8");
          line.setAttribute("stroke-width", "1.35");
          line.setAttribute("stroke-linecap", "round");
          g.appendChild(line);
        }
      }

      populateSpokes("rear-spokes");
      populateSpokes("front-spokes");
      document.getElementById("rear-cog-teeth").setAttribute("d", buildGearPath(0, 0, 16, 17.2, 14.4));
      document.getElementById("chainring-teeth").setAttribute("d", buildGearPath(0, 0, 28, 29.5, 26.2));

      // Parallax pools
      const postPool = [];
      for (let i = 0; i < 8; i++) {
        const g = document.createElementNS(SVG_NS, "g");
        const post = document.createElementNS(SVG_NS, "rect");
        post.setAttribute("x", "-5");
        post.setAttribute("y", "346");
        post.setAttribute("width", "10");
        post.setAttribute("height", "32");
        post.setAttribute("rx", "2");
        post.setAttribute("fill", "#7c5836");
        post.setAttribute("stroke", "#5c3e23");
        post.setAttribute("stroke-width", "1");
        g.appendChild(post);
        if (i % 3 === 1) {
          const grass = document.createElementNS(SVG_NS, "path");
          grass.setAttribute("d", "M 48 375 Q 42 356, 36 350 M 52 375 Q 53 352, 58 346 M 56 375 Q 64 358, 70 353");
          grass.setAttribute("fill", "none");
          grass.setAttribute("stroke", "#15803d");
          grass.setAttribute("stroke-width", "2.1");
          grass.setAttribute("stroke-linecap", "round");
          grass.setAttribute("opacity", "0.72");
          g.appendChild(grass);
        }
        els.railPosts.appendChild(g);
        postPool.push(g);
      }

      const dashPool = [];
      for (let i = 0; i < 15; i++) {
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("y1", "508");
        line.setAttribute("y2", "508");
        els.roadDashes.appendChild(line);
        dashPool.push(line);
      }

      const seamPool = [];
      for (let i = 0; i < 8; i++) {
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("y1", "468");
        line.setAttribute("y2", "560");
        els.roadSeams.appendChild(line);
        seamPool.push(line);
      }

      // 2-Bone IK solver
      function solveIK(hip, pedal) {
        const ankle = { x: pedal.x - 8, y: pedal.y - 11 };
        const vx = ankle.x - hip.x;
        const vy = ankle.y - hip.y;
        const rawD = Math.hypot(vx, vy);
        const d = Math.max(Math.abs(L1 - L2) + 1.0, Math.min(L1 + L2 - 1.0, rawD));
        const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
        const ux = vx / (rawD || 1);
        const uy = vy / (rawD || 1);
        const knee = {
          x: hip.x + a * ux + h * uy,
          y: hip.y + a * uy - h * ux
        };
        const cosK = (L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2);
        const kneeDeg = (Math.acos(Math.max(-1, Math.min(1, cosK))) * 180) / Math.PI;
        return { hip, knee, ankle, kneeDeg };
      }

      function updateLeg(target, ik, pedal) {
        const { hip, knee, ankle } = ik;
        const dx1 = knee.x - hip.x;
        const dy1 = knee.y - hip.y;
        const len1 = Math.hypot(dx1, dy1) || 1;
        const nx1 = -dy1 / len1;
        const ny1 = dx1 / len1;
        const ux1 = dx1 / len1;
        const uy1 = dy1 / len1;

        const p1x = hip.x + nx1 * 14.5;
        const p1y = hip.y + ny1 * 14.5;
        const p2x = hip.x - nx1 * 12.5;
        const p2y = hip.y - ny1 * 12.5;
        const capX = hip.x - ux1 * 12.0;
        const capY = hip.y - uy1 * 12.0;
        const midX = hip.x + dx1 * 0.5;
        const midY = hip.y + dy1 * 0.5;
        const m1x = midX + nx1 * 11.5;
        const m1y = midY + ny1 * 11.5;
        const m2x = midX - nx1 * 8.5;
        const m2y = midY - ny1 * 8.5;
        const k1x = knee.x + nx1 * 5.8;
        const k1y = knee.y + ny1 * 5.8;
        const k2x = knee.x - nx1 * 5.8;
        const k2y = knee.y - ny1 * 5.8;

        const thighD =
          `M ${p1x.toFixed(2)} ${p1y.toFixed(2)} ` +
          `Q ${m1x.toFixed(2)} ${m1y.toFixed(2)}, ${k1x.toFixed(2)} ${k1y.toFixed(2)} ` +
          `A 5.8 5.8 0 0 1 ${k2x.toFixed(2)} ${k2y.toFixed(2)} ` +
          `Q ${m2x.toFixed(2)} ${m2y.toFixed(2)}, ${p2x.toFixed(2)} ${p2y.toFixed(2)} ` +
          `Q ${capX.toFixed(2)} ${capY.toFixed(2)}, ${p1x.toFixed(2)} ${p1y.toFixed(2)} Z`;

        target.thigh.setAttribute("d", thighD);
        target.shin.setAttribute("x1", knee.x.toFixed(2));
        target.shin.setAttribute("y1", knee.y.toFixed(2));
        target.shin.setAttribute("x2", ankle.x.toFixed(2));
        target.shin.setAttribute("y2", ankle.y.toFixed(2));
        target.knee.setAttribute("cx", knee.x.toFixed(2));
        target.knee.setAttribute("cy", knee.y.toFixed(2));

        const px = pedal.x;
        const py = pedal.y;
        const ax = ankle.x;
        const ay = ankle.y;
        const footD =
          `M ${(ax - 4.5).toFixed(2)} ${(ay + 1).toFixed(2)} ` +
          `Q ${(ax - 2).toFixed(2)} ${(py - 1).toFixed(2)}, ${(px - 10).toFixed(2)} ${(py - 2.5).toFixed(2)} ` +
          `L ${(px + 16).toFixed(2)} ${(py - 3).toFixed(2)} ` +
          `Q ${(px + 21).toFixed(2)} ${(py - 4.5).toFixed(2)}, ${(px + 15).toFixed(2)} ${(py - 7).toFixed(2)} ` +
          `Q ${(px + 2).toFixed(2)} ${(ay + 1).toFixed(2)}, ${(ax + 3.5).toFixed(2)} ${(ay - 1.5).toFixed(2)} Z`;

        target.foot.setAttribute("d", footD);
        target.toe1.setAttribute("x1", (ax + 1).toFixed(2));
        target.toe1.setAttribute("y1", (ay + 1).toFixed(2));
        target.toe1.setAttribute("x2", (px + 14).toFixed(2));
        target.toe1.setAttribute("y2", (py - 4.8).toFixed(2));
        target.toe2.setAttribute("x1", ax.toFixed(2));
        target.toe2.setAttribute("y1", (ay + 2.5).toFixed(2));
        target.toe2.setAttribute("x2", (px + 11).toFixed(2));
        target.toe2.setAttribute("y2", (py - 3.2).toFixed(2));
      }

      function updateScarf(t) {
        const amp = state.playing ? 3.5 + state.speed * 2.5 : 1.8;
        const w1 = Math.sin(t * 7.2) * amp;
        const w2 = Math.cos(t * 6.4 + 1.1) * amp;

        els.scarfNavy.setAttribute(
          "d",
          `M 398 146 C 372 ${(142 + w1 * 0.45).toFixed(1)}, 344 ${(156 - w1 * 0.7).toFixed(1)}, 314 ${(148 + w1).toFixed(1)} Q 320 ${(156 + w1).toFixed(1)}, 316 ${(162 + w1).toFixed(1)} C 346 ${(166 - w1 * 0.6).toFixed(1)}, 374 ${(154 + w1 * 0.35).toFixed(1)}, 398 156 Z`
        );
        els.scarfNavyStripe.setAttribute(
          "d",
          `M 358 ${(150 - w1 * 0.3).toFixed(1)} L 354 ${(159 - w1 * 0.3).toFixed(1)} M 338 ${(152 + w1 * 0.4).toFixed(1)} L 335 ${(161 + w1 * 0.4).toFixed(1)}`
        );
        els.scarfRed.setAttribute(
          "d",
          `M 398 154 C 368 ${(158 + w2 * 0.4).toFixed(1)}, 344 ${(176 - w2 * 0.65).toFixed(1)}, 316 ${(172 + w2).toFixed(1)} Q 322 ${(180 + w2).toFixed(1)}, 318 ${(186 + w2).toFixed(1)} C 348 ${(188 - w2 * 0.55).toFixed(1)}, 372 ${(168 + w2 * 0.3).toFixed(1)}, 398 162 Z`
        );
        els.scarfRedStripe.setAttribute(
          "d",
          `M 358 ${(166 - w2 * 0.3).toFixed(1)} L 355 ${(175 - w2 * 0.3).toFixed(1)} M 338 ${(173 + w2 * 0.45).toFixed(1)} L 336 ${(182 + w2 * 0.45).toFixed(1)}`
        );
      }

      function renderScene() {
        const theta = state.crankRad;
        const wheelRad = theta * GEAR_RATIO;
        const wheelDeg = ((wheelRad * 180) / Math.PI) % 360;
        const crankDeg = ((theta * 180) / Math.PI) % 360;

        els.rearWheelSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.frontWheelSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.rearCogSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.chainringSpin.setAttribute("transform", `rotate(${crankDeg.toFixed(2)})`);
        els.chainLinks.setAttribute("stroke-dashoffset", (-R_CHAIN * theta).toFixed(2));

        // Near & far pedals
        const nearPedal = {
          x: BB.x + L_CRANK * Math.cos(theta),
          y: BB.y + L_CRANK * Math.sin(theta)
        };
        const farPedal = {
          x: BB.x + L_CRANK * Math.cos(theta + Math.PI),
          y: BB.y + L_CRANK * Math.sin(theta + Math.PI)
        };

        els.nearCrank.setAttribute("x2", nearPedal.x.toFixed(2));
        els.nearCrank.setAttribute("y2", nearPedal.y.toFixed(2));
        els.nearPedalGroup.setAttribute("transform", `translate(${nearPedal.x.toFixed(2)}, ${nearPedal.y.toFixed(2)})`);

        els.farCrank.setAttribute("x2", farPedal.x.toFixed(2));
        els.farCrank.setAttribute("y2", farPedal.y.toFixed(2));
        els.farPedal.setAttribute("x", (farPedal.x - 13).toFixed(2));
        els.farPedal.setAttribute("y", (farPedal.y - 3.5).toFixed(2));

        // Pelican bob & IK
        const bob = 2.5 * Math.sin(2 * theta);
        els.pelicanTorso.setAttribute("transform", `translate(0, ${bob.toFixed(2)})`);
        els.nearWingGroup.setAttribute("transform", `translate(0, ${(bob * 0.45).toFixed(2)})`);
        els.farWingGroup.setAttribute("transform", `translate(0, ${(bob * 0.45).toFixed(2)})`);

        const hipNear = { x: 376, y: 204 + bob };
        const hipFar = { x: 384, y: 202 + bob };
        const nearIK = solveIK(hipNear, nearPedal);
        const farIK = solveIK(hipFar, farPedal);

        updateLeg(legEls.far, farIK, farPedal);
        updateLeg(legEls.near, nearIK, nearPedal);

        // Blueprint live vectors
        els.bpFarVec1.setAttribute("x1", farIK.hip.x);
        els.bpFarVec1.setAttribute("y1", farIK.hip.y);
        els.bpFarVec1.setAttribute("x2", farIK.knee.x);
        els.bpFarVec1.setAttribute("y2", farIK.knee.y);
        els.bpFarVec2.setAttribute("x1", farIK.knee.x);
        els.bpFarVec2.setAttribute("y1", farIK.knee.y);
        els.bpFarVec2.setAttribute("x2", farIK.ankle.x);
        els.bpFarVec2.setAttribute("y2", farIK.ankle.y);

        els.bpNearVec1.setAttribute("x1", nearIK.hip.x);
        els.bpNearVec1.setAttribute("y1", nearIK.hip.y);
        els.bpNearVec1.setAttribute("x2", nearIK.knee.x);
        els.bpNearVec1.setAttribute("y2", nearIK.knee.y);
        els.bpNearVec2.setAttribute("x1", nearIK.knee.x);
        els.bpNearVec2.setAttribute("y1", nearIK.knee.y);
        els.bpNearVec2.setAttribute("x2", nearIK.ankle.x);
        els.bpNearVec2.setAttribute("y2", nearIK.ankle.y);

        els.bpHipDot.setAttribute("cx", nearIK.hip.x);
        els.bpHipDot.setAttribute("cy", nearIK.hip.y);
        els.bpKneeDot.setAttribute("cx", nearIK.knee.x);
        els.bpKneeDot.setAttribute("cy", nearIK.knee.y);
        els.bpAnkleDot.setAttribute("cx", nearIK.ankle.x);
        els.bpAnkleDot.setAttribute("cy", nearIK.ankle.y);
        els.bpKneeLabel.setAttribute("x", nearIK.knee.x + 9);
        els.bpKneeLabel.setAttribute("y", nearIK.knee.y - 6);
        els.bpKneeLabel.textContent = `K ${Math.round(nearIK.kneeDeg)}°`;

        // Parallax ground & scenic layers
        const roadWrap = 72;
        const rMod = ((state.roadOffset % roadWrap) + roadWrap) % roadWrap;
        for (let i = 0; i < dashPool.length; i++) {
          const x = i * roadWrap - rMod - 40;
          dashPool[i].setAttribute("x1", x.toFixed(1));
          dashPool[i].setAttribute("x2", (x + 38).toFixed(1));
        }

        const seamWrap = 150;
        const sMod = ((state.roadOffset % seamWrap) + seamWrap) % seamWrap;
        for (let i = 0; i < seamPool.length; i++) {
          const x = i * seamWrap - sMod - 40;
          seamPool[i].setAttribute("x1", x.toFixed(1));
          seamPool[i].setAttribute("x2", (x - 45).toFixed(1));
        }

        const postWrap = 150;
        const pMod = ((state.railOffset % postWrap) + postWrap) % postWrap;
        for (let i = 0; i < postPool.length; i++) {
          const x = i * postWrap - pMod - 60;
          postPool[i].setAttribute("transform", `translate(${x.toFixed(1)}, 0)`);
        }

        const cWrap = 1220;
        const wrapX = (baseX, dist, padLeft, span) => {
          const x = (((baseX - dist + padLeft) % span) + span) % span - padLeft;
          return x - baseX;
        };
        els.cloud0.setAttribute("transform", `translate(${wrapX(78, state.cloudOffset * 0.9, 240, cWrap).toFixed(1)}, 0)`);
        els.cloud1.setAttribute("transform", `translate(${wrapX(258, state.cloudOffset * 0.65, 240, cWrap).toFixed(1)}, 0)`);
        els.cloud2.setAttribute("transform", `translate(${wrapX(628, state.cloudOffset * 1.1, 240, cWrap).toFixed(1)}, 0)`);

        const bWrap = 1080;
        const bx0 = (((262 - state.boatOffset + 60) % bWrap) + bWrap) % bWrap - 60;
        const bx1 = (((835 - state.boatOffset * 0.72 + 60) % bWrap) + bWrap) % bWrap - 60;
        const bobBoat0 = Math.sin(state.elapsed * 2.1) * 1.6;
        const bobBoat1 = Math.cos(state.elapsed * 1.8) * 1.4;
        els.boat0.setAttribute("transform", `translate(${bx0.toFixed(1)}, ${(294 + bobBoat0).toFixed(2)})`);
        els.boat1.setAttribute("transform", `translate(${bx1.toFixed(1)}, ${(304 + bobBoat1).toFixed(2)}) scale(0.85)`);

        // Scarf & basket fish wiggle
        updateScarf(state.elapsed);
        const fishWiggle = Math.sin(state.elapsed * 5.0) * 3.0;
        els.basketFish.setAttribute("transform", `translate(636, 185) rotate(${(14 + fishWiggle).toFixed(2)})`);

        // Bell shake & beak open
        if (state.bellShake > 0) {
          const shake = Math.sin(state.bellShake * 48) * 6 * state.bellShake;
          els.bellDome.setAttribute("transform", `rotate(${shake.toFixed(2)} 0 0)`);
          els.bellClapper.setAttribute("cx", (9 + Math.sin(state.bellShake * 55) * 2.5).toFixed(2));
        } else {
          els.bellDome.setAttribute("transform", "");
          els.bellClapper.setAttribute("cx", "9");
        }

        if (state.beakOpen > 0) {
          const openDeg = Math.sin(state.beakOpen * Math.PI) * 18;
          els.pelicanPouch.setAttribute("transform", `rotate(${openDeg.toFixed(2)} 472 88)`);
          els.pelicanUpperBill.setAttribute("transform", `rotate(${(-openDeg * 0.45).toFixed(2)} 472 85)`);
          els.pelicanHead.setAttribute("transform", `rotate(${(-openDeg * 0.25).toFixed(2)} 435 125)`);
        } else {
          els.pelicanPouch.setAttribute("transform", "rotate(0 472 88)");
          els.pelicanUpperBill.setAttribute("transform", "rotate(0 472 85)");
          els.pelicanHead.setAttribute("transform", "");
        }

        // Lighthouse beam gentle sweep in night/sunset
        if (state.mode === "night" || state.mode === "sunset") {
          const sweep = Math.sin(state.elapsed * 1.1) * 7;
          els.lighthouseBeam.setAttribute("transform", `rotate(${sweep.toFixed(2)} 16 9)`);
        }

        // Telemetry readout
        const normDeg = (((crankDeg % 360) + 360) % 360);
        const rpm = state.playing ? Math.round(BASE_CRANK_RPS * 60 * state.speed) : 0;
        const pxPerSec = state.playing ? Math.round(BASE_CRANK_RPS * Math.PI * 2 * GEAR_RATIO * R_TIRE * state.speed) : 0;
        els.teleCrank.textContent = `${Math.round(normDeg)}°`;
        els.teleRpm.textContent = `${rpm} RPM`;
        els.teleKnee.textContent = `${Math.round(nearIK.kneeDeg)}°`;
        els.teleSpeed.textContent = `${pxPerSec} px/s`;
      }

      // Scene lighting presets
      const PRESETS = {
        morning: {
          sky: ["#60b8eb", "#bae6fd", "#fef3c7", "#fde68a"],
          sea: ["#0369a1", "#0284c7", "#38bdf8"],
          road: ["#e5d4b7", "#d7c29f", "#b99e74"],
          sunOpacity: "1",
          sunColor: "#fffbeb",
          nightOpacity: "0",
          lighthouseOpacity: "0",
          autoLight: false,
          viewportBg: "#93d5f5"
        },
        sunset: {
          sky: ["#5b3a70", "#d96b6b", "#f6a66a", "#fde09d"],
          sea: ["#3d3b66", "#7c4c6b", "#e08b63"],
          road: ["#c7a282", "#ad8567", "#85624a"],
          sunOpacity: "0.95",
          sunColor: "#fed7aa",
          nightOpacity: "0.18",
          lighthouseOpacity: "0.45",
          autoLight: true,
          viewportBg: "#d96b6b"
        },
        night: {
          sky: ["#0b1426", "#162447", "#1f3a60", "#294870"],
          sea: ["#071222", "#0c223f", "#14375e"],
          road: ["#58616e", "#454d59", "#2f3640"],
          sunOpacity: "0",
          sunColor: "#fffbeb",
          nightOpacity: "1",
          lighthouseOpacity: "0.88",
          autoLight: true,
          viewportBg: "#0b1426"
        },
        blueprint: {
          sky: ["#0b2239", "#0b2239", "#0b2239", "#0b2239"],
          sea: ["#0e2e4d", "#0e2e4d", "#0e2e4d"],
          road: ["#102a43", "#102a43", "#102a43"],
          sunOpacity: "0.18",
          sunColor: "#38bdf8",
          nightOpacity: "0",
          lighthouseOpacity: "0",
          autoLight: false,
          viewportBg: "#0b2239"
        }
      };

      function applyMode(mode) {
        state.mode = mode;
        const p = PRESETS[mode];
        p.sky.forEach((c, idx) => els.skyStops[idx].setAttribute("stop-color", c));
        p.sea.forEach((c, idx) => els.seaStops[idx].setAttribute("stop-color", c));
        p.road.forEach((c, idx) => els.roadStops[idx].setAttribute("stop-color", c));
        els.sunGroup.setAttribute("opacity", p.sunOpacity);
        els.sunCore.setAttribute("fill", p.sunColor);
        els.nightExtras.setAttribute("opacity", p.nightOpacity);
        els.lighthouseBeam.setAttribute("opacity", p.lighthouseOpacity);
        svg.parentElement.style.background = p.viewportBg;
        svg.classList.toggle("blueprint-mode", mode === "blueprint");

        setHeadlight(p.autoLight);

        document.querySelectorAll("[data-mode]").forEach((btn) => {
          btn.classList.toggle("is-active", btn.dataset.mode === mode);
        });
      }

      function setHeadlight(on) {
        state.headlightOn = on;
        els.headlightBeam.setAttribute("opacity", on ? (state.mode === "night" ? "0.95" : "0.7") : "0");
        els.headlightLens.setAttribute("fill", on ? "#fffbeb" : "#fef08a");
        const lightBtn = document.getElementById("lightBtn");
        lightBtn.classList.toggle("is-active", on);
        lightBtn.setAttribute("aria-pressed", String(on));
      }

      function setBasketVisible(visible) {
        state.basketVisible = visible;
        els.wickerBasket.setAttribute("opacity", visible ? "1" : "0");
        const basketBtn = document.getElementById("basketBtn");
        basketBtn.classList.toggle("is-active", visible);
        basketBtn.setAttribute("aria-pressed", String(visible));
      }

      // Web Audio synthesizer (zero external sound files)
      let audioCtx = null;
      function getAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playBellSound() {
        const ctx = getAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        [0, 0.14].forEach((offset) => {
          [1760, 2640, 3540].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = idx === 0 ? "sine" : "triangle";
            osc.frequency.setValueAtTime(freq, now + offset);
            gain.gain.setValueAtTime(0.0001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.11 / (idx + 1), now + offset + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.52);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.55);
          });
        });
      }

      function playFishChirpSound() {
        const ctx = getAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(480, now + 0.28);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.12, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.34);
      }

      function spawnFxParticle(type) {
        const g = document.createElementNS(SVG_NS, "g");
        if (type === "note") {
          const text = document.createElementNS(SVG_NS, "text");
          text.textContent = Math.random() > 0.5 ? "♪" : "♫";
          text.setAttribute("font-size", "20");
          text.setAttribute("font-weight", "700");
          text.setAttribute("fill", state.mode === "night" || state.mode === "blueprint" ? "#fde047" : "#b83720");
          g.appendChild(text);
          els.fxLayer.appendChild(g);
          state.fxParticles.push({
            el: g,
            x: 560 + (Math.random() - 0.5) * 10,
            y: 170,
            vx: (Math.random() - 0.35) * 35,
            vy: -55 - Math.random() * 25,
            life: 1.0,
            maxLife: 1.0,
            gravity: 0
          });
        } else if (type === "fish") {
          const fish = document.createElementNS(SVG_NS, "path");
          fish.setAttribute("d", "M -11 0 C -4 -7, 6 -7, 12 0 C 6 7, -4 7, -11 0 M -11 0 L -17 -5 L -16 5 Z");
          fish.setAttribute("fill", "#cbd5e1");
          fish.setAttribute("stroke", "#1e293b");
          fish.setAttribute("stroke-width", "1.3");
          const eye = document.createElementNS(SVG_NS, "circle");
          eye.setAttribute("cx", "6");
          eye.setAttribute("cy", "-1.5");
          eye.setAttribute("r", "1.5");
          eye.setAttribute("fill", "#0f172a");
          g.appendChild(fish);
          g.appendChild(eye);
          els.fxLayer.appendChild(g);
          state.fxParticles.push({
            el: g,
            x: 546,
            y: 118,
            vx: -28 + Math.random() * 44,
            vy: -170,
            life: 1.35,
            maxLife: 1.35,
            gravity: 270,
            spin: -220 + Math.random() * 140
          });
          for (let i = 0; i < 4; i++) {
            const drop = document.createElementNS(SVG_NS, "circle");
            drop.setAttribute("r", "2.6");
            drop.setAttribute("fill", "#7dd3fc");
            els.fxLayer.appendChild(drop);
            state.fxParticles.push({
              el: drop,
              x: 546,
              y: 118,
              vx: -50 + Math.random() * 90,
              vy: -110 - Math.random() * 60,
              life: 0.75,
              maxLife: 0.75,
              gravity: 260
            });
          }
        }
      }

      function triggerBell() {
        state.bellShake = 1.0;
        playBellSound();
        spawnFxParticle("note");
        setTimeout(() => spawnFxParticle("note"), 120);
        showToast("叮铃铃！海岸铜车铃已响");
      }

      function triggerPouchFish() {
        state.beakOpen = 1.0;
        playFishChirpSound();
        spawnFxParticle("fish");
        showToast("噗噜！小海鱼从喉囊里蹦出来了");
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("visible");
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => toastEl.classList.remove("visible"), 2200);
      }

      // Clean serialized SVG string for copy/download
      function serializeCurrentSvg() {
        const clone = svg.cloneNode(true);
        clone.setAttribute("xmlns", SVG_NS);
        clone.setAttribute("width", "960");
        clone.setAttribute("height", "560");
        clone.removeAttribute("id");
        clone.classList.remove("blueprint-mode");
        const fx = clone.querySelector("#fx-layer");
        if (fx) fx.innerHTML = "";
        return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
      }

      // Main animation loop
      function tick(ts) {
        if (!state.lastTs) state.lastTs = ts;
        const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
        state.lastTs = ts;
        state.elapsed += dt;

        if (state.playing) {
          const dCrank = BASE_CRANK_RPS * Math.PI * 2 * state.speed * dt;
          const dWheel = dCrank * GEAR_RATIO;
          const dRoad = R_TIRE * dWheel;
          state.crankRad += dCrank;
          state.roadOffset += dRoad;
          state.railOffset += dRoad * 0.45;
          state.cloudOffset += 14 * state.speed * dt;
          state.boatOffset += 12 * state.speed * dt;
        }

        // Natural blink
        state.blinkTimer -= dt;
        if (state.blinkTimer <= 0) {
          state.blinkLeft = 0.14;
          state.blinkTimer = 2.6 + Math.random() * 2.8;
        }
        if (state.blinkLeft > 0) {
          state.blinkLeft = Math.max(0, state.blinkLeft - dt);
          els.pelicanEyelid.setAttribute("opacity", state.blinkLeft > 0 ? "1" : "0");
        }

        if (state.bellShake > 0) {
          state.bellShake = Math.max(0, state.bellShake - dt * 1.45);
        }
        if (state.beakOpen > 0) {
          state.beakOpen = Math.max(0, state.beakOpen - dt * 1.9);
        }

        // Particle physics
        for (let i = state.fxParticles.length - 1; i >= 0; i--) {
          const p = state.fxParticles[i];
          p.life -= dt;
          if (p.life <= 0) {
            p.el.remove();
            state.fxParticles.splice(i, 1);
            continue;
          }
          p.vy += (p.gravity || 0) * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          const alpha = Math.min(1, p.life / (p.maxLife * 0.45));
          const rot = p.spin ? ` rotate(${((p.maxLife - p.life) * p.spin).toFixed(1)})` : "";
          p.el.setAttribute("transform", `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)})${rot}`);
          p.el.setAttribute("opacity", alpha.toFixed(2));
        }

        renderScene();
        requestAnimationFrame(tick);
      }

      // Wire UI controls
      const playPauseBtn = document.getElementById("playPauseBtn");
      function togglePlay(force) {
        state.playing = typeof force === "boolean" ? force : !state.playing;
        playPauseBtn.textContent = state.playing ? "⏸ 暂停骑行" : "▶ 继续骑行";
        playPauseBtn.classList.toggle("is-active", state.playing);
        playPauseBtn.setAttribute("aria-pressed", String(state.playing));
      }

      playPauseBtn.addEventListener("click", () => togglePlay());
      document.getElementById("stepBtn").addEventListener("click", () => {
        togglePlay(false);
        const dCrank = (15 * Math.PI) / 180;
        const dRoad = R_TIRE * dCrank * GEAR_RATIO;
        state.crankRad += dCrank;
        state.roadOffset += dRoad;
        state.railOffset += dRoad * 0.45;
        renderScene();
      });

      const speedSlider = document.getElementById("speedSlider");
      const speedReadout = document.getElementById("speedReadout");
      speedSlider.addEventListener("input", () => {
        state.speed = parseFloat(speedSlider.value);
        speedReadout.textContent = `${state.speed.toFixed(2)}×`;
      });

      document.querySelectorAll("[data-mode]").forEach((btn) => {
        btn.addEventListener("click", () => applyMode(btn.dataset.mode));
      });

      document.getElementById("bellBtn").addEventListener("click", triggerBell);
      els.brassBell.addEventListener("click", (e) => {
        e.stopPropagation();
        triggerBell();
      });

      document.getElementById("fishBtn").addEventListener("click", triggerPouchFish);
      els.pelicanPouch.addEventListener("click", triggerPouchFish);
      document.getElementById("pelican-rider").addEventListener("click", triggerPouchFish);

      document.getElementById("basketBtn").addEventListener("click", () => setBasketVisible(!state.basketVisible));
      document.getElementById("lightBtn").addEventListener("click", () => setHeadlight(!state.headlightOn));

      document.getElementById("copySvgBtn").addEventListener("click", async () => {
        const text = serializeCurrentSvg();
        try {
          await navigator.clipboard.writeText(text);
          showToast("已复制当前帧 SVG 源码");
        } catch {
          showToast("剪贴板不可用，请使用下载按钮");
        }
      });

      document.getElementById("downloadSvgBtn").addEventListener("click", () => {
        const blob = new Blob([serializeCurrentSvg()], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pelican-bicycle-pro6.svg";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        showToast("已导出 pelican-bicycle-pro6.svg");
      });

      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        const k = e.key.toLowerCase();
        if (e.code === "Space") {
          e.preventDefault();
          togglePlay();
        } else if (k === "1") {
          applyMode("morning");
        } else if (k === "2") {
          applyMode("sunset");
        } else if (k === "3") {
          applyMode("night");
        } else if (k === "4") {
          applyMode("blueprint");
        } else if (k === "b") {
          triggerBell();
        } else if (k === "f") {
          triggerPouchFish();
        } else if (k === "k") {
          setBasketVisible(!state.basketVisible);
        } else if (k === "l") {
          setHeadlight(!state.headlightOn);
        } else if (e.key === "ArrowRight" || e.key === ".") {
          document.getElementById("stepBtn").click();
        }
      });

      // Initialize first frame cleanly
      applyMode("morning");
      renderScene();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
